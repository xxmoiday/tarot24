id: nam_toi_12
ten_vi: Mười hai lá năm tới
ten_en: Twelve Card Year Ahead
nhom: chuyen_de
so_la: 12
mo_ta: Mười hai lá xếp thành vòng tròn cho mười hai tháng tới, tính từ tháng bạn rút chứ không theo lịch. Để nhìn đường đi của cả năm, quý nào nặng, quý nào mở ra, và cái gì đọng lại khi năm khép.
hop_voi:
- Năm tới của mình thế nào
- Sang năm chuyện đi làm của mình chuyển ra sao
- Năm tới mình nên dồn sức vào quãng nào
- Nhìn giúp mình cả năm tới một lượt
khong_hop_voi:
- Tháng nào trong năm thì nên cưới
- Năm tới có gặp hạn gì không
- Năm tới có nên mua nhà không
cach_rut: Xào bài, rút mười hai lá và đặt thành một vòng tròn theo chiều kim đồng hồ, lá một ở đỉnh vòng, mỗi lá là một tháng kể từ tháng bạn đang rút.
vi_tri:
- stt: 1
  ten: Tháng thứ nhất
  cau_hoi: Năm này mở ra bằng cái gì, tháng đầu đặt người hỏi vào tâm thế nào
  goi_y_doc: Đọc như câu mở của cả năm, nói cái được đặt xuống ở đây còn theo người hỏi về sau. Lá nhẹ là năm mở có đà, lá nặng là năm mở bằng một thứ phải đi qua. Lá ngược thiên về cái mở ra còn chậm hoặc chưa rõ hình.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 2
  ten: Tháng thứ hai
  cau_hoi: Sang tháng sau, cái mở ra ở tháng đầu chuyển thế nào
  goi_y_doc: Đọc nối với lá một, không đọc rời. Hai lá cùng chất thì gộp một câu. Lá ngược ở đây thường là chuyện chưa chạy được như tháng đầu tưởng.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 3
  ten: Tháng thứ ba
  cau_hoi: Quý mở khép lại thế nào, cái gì còn kẹt lại từ đoạn này
  goi_y_doc: Đọc như điểm khép của quý đầu. Lá nặng ở đây là chỗ kẹt của quý mở, nói gọn cái kẹt rồi chỉ chỗ gỡ. Lá nhẹ là cái vốn mang được sang quý sau.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 4
  ten: Tháng thứ tư
  cau_hoi: Quý hai mở ra bằng gì, có gì khác quý đầu
  goi_y_doc: Nói cho ra chỗ bàn bắt đầu đổi so với quý mở. Lá hoàng gia ở đây đọc theo la_tinh_huong trừ khi câu hỏi có một người cụ thể. Lá nhẹ sau một quý nặng là chỗ dễ thở, nói rõ nên dùng nó vào việc gì.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 5
  ten: Tháng thứ năm
  cau_hoi: Giữa quý hai, cái gì đang lớn lên và cái gì đang chậm
  goi_y_doc: Đọc nối với lá bốn. Lá tĩnh ở đây là quãng phải chờ, không phải quãng hỏng; lá động là quãng nên đẩy. Lá ngược thiên về chuyện cần làm khác cách người hỏi vẫn làm.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 6
  ten: Tháng thứ sáu
  cau_hoi: Nửa năm đầu khép lại ở đâu, người hỏi đang đứng chỗ nào
  goi_y_doc: Đây là điểm giữa của cả năm, đọc kỹ hơn các tháng thường và dùng nó để nói nửa đầu năm đi lên hay đi xuống. Ẩn Chính ở đây là quãng không nằm hết trong tay người hỏi, nói rõ chỗ đó.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 7
  ten: Tháng thứ bảy
  cau_hoi: Nửa sau năm mở ra bằng gì
  goi_y_doc: Đọc như câu mở của nửa sau, nói cho ra nó khác nửa đầu chỗ nào. Lá ngược ở đây thiên về nửa sau bắt đầu chậm. Lá nặng không phải điềm xấu, là thứ phải đi qua để sang được đoạn sau.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 8
  ten: Tháng thứ tám
  cau_hoi: Cái gì thành hình hoặc được nhìn thấy ở quãng này
  goi_y_doc: Đọc như chỗ công sức nửa đầu năm hiện ra thành cái thấy được. Lá nhẹ ở đây là quãng dễ thở nhất năm, nói rõ nên dùng nó vào việc gì. Lá nặng là cái phải trả cho những gì đã làm.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 9
  ten: Tháng thứ chín
  cau_hoi: Quý ba khép lại thế nào, cái gì đang qua đi
  goi_y_doc: Đọc như điểm khép của quý ba, hợp với chuyện một đoạn đang hết. Lá ngược ở đây thường là cái nặng đang dịu, đừng máy móc làm nặng thêm. Nói gọn, để chỗ cho quý cuối.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 10
  ten: Tháng thứ mười
  cau_hoi: Quý cuối mở ra bằng gì, người hỏi cần đổi cách nào
  goi_y_doc: Đọc như chỗ năm quay đầu về, thường là quãng thu lại hơn là quãng mở ra. Ẩn Chính ở đây là quãng phải chịu chứ không phải quãng đẩy. Lá hoàng gia đọc theo la_nang_luong, là tâm thế nên giữ cho hết năm.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 11
  ten: Tháng thứ mười một
  cau_hoi: Gần cuối năm, cái gì tới tay và cái gì dễ bị bỏ lỡ
  goi_y_doc: Đọc nối với lá mười. Lá nhẹ ở đây nói cái đã tới tay, nhưng dùng canh_bao để nói luôn mặt hụt của nó. Lá nặng là chỗ hụt cuối năm, nói gọn rồi chỉ chỗ làm được.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 12
  ten: Tháng thứ mười hai
  cau_hoi: Năm này khép lại ở đâu, cái gì đọng lại mang sang năm sau
  goi_y_doc: Đọc như điểm khép của cả vòng, nói cái đọng lại chứ không nói một sự kiện. Lá nhẹ là năm khép có nền, lá nặng là năm khép còn dở, nói rõ cái dở đó mang sang năm sau dạng gì. Đây là lá quay về ở đoạn kết.
  lang_kinh_uu_tien: theo_cau_hoi
luat_doc:
- Mười hai lá thì không luận rời từng tháng; đi theo bốn quý, mỗi quý một mạch, nói kỹ ba bốn tháng lệch hẳn khỏi phần còn lại, các tháng còn lại mỗi tháng một câu và gộp những tháng cùng nhịp.
- Đếm tháng từ tháng người hỏi rút, gọi bằng tháng đầu, tháng thứ tư, nửa sau năm, quý cuối; không gọi tên tháng dương lịch hay âm lịch, không nói ngày, không nói mùa, không nhắc Tết.
- Không hứa sự kiện cho tháng nào; mỗi tháng nói về đà, tâm thế và chỗ nên dồn sức hay giữ sức. Câu hỏi về bệnh, sinh tử, thai sản, kiện tụng hay mua bán đầu tư trong năm thì chuyển hướng theo mục 5 của system prompt rồi mới đọc phần đọc được.
- Tháng nào ra Ẩn Chính là quãng không nằm hết trong tay người hỏi, nói rõ chỗ đó; hai Ẩn Chính liền nhau thì cả quãng ấy là chỗ phải chịu, không phải chỗ đẩy.
- Mở bài bằng một câu về đường đi của cả năm, chất nào chiếm bàn, nặng ở quý nào và mở ra ở quý nào; kết bằng một việc giữ được suốt năm chứ không phải việc của một tuần, và quay về lá mười hai để nói cái đọng lại.
