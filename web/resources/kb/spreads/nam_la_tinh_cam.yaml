id: nam_la_tinh_cam
ten_vi: Năm lá chuyện tình cảm
ten_en: Five Card Relationship
nhom: co_ban
so_la: 5
mo_ta: Cho một mối đang có hoặc đang tìm hiểu. Năm lá nhìn phía mình, phía người kia, cái đang nối, cái đang cản và hướng mối này đang đi.
hop_voi:
- Mối này có đi xa được không
- Mình với người đó đang ở đâu, có nên tiếp tục tìm hiểu không
- Hai đứa dạo này lạnh nhạt, tại đâu
- Mình còn nên chờ người này không
khong_hop_voi:
- Người đó có đang ngoại tình không
- Có nên cưới hay chia tay, chọn giúp mình
- Bao giờ mình gặp được người yêu
cach_rut: Xào bài, rút năm lá; hai lá đầu đặt cạnh nhau như hai người đối diện, lá ba đặt giữa, lá bốn đặt dưới, lá năm đặt trên cùng.
vi_tri:
- stt: 1
  ten: Bạn trong chuyện này
  cau_hoi: Người hỏi đang đứng trong mối này với tâm thế gì, đang cho đi và đang giữ lại cái gì
  goi_y_doc: Đọc theo lăng kính tinh_cam, lấy tam_ly làm nền. Lá nặng là chỗ người hỏi đang mệt hoặc đang phòng thủ; lá nhẹ là chỗ người hỏi đang thật lòng hoặc đang dễ dãi quá. Lá ngược thiên về người hỏi đang giấu hoặc chưa tự thấy điều đó. Lá hoàng gia đọc theo la_nang_luong, là cách người hỏi đang cư xử trong mối này.
  lang_kinh_uu_tien: tinh_cam
- stt: 2
  ten: Người kia trong chuyện này
  cau_hoi: Trong mối này, bài đang cho thấy gì về phía người kia, cách người đó đang đứng và đang cho đi
  goi_y_doc: Chỉ nói bài đang cho thấy gì về phía người kia trong mối này, luôn bằng "bài cho thấy" hoặc "có vẻ", không phán về người vắng mặt như sự thật, không mặc định ngoại tình hay lừa dối kể cả khi lá nặng. Lá nặng ở đây là người đó đang khó, đang xa hoặc đang giữ; lá nhẹ là người đó đang thuận, đang mở. Lá ngược thiên về người đó đang kẹt hoặc chưa rõ chính mình, không đọc thành hai mặt. Lá hoàng gia đọc theo la_nguoi nhưng vẫn là góc nhìn của bài, không phải nhận xét về tính người.
  lang_kinh_uu_tien: tinh_cam
- stt: 3
  ten: Cái đang nối hai người
  cau_hoi: Cái gì đang giữ hai người lại với nhau lúc này, thứ đó chắc hay mỏng
  goi_y_doc: Đọc lá thành sợi dây nối, không đọc thành một trong hai người. Lá nhẹ là dây chắc, có gốc; lá nặng là dây đang mỏng, hoặc hai người đang nối nhau bằng thứ khó bền như quen hơi, sợ cô đơn, nợ nhau. Lá ngược thiên về sợi dây đang lỏng hoặc chỉ còn một bên giữ. Ưu tiên cot_loi và bieu_tuong khi có chi tiết về hai người hay hai vật đối nhau.
  lang_kinh_uu_tien: tinh_cam
- stt: 4
  ten: Cái đang cản
  cau_hoi: Cái gì đang kéo hai người ra xa hoặc làm mối này khó đi tiếp
  goi_y_doc: Lá nào ở đây cũng đọc thành cái cản; lá nhẹ ở đây là một thứ tốt đang bị dùng quá tay, ví dụ thương quá hoá giữ chặt. Ưu tiên phần đầu của canh_bao. Lá ngược thiên về cái cản nằm trong đầu người hỏi hơn là ở hoàn cảnh. Nếu là lá hoàng gia, có thể là một người thứ ba theo nghĩa rộng như gia đình, bạn bè, người cũ; nói bằng "có vẻ", không gán tên.
  lang_kinh_uu_tien: tinh_cam
- stt: 5
  ten: Hướng đi
  cau_hoi: Nếu giữ đà này thì mối này đang tiến, đang lùi hay đang đứng
  goi_y_doc: Đọc như hướng, không phải kết cục; nói bằng "nếu giữ đà này". Lá nhẹ là mối này đang có đường đi tiếp, lá nặng là đang xa dần hoặc phải qua một đoạn khó, nói gọn. Lá ngược thiên về hướng đó đến chậm hoặc cần người hỏi làm khác đi. Dùng huong trong sac_thai để nói mối này đang tiến, lùi hay đứng. Chỗ này chỉ nói hướng — câu nghiêng về một phía, việc làm được trong bảy ngày tới và điều kiện nếu... thì đều thuộc đoạn kết, nói trước ở đây thì đoạn kết không còn gì để nói.
  lang_kinh_uu_tien: tinh_cam
luat_doc:
- Nhìn lá một và lá hai cạnh nhau trước, gọi tên chỗ hai bên đang lệch hay đang khớp; đây là cặp then chốt của kiểu trải này.
- Nói theo thứ tự một, hai, ba, bốn, năm; gom lá ba và lá bốn thành một đoạn "cái giữ và cái kéo", rồi lá năm là hướng đi nếu giữ đà này, còn câu trả lời thẳng để dành cho đoạn kết.
- Không phán về người kia như sự thật ở bất kỳ đoạn nào; không dùng lá nặng ở lá hai hay lá bốn để nói người đó lừa dối, có người khác, hết yêu. Chỉ nói bài cho thấy phía đó đang thế nào trong mối này.
- Không quyết thay người hỏi chuyện tiếp tục hay dừng; nói bài nghiêng về đâu và cái giá của mỗi phía, việc cụ thể ở cuối phải là việc người hỏi làm được một mình, không phụ thuộc người kia.
- Người hỏi đang tìm hiểu, chưa thành đôi, thì lá ba đọc là cái đang kéo hai người lại gần, lá năm đọc là chuyện có đi tiếp thành gì hay không, cùng một luật nói theo đà.
