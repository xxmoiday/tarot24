id: hai_nguoi
ten_vi: Ba lá giữa hai người
ten_en: Three Card Between Two People
nhom: chuyen_de
so_la: 3
mo_ta: Khi đang vướng một người và muốn biết giữa hai bên đang có gì. Ba lá cho phía mình, phía người kia và cái đang diễn ra ở giữa.
hop_voi:
- Người ấy đang nghĩ gì về mình
- Giữa mình với người đó đang có gì
- Mình với đứa bạn thân dạo này xa cách, tại sao
- Mình với sếp có đang hiểu lầm nhau không
khong_hop_voi:
- Người đó có đang lừa mình không
- Có nên tỏ tình hay không
- Người đó có quay lại không
cach_rut: Xào bài, rút ba lá; lá một đặt bên trái cho phía mình, lá hai bên phải cho phía người kia, lá ba đặt giữa hai lá.
vi_tri:
- stt: 1
  ten: Bạn
  cau_hoi: Người hỏi đang mang gì tới mối này, đang nghĩ và đang cư xử với người kia ra sao
  goi_y_doc: Đọc theo lăng kính tinh_cam nếu là chuyện yêu đương, còn bạn bè, gia đình, chỗ làm thì lấy tam_ly làm nền và hạ xuống lĩnh vực đó. Lá nặng là người hỏi đang mệt, đang giữ thế hoặc đang mang chuyện cũ vào; lá nhẹ là đang thật lòng hoặc đang mong nhiều. Lá ngược thiên về người hỏi đang giấu chính mình. Lá hoàng gia đọc theo la_nang_luong.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 2
  ten: Người kia
  cau_hoi: Trong mối này, bài đang cho thấy gì về phía người kia, cách người đó đang đứng với người hỏi
  goi_y_doc: Chỉ nói bài đang cho thấy gì về phía người kia trong mối này, luôn bằng "bài cho thấy" hoặc "có vẻ", không phán về người vắng mặt như sự thật, không mặc định ngoại tình, lừa dối hay hết tình kể cả khi lá nặng. Lá nặng là người đó đang khó, đang xa, đang giữ; lá nhẹ là đang mở, đang thuận. Lá ngược thiên về người đó đang kẹt hoặc chưa rõ chính mình, không đọc thành hai mặt. Lá hoàng gia đọc theo la_nguoi nhưng là góc nhìn của bài, không phải nhận xét về tính người.
  lang_kinh_uu_tien: theo_cau_hoi
- stt: 3
  ten: Giữa hai người
  cau_hoi: Cái đang diễn ra ở khoảng giữa hai người là gì, đang nối hay đang kéo xa
  goi_y_doc: Đọc lá thành cái ở giữa, không đọc thành một trong hai người. Lá nhẹ là hai bên đang có dây nối hoặc đang đi cùng chiều; lá nặng là khoảng giữa đang có khúc mắc, im lặng, hiểu lầm, nợ nhau. Lá ngược thiên về khoảng giữa đang lỏng, hoặc chỉ một bên đang giữ. Ưu tiên cot_loi và bieu_tuong khi có chi tiết về hai người, hai vật đối nhau hay một khoảng cách.
  lang_kinh_uu_tien: theo_cau_hoi
luat_doc:
- Đặt lá một và lá hai cạnh nhau trước, gọi tên chỗ hai bên đang khớp hay đang lệch; lá ba giải thích vì sao có chỗ lệch đó. Lá ba là then chốt.
- Nói theo thứ tự một, hai, ba; câu trả lời cho "người ấy đang nghĩ gì" nằm ở lá hai nhưng phải luôn ở dạng bài cho thấy phía đó đang thế nào trong mối này, không kết luận về ý nghĩ thật của người đó.
- Không dùng lá nặng ở lá hai hay lá ba để nói người kia lừa dối, có người khác, hết yêu; không quyết thay người hỏi chuyện tiếp tục hay dừng.
- Việc cụ thể ở cuối là việc người hỏi làm được một mình, ví dụ nói một câu rõ, ngừng đoán, cho khoảng cách; không phải việc trông chờ người kia làm.
- Không dùng kiểu trải này cho người hỏi đang muốn biết một người vắng mặt lâu có quay lại hay không; nói rõ bài chỉ nhìn được khoảng giữa hiện tại và gợi ý trải ba lá thời gian nếu muốn nhìn hướng.
