id: sword_08
ten_vi: Tám Kiếm
ten_en: Eight of Swords
arcana: phu
so: 8
chat: kiem
hoang_gia: false
bieu_tuong:
- Một người phụ nữ đứng bị bịt mắt bằng dải vải trắng, thân người bị quấn dây trói từ vai xuống, hai tay bị buộc phía sau
- Cô mặc váy dài màu đỏ, đứng thẳng, hơi nghiêng người, chân đặt trên nền đất lầy lội có vũng nước
- Tám thanh kiếm cắm thẳng đứng xuống đất, quây thành hàng rào thưa quanh cô, ba bốn thanh bên trái, phần còn lại bên phải, phía trước không có kiếm
- Nền là mặt nước đọng phản chiếu lờ mờ, đất bùn xám nâu
- Trên cao ở xa, một toà lâu đài đứng trên mỏm đá cao, có tháp và tường thành
- Trời xám đục, không mặt trời, không có người nào khác quanh cô
- 'Tông màu chủ đạo: xám của trời đất và kiếm, đỏ của váy, trắng của dải bịt mắt'
cot_loi: Tự trói bằng chính suy nghĩ của mình. Lối ra vẫn mở nhưng người trong cuộc không thấy, vì đã tin chắc là mình kẹt; cái kẹt này chỉ tạm, kẹt trong đầu chứ không kẹt ngoài đời.
tu_khoa_xuoi:
- tự trói tay
- tưởng hết đường
- kẹt trong đầu
- không dám bước
- bó buộc tạm thời
- lối ra ngay trước mặt
- nghĩ quẩn
- chờ ai cởi trói
tu_khoa_nguoc:
- tự cởi trói
- bước ra khỏi rào
- gỡ được nút thắt
- nhìn lại thấy dễ
- trói chặt thêm
- chìm trong bất lực
- đầu hàng hoàn cảnh
canh_bao: Ở lì trong cái rào tự dựng, người trong cuộc dần tin hẳn rằng mình bất lực, chờ người khác đến cởi trói và trách hoàn cảnh cho mọi thứ. Nghĩa cổ có chữ ốm đau, nhưng không được lấy đó để nói người hỏi mang bệnh; kẹt ở đây là kẹt trong đầu. Đừng đọc thành bị ai đó giam hãm hay hãm hại thật, và đừng chê người hỏi yếu đuối, cái rào có thật với họ dù thưa.
nguyen_to: khi
