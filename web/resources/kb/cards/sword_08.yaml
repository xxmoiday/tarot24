sac_thai:
  trong_luong: nặng
  dong_tinh: tĩnh
  huong: giậm chân tại chỗ
lang_kinh:
  tinh_cam: Tự nhốt mình trong một mối không vui vì tin rằng bỏ thì không ai thương nữa; cửa vẫn mở, chỉ là chưa dám nhìn về phía đó.
  cong_viec: Ở lại chỗ làm chán ngắt vì tự thuyết phục mình không đủ giỏi để xin nơi khác; rào cản nằm trong đầu, hồ sơ chưa gửi chứ chưa ai từ chối.
  tien_bac: Tưởng mình túng hơn thật, không dám xin tăng lương hay đòi khoản người khác đang giữ; số dư không tệ như nỗi sợ trong đầu.
  tam_ly: Nhìn đâu cũng thấy bế tắc, tin rằng mình hết cách và chờ ai đó đến cứu; tất cả diễn ra trong đầu, thực tế rộng hơn cái rào tự dựng.
  hoc_hanh: Tin mình dốt môn đó, bỏ luôn không ôn, ngồi trong phòng thi mà đầu trắng; bài không khó như đã tự thuyết phục, chỉ cần bắt đầu đọc.
cach_noi_viet:
- lấy dây buộc mình
- lúng túng như gà mắc tóc
- chưa đánh đã thua
- tự mình làm khổ mình
- há miệng chờ sung
