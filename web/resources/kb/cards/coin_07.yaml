id: coin_07
ten_vi: Bảy Tiền
ten_en: Seven of Pentacles
arcana: phu
so: 7
chat: tien
hoang_gia: false
bieu_tuong:
- Một chàng trai đứng tựa cả người lên cán cuốc dài, cằm gác gần đầu cán, mắt nhìn chăm chú xuống bụi cây trước mặt
- Bụi cây xanh sẫm rậm lá, trên đó treo lủng lẳng những đồng tiền vàng như quả trên cành
- Một đồng tiền nằm tách riêng dưới đất, sát bàn chân người này
- Người mặc áo dài quá gối màu nâu đất, đi ủng, hai tay chồng lên nhau trên đầu cán
- Dáng đứng nghiêng, trọng lượng dồn hết vào cây cuốc, không đang làm việc
- Sau lưng là một quả đồi thấp và mảng đất nâu đã cày, nền trời xám
cot_loi: Đã gieo, đã làm nhiều, giờ dừng tay nhìn lại xem công sức bỏ ra có đáng. Chưa đến lúc thu, việc còn lại là chờ và cân nhắc có nên bỏ thêm công sức vào chỗ này.
tu_khoa_xuoi:
- chờ mùa
- dừng tay ngắm lại
- chưa tới lúc gặt
- tính lại công bỏ ra
- quả còn xanh
- lớn chậm
- sốt ruột chờ
- đi tiếp hay thôi
tu_khoa_nguoc:
- công cốc
- bỏ dở giữa chừng
- gặt non
- chờ mãi không ra
- cho mượn khó đòi
- cày mãi không lên
- nản tay
- tiếc công
canh_bao: Đứng tựa cuốc lâu quá thì thành người chỉ ngắm mà không làm, sốt ruột thì hái non hay bỏ ruộng đi tìm đám khác cũng chưa lên. Thêm cái lo cho mượn khó đòi khi lá ngược, công đã bỏ thành công cốc. Lá này không cho biết mùa được hay mất, chỉ chụp đúng lúc đang cân; không dùng nó để khuyên giữ hay bán một khoản đầu tư, không hứa cứ chờ là có. Người này đã làm nhiều mới có gì để đứng nhìn, không phải lười.
nguyen_to: tho
chiem_tinh_gd: Sao Thổ ở Kim Ngưu
chiem_tinh_hd: null
sac_thai:
  trong_luong: vừa
  dong_tinh: tĩnh
  huong: dừng tay ngắm
lang_kinh:
  tinh_cam: Đã bỏ nhiều công cho mối này, giờ đứng nhìn lại tự hỏi có đáng; chưa đến lúc gặt, đi tiếp hay thôi phải tự cân.
  cong_viec: Dự án làm lâu chưa thấy kết quả, sốt ruột; đây là lúc đánh giá lại chứ không phải lúc bỏ ngang, ngược thì nản tay bỏ dở.
  tien_bac: Tiền để dành, tiền góp lâu ngày lớn chậm, chưa rút được; khoản đã cho mượn đang khó đòi.
  tam_ly: Mệt, ngắm công sức đã bỏ mà lòng nửa tin nửa nghi, sốt ruột chờ một thứ mình không đẩy nhanh được.
  hoc_hanh: Học đã lâu mà điểm chưa lên, luận văn làm dở, tự hỏi có nên đi tiếp; kiến thức đang ngấm, chưa nổi lên bài.
cach_noi_viet:
- trồng cây chờ ngày hái quả
- bỏ thì thương, vương thì tội
- đâm lao phải theo lao
- dục tốc bất đạt
- đứng núi này trông núi nọ
- chờ được vạ thì má đã sưng
