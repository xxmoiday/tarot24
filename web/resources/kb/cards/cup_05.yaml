id: cup_05
ten_vi: Năm Cốc
ten_en: Five of Cups
arcana: phu
so: 5
chat: cup
hoang_gia: false
bieu_tuong:
- Một người trùm áo choàng đen dài phủ kín từ đầu đến chân, đầu cúi gằm, đứng quay nghiêng, ngoảnh mặt xuống ba chiếc cốc đổ nghiêng dưới đất
- Ba cốc bị đổ, rượu đỏ và nước xanh lá tràn ra thấm vào cỏ
- Hai chiếc cốc còn lại đứng thẳng ngay sau lưng người đó, ngoài tầm mắt
- Một dòng sông chảy ngang phía sau, có cây cầu đá bắc qua
- Bên kia cầu, trên nền trời xám nhạt, là một toà lâu đài nhỏ với tường thành
cot_loi: Mất một phần và mắt chỉ dán vào phần đã đổ, trong khi phần còn lại vẫn nguyên. Tiếc là thật, nhưng cái kẹt của lá này là quay lưng với cái còn giữ được.
tu_khoa_xuoi:
- tiếc cái đã đổ
- chỉ nhìn phần mất
- đau vì đổ vỡ
- còn hai cốc
- quay lưng cái còn
- tiếc mãi chuyện cũ
- buồn chưa nguôi
tu_khoa_nguoc:
- nguôi dần
- nhìn lại hai cốc
- tha thứ
- chấp nhận mất
- thôi tiếc cái đã đổ
- về với người thân
- tiếc mãi không dứt
canh_bao: 'Tiếc kéo dài thành tự trách, người hỏi đứng lì bên ba cốc đổ đến khi hai cốc sau lưng cũng nguội, mất một mà buông luôn phần còn giữ được. Áo choàng đen là nỗi buồn, không phải tang phục: dù Waite có nhắc của để lại và họ hàng, không suy ra người thân qua đời hay chuyện sinh tử. Không phán mất trắng, vì luôn còn hai cốc. Ý trở về ở chiều ngược là nguôi và về với người thân, chưa phải nối lại người cũ.'
nguyen_to: thuy
chiem_tinh_gd: Sao Hoả ở Bọ Cạp
chiem_tinh_hd: null
sac_thai:
  trong_luong: nặng
  dong_tinh: tĩnh
  huong: cúi nhìn cái đổ
lang_kinh:
  tinh_cam: Vừa chia tay hay vừa vỡ niềm tin, người hỏi còn ngoái nhìn người cũ, trong khi người còn thương mình đứng ngay sau lưng mà không được thấy.
  cong_viec: Dự án hỏng, thăng chức hụt hay bị sếp bỏ rơi, tiếc và tự trách; nhưng chỗ làm còn hai chỗ dựa chưa mất, ngoảnh lại sẽ thấy.
  tien_bac: Mất một khoản, hụt tiền hay bị lừa, cứ đếm đi đếm lại số đã mất; phần còn lại vẫn đủ xoay, đừng để nó cũng trôi theo.
  tam_ly: Đang thời buồn chưa nguôi, mắt chỉ dán vào cái hỏng; tự thấy mình thua cuộc, dù cái mất chưa phải là tất cả.
  hoc_hanh: Thi rớt hay điểm thấp một môn, nản đến mức muốn bỏ luôn; các môn còn lại đang ổn, một lần trượt không xoá được cả kỳ.
cach_noi_viet:
- tiếc đứt ruột
- của đi thay người
- còn người còn của
- đổ sông đổ biển
- còn nước còn tát
