id: cup_08
ten_vi: Tám Cốc
ten_en: Eight of Cups
arcana: phu
so: 8
chat: cup
hoang_gia: false
bieu_tuong:
- Một người đàn ông mặc áo choàng đỏ, tay chống gậy, quay lưng về phía người xem, đang bước lên dốc đá về phía núi
- Tám chiếc cốc vàng xếp ở tiền cảnh thành hai hàng, hàng dưới năm cốc, hàng trên ba cốc, hàng trên chừa một khoảng trống như thiếu một cốc
- Trên trời treo một mặt trăng vẽ mặt người, đĩa tròn đầy ôm lấy vành trăng khuyết
- Người đi không ngoảnh lại, dáng hơi khom, giày đỏ
- Dưới chân là bãi bùn lầy có nước lấp xấp, phía trước là những khối đá xám chồng lên nhau
- Bầu trời xanh sẫm tối, cảnh vật không có cây cối
cot_loi: Rời bỏ cái đang có, dù nó không hỏng, vì lòng đã biết nó không còn đủ. Là bước đi có chủ ý để tìm thứ sâu hơn, khác với chán mà ngồi lì, khác với mất mà tiếc.
tu_khoa_xuoi:
- bỏ đi tìm cái sâu
- chủ động rời đi
- dứt áo ra đi
- lòng không còn đủ
- chuyện xuống dốc
- lặng lẽ rút lui
- bỏ dù chưa hỏng
tu_khoa_nguoc:
- chưa dám dứt
- ở lại dù chán
- quay đầu về
- bỏ đi vô cớ
- trốn chứ không đi
- lang thang không đích
- vui vẻ trở lại
- bám cái đang có
canh_bao: 'Đi mà không biết đi đâu, bỏ việc bỏ người cho nhẹ đầu rồi lang thang, hoặc biết lòng đã cạn mà vẫn ở lại cho phải phép, héo dần trong cái đang có. Người luận không được biến lá này thành lệnh chia tay hay nghỉ việc, nó chỉ nói lòng đã rời, còn đi hay không là của người hỏi. Cũng không phải bị bỏ rơi, vì người trên hình là người bước đi. Khác Bốn Cốc ngồi lì và Năm Cốc tiếc: ở đây không mất gì.'
nguyen_to: thuy
chiem_tinh_gd: Sao Thổ ở Song Ngư
chiem_tinh_hd: null
sac_thai:
  trong_luong: nặng
  dong_tinh: động vừa
  huong: đi lên núi xa
lang_kinh:
  tinh_cam: Chủ động rời một mối không có gì sai nhưng lòng đã không còn đủ; người kia thường không hiểu vì sao, bởi bên ngoài mọi thứ vẫn êm.
  cong_viec: Nộp đơn nghỉ khi mọi thứ vẫn ổn, lương đều mà không thấy còn ý nghĩa; ngược thì đi cho có, trốn việc chứ không phải đi tìm việc.
  tien_bac: Bỏ một nguồn thu không tệ để đi tìm thứ khác, chấp nhận thời gian đầu túng hơn; tiền không phải lý do để đi.
  tam_ly: Lặng lẽ và mệt, biết chuyện này không hỏng nhưng cũng biết mình không ở lại được; đang gom sức để quay lưng.
  hoc_hanh: Bỏ ngành đang học dở hay khoá học đang ổn vì thấy nó không phải cái mình cần; đi tìm cái học được lâu hơn.
cach_noi_viet:
- dứt áo ra đi
- đi cho biết đó biết đây
- một đi không trở lại
- chân trong chân ngoài
- cố đấm ăn xôi
