sac_thai:
  trong_luong: vừa
  dong_tinh: động đột ngột
  huong: xoay vòng
lang_kinh:
  tinh_cam: Gặp người đúng lúc không hẹn trước, hoặc mối đang chậm bỗng xoay chiều; chuyện này do duyên đưa đẩy, sắp đổi giai đoạn dù chưa ai chủ động.
  cong_viec: 'Có bước ngoặt từ bên ngoài: công ty tái cơ cấu, được điều chuyển, cơ hội rơi xuống; nắm được thời thì lên, ngược thì đang ở đoạn xuống của vòng.'
  tien_bac: Tiền lên xuống theo thời, có lộc bất ngờ hoặc khoản thu đổi chiều; lúc lên đừng tưởng mãi, lúc xuống biết là chưa hết vòng.
  tam_ly: Thấy mình bị đời xoay, không nắm được hết; lúc này chỉ có cách chịu cái ngoài tầm tay, không đổ tại số mà cũng không cố cưỡng.
  hoc_hanh: 'Kết quả thi có phần may rủi: trúng tủ hay lệch tủ, xét tuyển đổi quy chế; cơ hội học bổng đến bất ngờ, phải chớp ngay.'
cach_noi_viet:
- sông có khúc, người có lúc
- hết cơn bĩ cực đến hồi thái lai
- mưu sự tại nhân, thành sự tại thiên
- hữu duyên thiên lý năng tương ngộ
- thời tới cản không nổi
- ba chìm bảy nổi
