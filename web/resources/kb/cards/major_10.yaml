id: major_10
ten_vi: Bánh Xe Số Phận
ten_en: Wheel of Fortune
arcana: chinh
so: 10
chat: null
hoang_gia: false
bieu_tuong:
- Một bánh xe lớn lơ lửng giữa trời, vành ngoài khắc xen kẽ các chữ cái T-A-R-O và chữ Hebrew, vành trong vẽ các ký hiệu giả kim
- Trên đỉnh bánh xe là con nhân sư màu xanh lam ngồi cầm thanh kiếm
- Bên phải, một sinh vật đầu chó rừng thân đỏ đang leo lên theo vành xe
- Bên trái, một con rắn vàng trườn xuống theo vành xe
- 'Bốn góc lá là bốn sinh vật có cánh ngồi trên mây, mỗi con mở một cuốn sách: thiên thần, đại bàng, sư tử và bò'
- Nền trời xanh lam với những đám mây
cot_loi: Vòng quay đổi chiều mà không ai bấm nút. Vận, chu kỳ, bước ngoặt đến từ bên ngoài; đang lên sẽ xuống, đang xuống sẽ lên, việc của người hỏi là biết mình đang ở đâu trên vòng, không phải cưỡng lại nó.
tu_khoa_xuoi:
- gặp thời
- vận xoay
- bước ngoặt bất ngờ
- hết xuống thì lên
- không do mình
- đúng chu kỳ
- chuyện xoay chiều
- số đưa đẩy
tu_khoa_nguoc:
- vận xuống
- xui rủi
- bánh xe kẹt
- lặp lại vết cũ
- chưa tới thời
- cưỡng lại vận
- đổ tại số
- chờ mãi không xoay
canh_bao: Vận xuống, xui rủi lặp lại vết cũ, hoặc đổ hết tại số rồi buông tay không làm gì. Bánh Xe dễ bị dùng để hứa sắp gặp may hoặc trúng lớn; không được lấy nó làm cớ khuyên mua bán, đầu tư, chơi cổ phiếu, mua đất lúc đang lên. Xoay chiều không có nghĩa là lên; hỏi kỹ người này đang ở đâu trên vòng rồi mới nói, và không đưa ra ngày tháng cụ thể.
