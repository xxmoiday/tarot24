- tham không đáy
- cứng nhắc, cũ kỹ
- cơ ngơi lung lay
- làm ăn gian
- cậy tiền ép người
- yếu thế, bị lấn
- ham ăn chơi
canh_bao: Ôm của không buông, cứng nhắc, cậy tiền ép người, hoặc làm ăn gian để giữ cơ ngơi; ngược nữa thì cơ ngơi lung lay, bị lấn, hay sa vào ăn chơi khi đã có tiền. Lá này sát chuyện tiền lớn nhất trong bộ, nên tuyệt đối không đọc thành lời khuyên đầu tư, mua bán, gửi vốn vào đâu; chỉ nói về sự vững đã có và tính giữ. Không đọc thành sắp gặp đại gia; thường đây là chính người hỏi hoặc chỗ làm lâu năm.
nguyen_to: tho
chiem_tinh_gd: Hoả của Thổ — Hiệp Sĩ (Knight); 20° Sư Tử – 20° Xử Nữ
