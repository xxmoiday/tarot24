sac_thai:
  trong_luong: vừa
  dong_tinh: tĩnh
  huong: ngồi giữ cơ ngơi
lang_kinh:
  tinh_cam: Người đàn ông có cơ ngơi, ổn định, đến với lời bảo đảm về đời sống; hôn nhân bền, nhưng chậm đổi và ít khi nói lời yêu.
  cong_viec: Đứng đầu một cơ ngơi đã vững, ông chủ lão luyện, quyết bằng con số; xin việc vào công ty lớn, lâu năm, nhưng chậm đổi mới.
  tien_bac: Của cải tích được qua nhiều năm, cơ ngơi vững, tiền đẻ ra từ việc làm ăn ổn định; ngược thì ôm của không buông, hoặc tham đến mức làm ăn gian.
  tam_ly: Thấy mình đã đứng vững, có gì đó để giữ, không muốn xáo trộn; ngại đổi, ngại mạo hiểm, nghe tới cái mới là thấy phiền.
  hoc_hanh: 'Học để giữ và mở rộng nghề đang có: bằng quản lý, kế toán, kỹ thuật; học bài bản, lâu năm, ít chạy theo cái mới.'
