- ăn nên làm ra
- có của ăn của để
- nhà cao cửa rộng
- của bền tại người
- tham thì thâm
- có tiền mua tiên cũng được
ba_cach_doc:
  la_nguoi: 'Đã xây xong cơ ngơi và đang giữ: ông chủ lâu năm, người bố có nhà có xe có tiếng, sếp lớn quyết bằng con số, bà chủ đất kỳ cựu. Chắc tay, ít nói lời yêu, chậm đổi mới, ngại mạo hiểm; ngược thì cậy tiền ép người, ôm của không buông.'
  la_nang_luong: Tính cho chắc rồi mới làm, giữ cái đã có trước, mở thêm tính sau. Nhìn con số, xem cái nền, lấy kinh nghiệm lão luyện mà quyết chứ không theo hứng, không chạy theo cái mới nghe hay. Có điều phải cởi bớt cứng nhắc, vững quá thì hoá cũ kỹ.
  la_tinh_huong: 'Chuyện này đặt trên một nền đã vững: công ty lâu năm, cơ ngơi gia đình, mối quan hệ có bảo đảm về đời sống. Có người thành đạt đứng ra quyết, hoặc chính người hỏi đang ở thế giữ chứ không phải thế gây dựng. Ngược thì cơ ngơi lung lay, làm ăn gian, bị lấn.'
