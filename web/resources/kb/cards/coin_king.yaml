id: coin_king
ten_vi: Vua Tiền
ten_en: King of Pentacles
arcana: phu
so: null
chat: tien
hoang_gia: true
bieu_tuong:
- Vua ngồi trên ngai, tay phải cầm quyền trượng có quả cầu, tay trái đặt lên đồng tiền lớn dựng trên đầu gối
- Áo dài in đầy hình chùm nho và lá nho
- Vương miện vàng cài hoa đỏ, dưới vạt áo thò ra bàn chân bọc giáp sắt
- Tay vịn và lưng ngai tạc nhiều đầu bò
- Dây nho leo quanh ngai, chùm nho sát chân
- Phía sau là tường thành và toà lâu đài
- Trời vàng
cot_loi: 'Đã xây xong và giữ được: tiền bạc, cơ ngơi, tiếng tăm vững qua nhiều năm. Điều hành bằng cái đầu tính toán và bàn tay chắc, đổi mới chậm, ít khi chịu mạo hiểm.'
