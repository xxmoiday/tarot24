id: coin_02
ten_vi: Hai Tiền
ten_en: Two of Pentacles
arcana: phu
so: 2
chat: tien
hoang_gia: false
bieu_tuong:
- Một chàng trai đội mũ cao đứng trên một chân, đang nhún nhảy, mỗi tay cầm một đồng tiền
- Hai đồng tiền được nối bằng một dải băng xanh lá uốn thành hình số 8 nằm ngang, vòng qua cả hai
- Người này mặc trang phục sặc sỡ nhiều màu, thân hơi ngả sang một bên như đang giữ thăng bằng
- Chân đứng trên một dải đất vàng nhỏ ở mép dưới lá bài
- Phía sau là biển với những con sóng cuộn rất cao, hai con thuyền buồm đang nhấp nhô trên sóng
- Nền trời một màu vàng nhạt, phẳng, không mây
cot_loi: Xoay xở giữ hai việc, hai nguồn, hai đầu cùng lúc mà không buông cái nào. Không phải chọn một bỏ một, mà là giữ nhịp cho cả hai khi mọi thứ quanh mình cứ lên xuống.
tu_khoa_xuoi:
- xoay xở
- tung hứng hai việc
- co kéo chi tiêu
- giữ nhịp
- vừa làm vừa chơi
- giấy tờ qua lại
- đứng vững trên sóng
- lo cả hai đầu
tu_khoa_nguoc:
- quá tải
- rơi một quả
- gồng gượng
- cười gượng
- nợ dồn nợ
- rối như tơ
- hụt chân
- phải bỏ một bên
canh_bao: Hai đầu vẫn giữ được cho đến ngày một khoản bất ngờ ập vào, hoặc đến khi nụ cười chỉ còn là gượng, việc nào cũng dở vì không việc nào được làm tới nơi. Nợ này đắp nợ kia lâu ngày thành thói. Không nên gợi ý vay chỗ này trả chỗ kia, đảo nợ, hay chia tiền vào hai kênh đầu tư; lá này tả trạng thái đang cân, không phán bên nào sẽ rơi, và trong tình cảm không mặc định người hỏi bắt cá hai tay.
nguyen_to: tho
chiem_tinh_gd: Sao Mộc ở Ma Kết
chiem_tinh_hd: null
sac_thai:
  trong_luong: vừa
  dong_tinh: động vừa
  huong: tung hứng lên xuống
lang_kinh:
  tinh_cam: Vừa lo chuyện yêu vừa lo cơm áo, hay đứng giữa hai mối chưa dứt; hai người còn giữ được nhịp, ngược thì một bên sẽ rơi.
  cong_viec: Làm hai việc cùng lúc, việc chính lẫn việc ngoài, hạn chồng hạn; vẫn xoay xở được nhưng đang thiếu chỗ nghỉ tay.
  tien_bac: Tiền vào ra liên tục, tháng này đắp chỗ kia bù chỗ nọ, chưa dư mà cũng chưa hụt; chỉ cần một khoản bất ngờ là lệch cân.
  tam_ly: Đầu chạy đi chạy lại giữa nhiều mối lo, không có gì đổ nhưng cũng chưa được ngồi yên một phút.
  hoc_hanh: Vừa đi học vừa đi làm, hay theo hai chương trình một lúc; đủ sức cho cả hai nếu chia giờ khéo, lệch một chút là rớt một bên.
cach_noi_viet:
- giật gấu vá vai
- chân trong chân ngoài
- xoay như chong chóng
- vừa chạy vừa xếp hàng
- lấy ngắn nuôi dài
