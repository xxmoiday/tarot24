id: wand_07
ten_vi: Bảy Gậy
ten_en: Seven of Wands
arcana: phu
so: 7
chat: gay
hoang_gia: false
bieu_tuong:
- Một chàng trai đứng trên đỉnh gò đất cao, hai tay nắm chặt một cây gậy cầm chéo trước người
- Sáu cây gậy khác dựng lên từ phía dưới chân gò, hướng về phía chàng trai, không thấy người cầm
- Chàng trai mặc áo chẽn màu xanh lá, quần bó màu vàng
- Hai chân đi hai loại giày khác nhau, một bên bốt cao, một bên giày thấp
- Tư thế hơi khom, mắt nhìn xuống chỗ những cây gậy đang dựng lên
- Nền trời xanh nhạt, chỉ có gò đất và mấy cây gậy, không có bối cảnh nào khác
cot_loi: Đã có chỗ đứng và giờ phải giữ, vì nhiều phía đang chất vấn, tranh phần. Lợi thế thuộc về mình nhưng chỉ còn nếu chịu đứng lại mà chống đỡ; đây là lúc bảo vệ cái đã đạt, không phải lúc mở thêm.
tu_khoa_xuoi:
- giữ chỗ đứng
- bị chất vấn
- chống đỡ nhiều phía
- đứng ở thế trên
- bảo vệ cái đã có
- tranh cãi giữ phần
- không lùi
- một chọi sáu
tu_khoa_nguoc:
- chùn tay
- lung lay lập trường
- cố thủ
- hơn thua từng ly
- bị lấn
- buông chỗ đứng
- đuối lý
canh_bao: 'Giữ quá tay thành cố thủ: hơn thua từng câu, coi mọi góp ý là tấn công, phí sức vào trận không đáng; buông tay thì mất chỗ đứng vì chùn trước áp lực. Sáu cây gậy dưới chân không có người cầm, đừng gán chúng thành sáu kẻ thù hay một kẻ thứ ba đang phá mối này; đó là áp lực chung, không có mặt ai. Cạnh tranh ở đây là tranh luận, thương lượng, không lái sang tranh chấp pháp lý hay phán thắng thua ở toà.'
nguyen_to: hoa
chiem_tinh_gd: Sao Hoả ở Sư Tử
chiem_tinh_hd: null
sac_thai:
  trong_luong: nặng
  dong_tinh: động mạnh
  huong: đứng chặn từ trên
lang_kinh:
  tinh_cam: Đang phải bảo vệ mối này trước lời ra tiếng vào của nhà, của bạn bè, hay trước một người thứ ba nhăm nhe; giữ được nếu không dao động.
  cong_viec: 'Vị trí đang có bị nhiều phía nhắm tới: người mới lên thách thức, sếp chất vấn, đối thủ hạ giá; giữ được nếu đứng vững lập trường, đây chưa phải lúc mở rộng thêm.'
  tien_bac: 'Đang phải giữ tiền trước nhiều phía kéo: người vay chưa trả lại xin thêm, họ hàng nhờ vả, khách ép giá; giữ được nếu biết nói không, chưa phải lúc mở thêm khoản chi.'
  tam_ly: Cảm giác cả thế giới xúm vào hỏi tội, phải giải thích, phải bảo vệ lựa chọn của mình; căng nhưng chưa đuối, vấn đề là có dám đứng lại hay chùn tay.
  hoc_hanh: Bảo vệ luận văn trước hội đồng hỏi dồn, hay giữ hạng đầu lớp khi nhiều người bám sát; đứng ở thế trên, giữ được nếu không lung lay trước từng câu hỏi.
cach_noi_viet:
- tứ bề thọ địch
- đứng mũi chịu sào
- cây ngay không sợ chết đứng
- một tấc không đi, một ly không rời
- cãi chày cãi cối
- già néo đứt dây
