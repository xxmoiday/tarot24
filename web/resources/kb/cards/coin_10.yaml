lang_kinh:
  tinh_cam: Chuyện hai người đã thành chuyện hai nhà, tính cưới, tính ở đâu, gia đình hai bên chấp thuận; ngược thì rạn từ trong họ hàng.
  cong_viec: Công ty gia đình, chỗ làm ổn định lâu năm, được thừa hưởng vị trí hay mối làm ăn đời trước để lại.
  tien_bac: Tài sản lớn và bền, cơ ngơi tổ tiên, của để đời; ngược thì tranh của trong nhà, gánh nợ dòng họ.
  tam_ly: An tâm vì có gốc, có chỗ về, biết mình là một mắt xích trong dòng họ; đôi khi nặng vì phải giữ nếp nhà.
  hoc_hanh: Được nhà lo cho học đến nơi đến chốn, ngành học gắn với nghề ông cha; học để về giữ cơ nghiệp hơn là để tự đi.
