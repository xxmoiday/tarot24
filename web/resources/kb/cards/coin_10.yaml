id: coin_10
ten_vi: Mười Tiền
ten_en: Ten of Pentacles
arcana: phu
so: 10
chat: tien
hoang_gia: false
bieu_tuong:
- Một ông già tóc bạc râu dài ngồi ở tiền cảnh, khoác áo choàng dày thêu hoa văn chùm nho, tay đưa ra vuốt đầu một con chó
- Hai con chó trắng đứng quanh ông, một con ngẩng lên nhìn ông
- Phía sau, dưới một vòm cổng đá, một người đàn ông cầm giáo và một phụ nữ đứng cạnh nhau, đang nói chuyện
- Một đứa trẻ nhỏ nắm vạt áo người phụ nữ, quay đầu nhìn về phía con chó
- Mười đồng tiền rải khắp mặt lá bài, xếp thành sơ đồ cây có nhiều tầng đè lên cả cảnh vật
- Trên vòm cổng treo cờ hiệu gia tộc, trong đó có hình cái cân và hình toà tháp
- Qua cổng thấy bên trong là sân, tường và ngôi nhà lớn, nền trời xám nhạt
cot_loi: 'Của cải thành nền nhà, thành thứ truyền được qua nhiều đời. Cái vững ở đây không của riêng một người: gia đình, dòng họ, tài sản lâu dài, nhận từ đời trước và để lại cho đời sau.'
tu_khoa_xuoi:
- của để đời
- cơ ngơi
- an cư
- gia đình nhiều đời
- giàu bền
- gốc gác
- thừa kế
- nếp nhà
tu_khoa_nguoc:
- tranh của trong nhà
- gia sản sa sút
- của bay
- gánh nợ dòng họ
- may rủi
- mất gốc
- lộc bất ngờ
- rạn nếp
canh_bao: Của để đời thành cái phải giữ chứ không được hưởng, nếp nhà đè lên người trong nhà; ngược thì chính gia sản ấy là cớ anh em tranh nhau. Không hứa hẹn giàu có hay đoán số tài sản, lá nói về nền lâu dài, không nói bao nhiêu, bao giờ. Ông già trong hình không phải người thân sắp mất để lại thừa kế, đứa trẻ không phải tin sắp có con hay mang thai; cả nhà hiện ra để nói gốc gác, không nói sinh nở, tang ma.
