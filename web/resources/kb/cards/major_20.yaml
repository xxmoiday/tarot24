id: major_20
ten_vi: Phán Xét
ten_en: Judgement
arcana: chinh
so: 20
chat: null
hoang_gia: false
bieu_tuong:
- Thiên thần hiện ra giữa mây trên cao, thổi chiếc kèn dài có treo lá cờ trắng in chữ thập đỏ
- Bên dưới, những người khoả thân màu xám tro đứng dậy từ trong quan tài, giơ hai tay lên trời
- Hàng trước là một người đàn ông bên trái, một người phụ nữ bên phải, đứa trẻ ở giữa quay lưng lại
- Phía xa còn nhiều người khác đang đứng dậy trong các quan tài trôi trên mặt nước
- Sau lưng là mặt biển và dãy núi phủ tuyết trắng
- Nền trời xanh nhạt, mây trắng xám quanh thiên thần
cot_loi: Nghe một tiếng gọi và đứng dậy khỏi đời cũ. Nhìn lại cả một đoạn đời, nhận cái mình đã gây nên là của mình, rồi đáp lời; cái mới có được không phải vì chuyện cũ đã hết, mà vì mình tỉnh ra và chịu bước theo tiếng gọi ấy.
tu_khoa_xuoi:
- nghe tiếng gọi
- tỉnh ra
- đứng dậy
- tổng kết một đoạn
- nhận kết cục
- được gọi tên
- đời cũ khép lại
- tự xét mình
tu_khoa_nguoc:
- làm ngơ tiếng gọi
- tự trách quá đà
- xét người không xét mình
- sợ bị phán
- chưa dám đứng dậy
- lỡ lượt gọi
- ôm mãi đời cũ
- nghi ngờ mình
canh_bao: Xét người mà không xét mình, hoặc tự trách đến mức không đứng dậy nổi; làm ngơ tiếng gọi vì sợ bị phán. Không được lấy lá này để đoán phán quyết của toà, kết quả kiện tụng hay án phạt; phán xét ở đây là tổng kết và tự xét, không phải bản án. Tiếng gọi có, còn đứng dậy hay không là việc người hỏi, nên không đọc thành sẽ được tha thứ hay người cũ sẽ quay lại như lời hứa.
nguyen_to: hoa
chiem_tinh_gd: Nguyên tố Hoả
chiem_tinh_hd: Diêm Vương Tinh
sac_thai:
  trong_luong: nặng
  dong_tinh: động đột ngột
  huong: đứng dậy đi lên
lang_kinh:
  tinh_cam: 'Nhìn lại cả một mối để quyết dứt khoát: quay lại với người cũ vì đã hiểu ra, hoặc tổng kết và đứng dậy khỏi chuyện cũ cho xong.'
  cong_viec: 'Được gọi tên: lời mời quay lại, kết quả xét duyệt, đánh giá cuối kỳ; người hỏi tổng kết cả chặng nghề để trả lời có đi tiếp không.'
  tien_bac: Tổng kết cả chặng tiêu tiền, nhận ra chỗ đã lặp lại sai và quyết đổi hẳn nếp cũ; cái nhìn về tiền đổi khác hẳn so với trước.
  tam_ly: Tỉnh ra sau một thời dài, tự xét mình sòng phẳng, chấp nhận kết cục rồi đứng dậy; ngược thì là tự trách mãi không dậy nổi.
  hoc_hanh: Kết quả thi công bố, bảng điểm cuối kỳ, biết mình đậu hay rớt; lúc này nhìn cả chặng học để quyết học tiếp, thi lại hay đổi hướng.
cach_noi_viet:
- quay đầu là bờ
- tự vấn lương tâm
- tiên trách kỷ, hậu trách nhân
- ngã ở đâu đứng dậy ở đó
- đánh kẻ chạy đi, không ai đánh người chạy lại
- chân mình thì lấm bê bê, lại cầm bó đuốc đi rê chân người
