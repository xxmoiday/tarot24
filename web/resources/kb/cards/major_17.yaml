canh_bao: Hết tin, nước đổ ra cát, hy vọng hão không có nền, hoặc chưa lành mà đã tưởng xong. Vì lá dịu nên dễ bị đọc lố thành mọi chuyện sẽ ổn hay ước gì được nấy; hy vọng ở đây là hướng thấy ở xa, chưa phải kết quả, và người luận không nên hứa hộ. Chữ lành chỉ ở lòng và ở việc, không phải khỏi bệnh hay sức khoẻ hồi phục.
