lang_kinh:
  tinh_cam: Sau đổ vỡ, lòng lành dần, còn tin vào yêu; mối mới còn ở xa nhưng có thật, mối cũ lành lại nhờ thật lòng và không tiếc gì với nhau.
  cong_viec: 'Sau giai đoạn khó, công việc nhìn thấy hướng: hồ sơ được để ý, đội nhóm lấy lại tinh thần; chưa có kết quả ngay nhưng đường đã lộ.'
  tien_bac: Tiền chưa dư nhưng hết lo, có nguồn nhỏ đều, cho đi thoải mái không tiếc; giai đoạn hồi phục túi tiền sau thời cạn.
  tam_ly: Nhẹ, trong, không còn phòng thủ; hy vọng không ồn nhưng vững, đang lành và dám nhìn về xa; ngược thì là chán nản hết tin.
  hoc_hanh: Lấy lại hứng học sau kỳ thi tệ, tìm được môn hay hướng thấy sáng; kết quả chưa tới ngay nhưng mục tiêu ở xa đã rõ.
