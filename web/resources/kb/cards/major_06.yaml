  huong: hướng vào nhau
lang_kinh:
  tinh_cam: 'Hai người hút nhau thật, thấy rõ nhau và cần chọn: tiến tới hay dừng, người này hay người kia; chuyện này phải tự quyết, không ai chọn hộ được.'
  cong_viec: Đứng giữa hai lời mời hoặc hai hướng đi, chọn cái này là bỏ cái kia; đồng nghiệp hợp ý, cộng sự ăn ý, nhưng quyết định là của riêng người hỏi.
  tien_bac: 'Tiền dính tới người yêu hay vợ chồng: góp chung, chi cho nhau, chọn cách tiêu; lúc này phải hợp nhau ở cách nhìn tiền, chứ không chỉ chia con số.'
  tam_ly: Bị giằng giữa hai điều đều muốn, hiểu rằng chọn là mất; phải sống thật với mình mới biết mình muốn gì.
  hoc_hanh: 'Chọn ngành, chọn trường, chọn thầy: đến lúc phải quyết theo cái mình thật thích; học chung với người hợp ý thì vào rất nhanh.'
cach_noi_viet:
- tâm đầu ý hợp
- được cái này mất cái kia
- tình trong như đã, mặt ngoài còn e
- chọn mặt gửi vàng
- đứng núi này trông núi nọ
- bắt cá hai tay
