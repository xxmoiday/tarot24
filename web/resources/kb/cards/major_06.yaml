id: major_06
ten_vi: Tình Nhân
ten_en: The Lovers
arcana: chinh
so: 6
chat: null
hoang_gia: false
bieu_tuong:
- Một người đàn ông và một người phụ nữ khoả thân đứng đối diện nhau trên bãi cỏ, hai tay buông mở
- Phía trên là thiên thần tóc lửa đỏ, cánh đỏ, áo tím, dang rộng hai tay trên tầng mây
- Mặt trời lớn toả tia ở đỉnh lá, ngay trên đầu thiên thần
- Sau lưng người phụ nữ là cây táo có con rắn quấn quanh thân
- Sau lưng người đàn ông là cây có những ngọn lửa thay cho lá
- Người phụ nữ ngước nhìn thiên thần, người đàn ông nhìn về phía người phụ nữ
- Giữa hai người, xa xa là một ngọn núi nhọn
cot_loi: Hai bên đứng trước nhau, thấy nhau thật, và chọn nhau. Gắn kết bằng lựa chọn tự nguyện; chọn thứ này là bỏ thứ kia, nên đây vừa là tình cảm vừa là một quyết định lớn không thể nhờ ai chọn hộ.
tu_khoa_xuoi:
- chọn nhau
- hút nhau
- thật lòng với nhau
- phải chọn một
- hợp ý
- cặp đôi
- ngã rẽ tình cảm
- không ai chọn hộ
tu_khoa_nguoc:
- lệch nhịp
- không chọn nổi
- chọn sai người
- một bên nguội
- tan cặp
- hai lòng
- để người khác quyết
- hút mà không hợp
canh_bao: Hút mà không hợp, hai lòng, hoặc để người khác chọn hộ rồi trách đời. Không nên đồng nghĩa Tình Nhân với có người yêu mới hay tình yêu đích thực sắp tới, và ngược cũng chưa phải ngoại tình hay người thứ ba mà thường chỉ là lệch nhịp, một bên nguội; nửa nghĩa của lá là một lựa chọn phải trả giá, và khi hỏi việc thì nghĩa chọn đường mới là chính.
nguyen_to: khi
