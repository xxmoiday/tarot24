id: cup_03
ten_vi: Ba Cốc
ten_en: Three of Cups
arcana: phu
so: 3
chat: cup
hoang_gia: false
bieu_tuong:
- Ba cô gái đứng thành vòng tròn, cùng giơ cao ba chiếc cốc vàng chạm vào nhau trên đầu, chân dang bước như đang nhảy múa
- 'Ba người mặc ba màu khác nhau: trắng, đỏ cam, vàng; váy dài, tay áo rộng, tóc cài vòng hoa lá'
- Một trong ba cô quay lưng về phía người xem, tay đưa ra nắm lấy tay bạn
- 'Mặt đất quanh chân họ là vườn thu hoạch: bí ngô, chùm nho, hoa quả nằm rải trên cỏ'
- Nền trời vàng, không có công trình hay núi phía sau
cot_loi: Vui vì có người cùng chia, việc đến hồi kết đẹp và mọi người tụ lại ăn mừng. Niềm vui ở đây là của nhóm, lấy sức từ bạn bè và người thân, rộng hơn một đôi.
