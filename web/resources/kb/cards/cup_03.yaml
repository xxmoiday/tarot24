canh_bao: Vui quá hoá say, tiệc kéo dài thành ăn chơi bỏ việc, bạn bè xúm vào chuyện riêng rồi nói ra nói vào, hoặc cả nhóm vui mà một người bị để ngoài cuộc. Ngược, đừng mặc định ngay là ngoại tình hay người thứ ba, chỉ chạm hướng đó khi khách hỏi thẳng và có lá khác đỡ, còn không thì là bạn bè xen vào. Chữ chữa lành ở lá này là nguôi ngoai nhờ có người cùng, không suy ra hết bệnh.
