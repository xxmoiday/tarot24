lang_kinh:
  tinh_cam: Chuyện tình được bạn bè và gia đình hai bên chúc mừng, ra mắt, đám hỏi, đám cưới; ngược thì coi chừng bạn bè xen vào hoặc người thứ ba.
  cong_viec: Dự án xong, cả đội kéo nhau liên hoan; sếp và đồng nghiệp ghi nhận công chung, người hỏi được lòng tập thể hơn là nổi trội một mình.
  tien_bac: 'Tiền đi theo tiệc tùng: được mừng, được góp, cùng nhau chi; khoản chi cho cưới hỏi, liên hoan, bạn bè tăng lên nhưng tiêu mà vui.'
  tam_ly: Đầu óc thoáng vì có người cùng chia, không phải gánh một mình; tâm trạng lên hẳn khi ngồi giữa đám đông quen mặt.
  hoc_hanh: Học nhóm chạy tốt, thi xong cả bọn rủ nhau ăn mừng; kết quả ổn và được người quanh mình mừng cho thật lòng.
