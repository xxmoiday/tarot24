- cơ hội tình cảm
tu_khoa_nguoc:
- lòng khép kín
- nén cảm xúc
- cạn cốc
- trống rỗng trong lòng
- lòng không thật
- tin vui còn hoãn
- cảm xúc quá tải
- chưa dám thương
canh_bao: 'Cốc đầy quá thì tràn: cảm xúc dâng mà chưa có chỗ đổ, người hỏi dễ đem lòng thương lung tung, cho hết lòng với người chưa xứng, hoặc sợ đầy rồi cạn nên đóng chặt cửa. Khi luận, giữ lá này ở mức cái mầm, không suy ra một người cụ thể sắp đến hay chuyện cưới xin, vì trên hình không có ai. Chữ sinh sôi của lá tuyệt đối không lái sang thai nghén hay tin bầu bí, chỉ là lòng đang đầy và đang mở.'
nguyen_to: thuy
chiem_tinh_gd: Gốc của nguyên tố Thuỷ
