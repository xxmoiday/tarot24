id: cup_01
ten_vi: Át Cốc
ten_en: Ace of Cups
arcana: phu
so: 1
chat: cup
hoang_gia: false
bieu_tuong:
- Một bàn tay trắng vươn ra từ đám mây, ngửa lòng bàn tay nâng một chiếc cốc vàng lớn; không có người nào trên hình
- Từ miệng cốc, nhiều dòng nước tuôn xuống thành từng cột thẳng, chảy tràn xuống mặt hồ bên dưới
- Một con bồ câu trắng bay chúc đầu xuống, ngậm trong mỏ một chiếc bánh thánh tròn có in dấu thập tự, hướng vào miệng cốc
- Những giọt nước nhỏ hình giọt lệ rơi lơ lửng quanh cốc, rải đều bốn phía
- Mặt hồ phía dưới nở hoa súng, lá tròn nổi trên mặt nước
- Nền trời xám nhạt, không có đường chân trời, đám mây trắng ở góc bên phải là chỗ bàn tay ló ra
cot_loi: Tình cảm vừa khơi nguồn, đầy đến tràn mà chưa hướng về ai, chưa thành chuyện gì. Mầm của mọi chuyện thương, chuyện vui về sau, còn nguyên, chưa có hình hài.
tu_khoa_xuoi:
- tình mới nhen
- lòng tràn đầy
- xao xuyến đầu tiên
- tin vui tình cảm
