lang_kinh:
  tinh_cam: Đang một mình thì sắp có người khiến lòng xao động; đang có đôi thì tình cảm đầy lại như mới, dễ thấy thương người kia hơn thường ngày.
  cong_viec: Lời mời việc hay dự án mới đến đúng lúc lòng đang hứng, nhận vì thích chứ chưa tính lương; ngược thì mất hứng với chỗ làm dù chưa có gì sai.
  tien_bac: Có khoản lộc nhỏ hoặc quà đến bất ngờ, tiền vào theo lòng người mến chứ không theo công sức tính toán.
  tam_ly: Trong đầu nhẹ và mềm, dễ xúc động, muốn cho đi mà chưa biết cho ai; cảm xúc đang dâng nên chưa nghĩ được gì chín.
  hoc_hanh: Mới thấy thích một môn, một nghề, hào hứng ghi danh đi học; cái thích này còn non, phải biến thành giờ ngồi học thật.
