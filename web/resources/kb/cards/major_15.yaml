bieu_tuong:
- Sinh vật đầu dê có sừng, cánh dơi, ngồi xổm trên bệ đá đen vuông, giữa trán là ngôi sao năm cánh lộn ngược
- Tay phải giơ lên xoè lòng bàn tay ra ngoài, tay trái cầm ngọn đuốc chúc ngược xuống
- Hai chân lông lá kết thúc bằng móng vuốt chim bám mép bệ
- Bên dưới, một người đàn ông và một người phụ nữ khoả thân đứng hai bên bệ, đầu mọc sừng nhỏ, có đuôi
- Cổ hai người đeo xích, xích nối vào một vòng sắt gắn phía trước bệ, vòng xích rộng và lỏng
- Nền đen đặc, không có gì khác
cot_loi: Bị cái mình không chịu buông trói lại. Ham muốn, thói quen, vật chất, nỗi sợ; dây trói này lỏng hơn người ta tưởng, lối ra vẫn có, nhưng người trong cuộc không bước, vì còn thích hoặc tin là không có đường.
tu_khoa_xuoi:
- bị trói
- cám dỗ
- không buông được
- ham muốn
- dính chặt
- xích lỏng không đi
- thói quen xấu
- tin không có lối ra
tu_khoa_nguoc:
- gỡ xích
- thấy lối ra
- bỏ dần thói cũ
- vừa thoát vừa nhớ
- sắp dính lại
- bỏ chưa dứt
- nhìn ra cái trói
- tự chọn đi
canh_bao: Xích lỏng mà không đi, tin không có lối ra, cái thích đang thành cái không bỏ được; ngược thì gỡ được một đoạn rồi sắp dính lại. Ác Quỷ trong bộ này không nói về tà ma, bùa ngải, vong theo; tuyệt đối không lái sang hướng đó dù người hỏi gợi ý. Cái trói có thể chỉ là một thói quen, một nỗi sợ, một mức lương, nên chưa vội dán nhãn người hỏi hay đối phương là kẻ xấu, nghiện ngập.
