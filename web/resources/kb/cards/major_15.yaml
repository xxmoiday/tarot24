lang_kinh:
  tinh_cam: Mối này dính chặt vì ham muốn, ghen tuông hay sợ mất, biết không tốt mà không rời; người cũ vẫn kéo được vì mình còn thích, ngược thì là bắt đầu gỡ xích.
  cong_viec: Bám chỗ làm vì lương hoặc vì sợ, chịu sếp độc đoán mà không đi; hoặc bị món hời mờ ám dụ; lối ra có nhưng người hỏi chưa muốn thấy.
  tien_bac: Nợ xấu, chi tiêu theo cơn, mua sắm để dịu, cờ bạc, tiền trói người; càng gỡ càng dính nếu còn thích cái cảm giác đó.
  tam_ly: Thói quen hay nỗi sợ đang cầm dây, và người hỏi tin là không có đường khác; thực ra xích lỏng, chỉ chưa muốn cất bước.
  hoc_hanh: Học bị điện thoại, game, chuyện chơi kéo mất; biết mất tập trung mà cứ lặp lại; ngược thì là bắt đầu cai được để quay lại bàn.
