lang_kinh:
  tinh_cam: 'Mối này đi trọn: cưới, về chung nhà, hay hoàn tất một giai đoạn cùng nhau; hai người khớp nhau, chặng sau, nếu có, là vòng mới.'
  cong_viec: Xong dự án lớn, hết hợp đồng có hậu, thăng chức về đích; hoặc làm việc với nước ngoài, đi xa; ngược thì là gần xong mà hụt.
  tien_bac: Trả hết nợ, đạt mục tiêu để dành, khép sổ một chặng tài chính tròn; tiền có thể dính tới đi lại, nước ngoài.
  tam_ly: Thấy mình đâu vào đấy, tròn, không thiếu gì; đứng ở cuối chặng và biết cái tiếp theo là một vòng khác.
  hoc_hanh: Tốt nghiệp, hoàn thành khoá học, bảo vệ xong, du học; ngược thì là dở dang, thiếu một môn để khép chặng.
cach_noi_viet:
- đầu xuôi đuôi lọt
- công thành danh toại
- vẹn cả đôi đường
- mọi việc đâu vào đấy
- đi một ngày đàng, học một sàng khôn
- đầu voi đuôi chuột
