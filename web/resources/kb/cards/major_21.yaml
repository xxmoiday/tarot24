bieu_tuong:
- Người khoả thân nhảy múa giữa vòng hoa lá hình bầu dục, chỉ quấn một dải lụa tím quanh thân
- Mỗi tay cầm một cây gậy ngắn, một chân đứng trụ, chân kia gập ra sau
- Vòng lá xanh khép kín, thắt hai nơ ruy băng đỏ ở đỉnh và đáy
- 'Bốn góc lá là bốn gương mặt hiện trong mây: thiên thần, đại bàng, sư tử và bò'
- Nền trời xanh lam trơn, không có phong cảnh dưới chân
cot_loi: Đi trọn một vòng và đứng giữa cái đã hoàn thành. Kết thúc có hậu, tròn đầy, mọi phần khớp vào nhau; chỗ cần đến đã đến, và cái tiếp theo, nếu có, sẽ là một vòng khác.
tu_khoa_xuoi:
- trọn vòng
- về đích
- xong việc lớn
- tròn đầy
- mọi phần khớp nhau
- kết có hậu
- đi khắp nơi
- hết một chặng
tu_khoa_nguoc:
- dở dang
- thiếu một mảnh
- gần đích mà hụt
- đi lòng vòng
- không khép được vòng
- đường tắt
- kéo dài mãi
- ngại bước sang vòng mới
canh_bao: Gần đích mà hụt, thiếu một mảnh nên không khép được vòng, đi lòng vòng mãi hoặc xong rồi mà ngại bước sang vòng mới. Người luận dễ đóng dấu viên mãn, hết chuyện; tròn ở đây là tròn một chặng, không phải hạnh phúc mãi mãi, nên không dùng nó để cam đoan hôn nhân bền hay việc không bao giờ đổi. Đi nước ngoài, xuất khẩu lao động, định cư chỉ đọc khi câu hỏi chạm tới đi lại, không tự suy ra.
