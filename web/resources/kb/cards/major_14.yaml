lang_kinh:
  tinh_cam: Hai người khác tính đang tìm liều lượng hợp nhau, nhường một chút mỗi bên; mối này chín chậm, ổn nhờ đều đặn, ngược thì là nay nóng mai lạnh.
  cong_viec: Cân giữa hai việc, hai nhóm, hai sếp mà không nghiêng hẳn; tiến độ chậm mà đều, hợp vai điều phối, hoà giải trong đội.
  tien_bac: Thu chi cân nhau, tiêu chừng mực, để dành từ từ mỗi tháng một ít; không giàu nhanh nhưng không thủng, ngược thì là lúc vung lúc siết.
  tam_ly: Bình, không quá cao không quá thấp, đang hoà được cái lý và cái tình trong mình; không sốt ruột với nhịp của mình.
  hoc_hanh: Học đều mỗi ngày thay vì cày dồn trước thi, phối hợp nhiều môn cho vừa sức; tiến bộ chậm mà chắc, ôn thi có lịch.
