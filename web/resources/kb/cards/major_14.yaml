bieu_tuong:
- Thiên thần cánh đỏ, áo trắng, đứng rót nước từ chiếc cốc vàng này sang chiếc cốc vàng kia, dòng nước chảy chéo giữa hai cốc
- Một chân giẫm lên tảng đá trên bờ, chân kia đặt xuống mặt nước ao
- Trên trán có vòng tròn mặt trời, trước ngực là hình tam giác nằm trong ô vuông
- Bên bờ ao mọc khóm hoa diên vĩ vàng cao
- Một con đường mòn dẫn từ ao lên dãy núi xa, trên đỉnh núi sáng lên một vầng như vương miện
- Nền trời vàng nhạt, cỏ xanh hai bên
cot_loi: Pha hai thứ khác nhau cho vừa, không thiếu không thừa. Chừng mực, kiên nhẫn, điều hoà cái đối nghịch thành một dòng; kết quả đến từ liều lượng đúng và thời gian, chứ không phải từ chọn phe hay ép.
tu_khoa_xuoi:
- vừa đủ
- pha cho vừa
- chừng mực
- đúng liều
- dung hoà hai bên
- chậm mà đều
- một chân mỗi bên
- có thời gian mới xong
tu_khoa_nguoc:
- quá liều
- nghiêng hẳn một bên
- làm quá tay
- sốt ruột
- hai thứ không hoà
- lẫn lộn
- nay thế này mai thế khác
- rót tràn
canh_bao: Quá liều, nghiêng hẳn một bên, sốt ruột rót tràn; hoặc nay thế này mai thế khác, hai thứ trộn mãi không hoà. Tránh hiểu tiết chế thành kiêng khem, ăn uống, cai rượu, giảm cân hay bất kỳ chuyện thân thể nào, vì lá nói về liều lượng trong việc và trong người chứ không kê đơn; với tình cảm cũng không nên đọc ra hai người hoà hợp hoàn hảo, nghĩa đúng là đang tìm liều, chưa tới.
