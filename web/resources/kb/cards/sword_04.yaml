id: sword_04
ten_vi: Bốn Kiếm
ten_en: Four of Swords
arcana: phu
so: 4
chat: kiem
hoang_gia: false
bieu_tuong:
- Tượng một hiệp sĩ nằm dài trên nắp mộ đá, hai bàn tay chắp trước ngực trong tư thế cầu nguyện, mắt nhắm
- Tượng và mộ tạc màu vàng, hiệp sĩ mặc áo giáp, nằm ngửa thẳng người trong một gian nhà thờ
- Ba thanh kiếm treo song song trên bức tường phía trên đầu tượng, mũi kiếm chĩa xuống
- Một thanh kiếm thứ tư khắc dọc trên thành mộ, ngay bên dưới tượng nằm
- Trên cao góc trái là một ô cửa kính màu, vẽ hình một người phụ nữ và một đứa trẻ, có chữ cái nhỏ trên kính
- Không có người sống nào trong cảnh, không gian kín, tĩnh, ánh sáng lọt qua kính màu
- 'Tông màu chủ đạo: vàng của tượng và mộ, xám của tường đá, điểm màu ở cửa kính'
cot_loi: Rút lui để nghỉ, không phải bỏ cuộc. Sau va chạm, đầu óc cần một khoảng lặng, gác vũ khí sang bên để hồi sức rồi mới quay lại; trạng thái này có hạn, là chỗ nằm tạm chứ không phải chỗ ở.
tu_khoa_xuoi:
- nghỉ lấy sức
- lui về nghỉ
- nằm yên một dạo
- gác kiếm
- một mình cho lặng
- ngủ bù
- tạm ngưng
- chưa vội trở lại
tu_khoa_nguoc:
- chưa nghỉ đã dậy
- không được nghỉ
- kiệt sức vì ráng
- bồn chồn không yên
- quay lại việc
- nằm mãi không dậy
- trốn đời
canh_bao: Nghỉ mà không dậy nổi thì thành trốn đời, lấy cớ hồi sức để né việc và né người; chiều ngược lại là chưa lành đã ráng, kiệt sức vì không chịu nằm yên. Mộ và tượng trên hình chỉ là chỗ nằm tạm, tuyệt đối không đọc thành bệnh nặng, nằm viện hay chuyện sinh tử. Cũng đừng hiểu tạm xa nhau ở đây là chia tay, hay xin nghỉ là mất việc.
nguyen_to: khi
chiem_tinh_gd: Sao Mộc ở Thiên Bình
chiem_tinh_hd: null
sac_thai:
  trong_luong: vừa
  dong_tinh: tĩnh
  huong: nằm yên
lang_kinh:
  tinh_cam: Hai người tạm xa nhau ít lâu, ai về nhà nấy cho lặng, không phải chia tay; người đang một mình thì đây là lúc chưa cần đi tìm ai.
  cong_viec: Xin nghỉ phép hoặc tạm rút khỏi dự án đang căng để lấy lại sức, chưa phải lúc nhận thêm việc hay đổi chỗ, nghỉ xong rồi tính.
  tien_bac: Tạm ngưng sắm sửa, tiêu dè lại sau một đợt cạn túi để hồi phục; ngược thì dè đến mức keo kiệt với chính mình, không dám ăn miếng ngon.
  tam_ly: Mệt vì nghĩ quá nhiều, cần im lặng và ở một mình vài hôm; không phải chán đời, chỉ là đầu óc cần tắt đi ít lâu rồi bật lại.
  hoc_hanh: Học đến mụ đầu, cần nghỉ hẳn vài ngày, ngủ đủ rồi mới quay lại ôn; cố nhồi thêm lúc này chỉ tốn giờ, chữ không vào.
cach_noi_viet:
- nghỉ tay một lát
- ngủ một giấc cho đã
- lui về ở ẩn
- nằm im thở khẽ
- để nguội đã rồi tính
