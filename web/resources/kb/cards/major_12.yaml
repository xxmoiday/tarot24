  huong: lộn ngược tại chỗ
lang_kinh:
  tinh_cam: 'Mối này đang treo: một bên chờ, một bên chưa quyết; tạm gác để nhìn lại thay vì ép câu trả lời, chờ có chủ ý khác chờ vô vọng.'
  cong_viec: Dự án đình lại, chờ duyệt, chờ người khác; người hỏi chịu thiệt một chút để giữ cái lớn hơn, hoặc lùi một bước để nhìn việc từ góc khác.
  tien_bac: Khoản tiền bị treo, chưa về, phải nhịn một thời gian; chịu mất một khoản để dứt chuyện lớn hơn, khác với kẹt tiền mà không thấy lối.
  tam_ly: Cảm giác lơ lửng, không tiến không lùi, nhưng đầu bắt đầu thấy khác; cái đang học là nhìn ngược lại điều mình vẫn tin.
  hoc_hanh: Học đang chững, thi hoãn, đổi phương pháp mới vào; giai đoạn tưởng đứng yên nhưng đầu đang sắp xếp lại, chưa nên bỏ cuộc.
cach_noi_viet:
- án binh bất động
- thả con săn sắt, bắt con cá rô
- chịu đấm ăn xôi
- lùi một bước để tiến hai bước
- chờ được vạ thì má đã sưng
- há miệng chờ sung
