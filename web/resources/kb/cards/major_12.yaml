id: major_12
ten_vi: Người Treo Ngược
ten_en: The Hanged Man
arcana: chinh
so: 12
chat: null
hoang_gia: false
bieu_tuong:
- Người đàn ông treo ngược đầu xuống đất, bị buộc bằng chân phải vào thanh ngang của một cây gỗ hình chữ T
- Chân trái gập lại đặt sau đầu gối chân phải, hai tay giấu sau lưng
- Quanh đầu là vầng sáng vàng, mặt bình thản, mắt mở
- Áo xanh lam, quần bó đỏ, giày vàng
- Cây gỗ treo người còn tươi, có lá xanh mọc ra từ hai đầu thanh ngang
- Nền xám trơn, không có phong cảnh
cot_loi: Dừng lại giữa chừng, chịu mất một thứ, và nhìn đời từ chiều ngược. Đứng yên là chủ ý, không phải bị kẹt; hy sinh để thấy được điều mà lúc còn chạy không thể thấy.
tu_khoa_xuoi:
- dừng giữa chừng
- treo lơ lửng
- nhìn ngược lại
- chịu mất một thứ
- tạm gác
- chờ có chủ ý
- đổi góc nhìn
- hy sinh để thấy
tu_khoa_nguoc:
- kẹt thật
- chờ mà không thấy gì
- chống lại việc dừng
- hy sinh uổng
- than thân nạn nhân
- được thả xuống
- chân chạm đất lại
- chần chừ vô ích
canh_bao: Người treo lâu quá quên mất mình tự chọn treo; chờ mà không thấy gì, hy sinh uổng, rồi than mình là nạn nhân. Không nên đọc thành xui xẻo, bị hại hay bị người ta trói; treo ở đây phần lớn do người hỏi chủ động dừng. Hạn chờ bao lâu hay lời khuyên cứ hy sinh đi đều nằm ngoài lá; việc của nó là đổi góc nhìn, không phải chịu đựng vô điều kiện.
nguyen_to: thuy
chiem_tinh_gd: Nguyên tố Thuỷ
chiem_tinh_hd: Hải Vương Tinh
sac_thai:
  trong_luong: nặng
