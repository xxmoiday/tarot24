lang_kinh:
  tinh_cam: Cãi nhau mà cố thắng cho bằng được, người kia im lặng bỏ đi; được lý về mình mà mất luôn người muốn giữ.
  cong_viec: Thắng trong cuộc họp, giành được cái ghế hay đề xuất được duyệt, nhưng đồng nghiệp quay lưng và sếp nhớ mãi cách hơn thua ấy.
  tien_bac: Đòi được nợ hay giành được phần chia, nhưng phải cãi đến cạn tình với người nhà, bạn bè; tiền về mà mối quan hệ đi.
  tam_ly: Tự thấy mình đúng mà sao trống rỗng, đứng giữa phần thắng không ai chung vui, ngoài mặt cười khẩy còn trong lòng bắt đầu hối.
  hoc_hanh: Tranh luận với thầy hay bạn cùng nhóm để giành phần đúng, thắng nhưng bị cả nhóm tránh làm chung; điểm bài nhóm vì thế mà xuống.
