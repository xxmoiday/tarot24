id: sword_05
ten_vi: Năm Kiếm
ten_en: Five of Swords
arcana: phu
so: 5
chat: kiem
hoang_gia: false
bieu_tuong:
- Một người đàn ông đứng phía trước, đầu quay nhìn qua vai về phía sau, miệng cười khẩy, ôm hai thanh kiếm trên vai trái và cầm thanh thứ ba chúc mũi xuống đất bằng tay phải
- Anh ta mặc áo ngắn màu đỏ bên ngoài, áo lót màu xanh lá, tóc xoăn ngắn, thân hình gọn
- Hai thanh kiếm còn lại nằm rời trên mặt đất dưới chân anh ta, bị bỏ lại
- Xa hơn là hai người đang đi bỏ về phía mặt nước, lưng quay lại, một người cúi đầu, ôm mặt bằng hai tay
- Mặt nước xanh ở nền, bờ bên kia có đồi thấp, không có nhà cửa
- Trời xanh nhưng mây bị xé thành từng mảnh lởm chởm, gió thổi tóc và áo bay
- 'Tông màu chủ đạo: đỏ và xanh lá của áo người thắng, xám của đất, xanh của nước và trời'
cot_loi: Thắng mà mất người. Cãi đã ngã ngũ, kẻ đứng lại ôm trọn phần thắng nhưng chỉ còn một mình; cố đúng cho bằng được thì trả bằng tình nghĩa và mặt mũi, mà mất là cả hai bên cùng mất.
tu_khoa_xuoi:
- cãi thắng
- được lý mất tình
- thắng rỗng
- bên kia bỏ đi
- hơn thua đến cùng
- mất mặt cả đôi
- ở lại một mình
- cười khẩy
tu_khoa_nguoc:
- làm hoà
- xin lỗi trước
- chịu thua cho yên
- hối sau khi thắng
- thù dai
- trả đũa
- cãi dai không dứt
- thua trắng
canh_bao: 'Thắng kiểu này mà lặp lại thành thói thì quanh mình chẳng còn ai, cãi dai không dứt, thù lâu, trả đũa qua lại đến khi cả hai đều thua trắng. Người luận tránh hai lối mòn: một là thấy kẻ cầm kiếm ở lại thì báo là thắng, thắng ở đây rỗng; hai là đoán chắc người hỏi là bên nào, có thể chính họ đang cúi đầu bỏ đi. Không kéo sang chuyện kiện tụng hay đánh nhau, lá này nói về hơn thua bằng lời.'
