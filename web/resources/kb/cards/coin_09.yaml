id: coin_09
ten_vi: Chín Tiền
ten_en: Nine of Pentacles
arcana: phu
so: 9
chat: tien
hoang_gia: false
bieu_tuong:
- Một người phụ nữ đứng một mình trong vườn nho, trên cổ tay đeo găng đậu một con chim ưng bịt mắt
- Bà mặc áo dài rộng màu vàng có hoa văn đỏ, đội mũ bê rê đỏ, tay kia đặt hờ lên một đồng tiền
- Những chùm nho tím trĩu trên giàn, các đồng tiền treo xen giữa dây nho quanh người bà
- Dưới đất gần chân bà có một con ốc sên nhỏ đang bò
- Phía xa sau vườn là một ngôi nhà lớn kiểu trang viên và hàng cây
- Nền trời vàng, dãy núi mờ ở tận cùng, cả lá bài tràn màu vàng và xanh lá
cot_loi: Tự chủ và sung túc do chính mình gây dựng, hưởng một mình vì tự làm ra, không phải nhờ ai cho. Kỷ luật lâu ngày đã thành nếp, giờ có thể thảnh thơi đứng giữa thành quả của mình.
tu_khoa_xuoi:
- tự lo được
- có của riêng
- tự tay gây dựng
- không cần nhờ ai
- ung dung
- hoa thơm trái ngọt
- nếp đã thành
- hưởng thành quả tự làm
tu_khoa_nguoc:
- tiêu quá túi
- khoe của
- phải nhờ người
- giàu mà trống
- kế hoạch đổ bể
- bị lừa của
- lật lọng chuyện tiền
- bỏ nếp kỷ luật
canh_bao: Tự lo được lâu ngày dễ thành không cần ai, vườn đẹp mà chỉ có một người đi dạo. Tiêu quá túi để giữ dáng sung túc, hay của làm ra bị lừa mất vì tin nhầm người, là mặt ngược. Người phụ nữ đứng một mình không phải ế hay cô đơn, không đọc thành sẽ chẳng có ai; tự chủ ở đây là được chọn, không phải bị bỏ lại. Cũng không lấy cảnh sung túc trong hình để hứa sắp giàu hay khuyên mua nhà đất.
