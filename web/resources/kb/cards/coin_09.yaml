  huong: đứng giữa vườn
lang_kinh:
  tinh_cam: Người hỏi tự lo được, không cần ai để thấy đủ; độc thân mà ổn, có yêu thì chọn kỹ; ngược là giàu có mà bên cạnh trống.
  cong_viec: Làm riêng, tự chủ công việc, có thành quả không phải nhờ ai; ngồi vị trí đủ cao để làm theo cách mình muốn.
  tien_bac: Có của riêng tự tay gây dựng, chi tiêu thoải mái trong sức mình, không phải ngửa tay xin ai; lố tay là vì khoe hơn vì cần.
  tam_ly: Ung dung, tự tin vì biết rõ mình đã làm gì để có hôm nay; kỷ luật thành nếp nên không phải gồng.
  hoc_hanh: Tự học được, không cần ai ép, có nếp học riêng và kết quả chứng minh; học vì muốn giỏi chứ không vì ai bắt.
cach_noi_viet:
- tự lực cánh sinh
- tay làm hàm nhai
- ăn nên làm ra
- khéo ăn thì no, khéo co thì ấm
- một mình một cõi
- khôn ba năm dại một giờ
