id: sword_02
ten_vi: Hai Kiếm
ten_en: Two of Swords
arcana: phu
so: 2
chat: kiem
hoang_gia: false
bieu_tuong:
- Một người phụ nữ ngồi bịt mắt bằng dải vải trắng, hai tay bắt chéo trước ngực, mỗi tay cầm một thanh kiếm dựng chếch lên dựa vào vai
- Hai thanh kiếm dài ngang nhau, chĩa lên hai hướng đối xứng như chữ V mở rộng
- Cô mặc áo choàng dài màu xám trắng, ngồi trên một băng ghế đá thấp, lưng quay ra biển
- Sau lưng là mặt nước lặng với vài mỏm đá nhô lên, bờ nước ở xa
- Trên trời một vành trăng lưỡi liềm nhỏ, cảnh về đêm nhưng bầu trời sáng màu xám xanh
- Không có ai khác trong khung hình, mặt đất nơi cô ngồi trơ, không cỏ cây
- 'Tông màu chủ đạo: xám, trắng, xanh nhạt của nước và trời'
cot_loi: Đứng giữa hai ngả mà không chọn, cố tình nhắm mắt để khỏi phải quyết. Không phải hết lối mà bí; hai bên đang cân nhau chỉ vì mình khất lần, chưa động tới. Yên lúc này là yên tạm, càng để lâu càng khó gỡ.
tu_khoa_xuoi:
- bịt mắt làm ngơ
- chưa dám chọn
- hoãn quyết định
- giữ thế thủ
- lặng để yên chuyện
- đứng giữa hai bên
- tránh nhìn thẳng
- án binh bất động
tu_khoa_nguoc:
- tháo khăn bịt mắt
- buộc phải chọn
- bên nào cũng ép
- rối không quyết nổi
- hai lòng
- thế thủ vỡ
- nói dối cho êm
canh_bao: Đứng giữa hai ngả mà bịt mắt mãi, người trong cuộc dần thành kẻ hai lòng, nói dối mỗi bên một chút cho êm, đến khi thế thủ vỡ thì cả hai bên đều thấy mình bị lừa. Chỗ dễ đọc lố là hiểu cái thế cân này thành yên ổn, hoà thuận; yên ở đây là do chưa dám nhìn. Cũng không nên suy từ hai lòng ra ngoại tình, chuyện bị né thường là một quyết định chứ không phải một người khác.
nguyen_to: khi
chiem_tinh_gd: Mặt Trăng ở Thiên Bình
chiem_tinh_hd: null
sac_thai:
  trong_luong: vừa
  dong_tinh: tĩnh
  huong: đứng chắn ngang
lang_kinh:
  tinh_cam: Biết mối này có vấn đề mà không muốn nhìn, cứ để lửng lơ, hoặc kẹt giữa người yêu và gia đình mà bên nào cũng chưa dám trả lời.
  cong_viec: Hai lời mời, hai hướng đi mà cứ ngâm không trả lời, hay thấy đồng nghiệp làm sai mà giả điếc; trì hoãn giữ được yên ổn thêm ít lâu thôi.
  tien_bac: Hai khoản phải xử mà không dám đụng khoản nào, để tiền nằm yên và nợ cũng nằm yên, tạm ổn cho đến khi một bên tự động đến hạn.
  tam_ly: Tự nhủ chưa cần nghĩ tới, gạt chuyện sang bên để lòng được yên; cái yên này là do bịt mắt, chuyện vẫn đứng đó chờ.
  hoc_hanh: Kẹt giữa hai ngành, hai trường, hay giữa học tiếp và đi làm, cứ khất mãi không chọn; khất đến hạn nộp thì hạn nộp chọn giùm.
cach_noi_viet:
- mắt nhắm mắt mở
- để mai tính
- dĩ hoà vi quý
- khất lần khất lữa
- chuyện đâu còn có đó
