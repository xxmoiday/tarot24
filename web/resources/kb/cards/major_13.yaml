chat: null
hoang_gia: false
bieu_tuong:
- Bộ xương mặc giáp đen cưỡi con ngựa trắng, tay cầm lá cờ đen vẽ bông hồng trắng năm cánh
- Một vị vua nằm ngửa dưới vó ngựa, vương miện văng ra bên cạnh
- Một giáo sĩ đội mũ cao, mặc áo lễ, đứng chắp tay hướng về phía kỵ sĩ
- Một người phụ nữ quỳ ngoảnh mặt đi và một đứa trẻ quỳ cầm bó hoa nhìn thẳng lên ngựa
- Phía sau có dòng sông và một con thuyền nhỏ
- Mặt trời mọc giữa hai toà tháp ở chân trời xa
- Nền trời xám nhạt
cot_loi: Một chuyện đến hồi kết và không quay lại được. Dứt hẳn, buông cái đã hết, để chỗ cho cái khác mọc; đổi thay này lớn, đằng nào cũng đến, chậm mà chắc, là lột xác chứ không phải tai hoạ.
tu_khoa_xuoi:
- dứt hẳn
- hết hồi
- không quay lại được
- khép lại chuyện cũ
- sang trang
- lột xác
- chậm mà không cản được
- cái cũ phải đi
tu_khoa_nguoc:
- níu cái đã hết
- sợ dứt
- chuyện cũ lằng nhằng
- đứng hình
- cản cái phải đến
- dùng dằng mãi
- vực dậy sau khép lại
- mắc kẹt ở hồi cuối
canh_bao: 'Khép lại mà không chịu khép: níu cái đã hết, dùng dằng, đứng hình ở hồi cuối, cản cái đằng nào cũng đến. Đây là lá phải giữ chặt nhất: không bao giờ đọc thành chết chóc, tang sự, bệnh nặng hay tai nạn, kể cả khi người hỏi hỏi thẳng về sức khoẻ người thân; câu trả lời chỉ ở mức một chuyện đang kết thúc hẳn. Làm nhẹ quá thành thay đổi tích cực kiểu khẩu hiệu cũng sai; cái mất là thật, chỉ không phải cái chết.'
nguyen_to: thuy
chiem_tinh_gd: Bọ Cạp
