sac_thai:
  trong_luong: rất nặng
  dong_tinh: động mạnh
  huong: tiến chậm không lùi
lang_kinh:
  tinh_cam: Một mối đến hồi kết, chia tay dứt hẳn, không quay lại; hoặc mối cũ hết đời của nó để hai người sang một dạng khác, ngược thì là níu cái đã hết.
  cong_viec: Nghỉ việc, đóng công ty, kết thúc một vai trò đã hết đường; chuyện đến chậm mà chắc, ngược thì là bám ghế cũ khi việc đã hết.
  tien_bac: Một nguồn thu chấm dứt, cách kiếm tiền cũ không còn; phải khép sổ chuyện cũ để mở nếp mới, mất mát này là bước sang trang.
  tam_ly: Con người cũ đang hết thời của nó, cách sống cũ không dùng được nữa; đau, lột xác, nhưng biết rõ là không thể quay lại.
  hoc_hanh: Bỏ ngành, thôi học một hướng đã hết hợp, đóng lại chặng học cũ để bắt đầu chặng mới hoàn toàn khác; tiếc cũng không giữ được.
cach_noi_viet:
- dứt áo ra đi
- một đi không trở lại
- ván đã đóng thuyền
- thay da đổi thịt
- tống cựu nghinh tân
- nửa ở nửa về
