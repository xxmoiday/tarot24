id: major_11
ten_vi: Công Lý
ten_en: Justice
arcana: chinh
so: 11
chat: null
hoang_gia: false
bieu_tuong:
- Người ngồi thẳng trên ngai đá giữa hai cột xám, tay phải giơ thanh kiếm dựng thẳng đứng lên trời
- Tay trái cầm chiếc cân hai đĩa buông thấp ngang gối
- Áo choàng đỏ, khoác thêm tấm choàng xanh lá, có khoá vuông trước ngực
- Đội vương miện có ô vuông nhỏ ở chính giữa trán
- Một bàn chân đi hài trắng thò ra khỏi vạt áo
- Tấm màn tím treo sau lưng, khoảng hở giữa màn và cột lộ nền vàng
cot_loi: Mỗi việc đã làm đều có cái giá đúng với nó. Cân, xét, quyết bằng lý lẽ, không thiên vị; nhận về cái gì là ứng với cái đã gieo, nên đây là nhân quả, là tỉnh táo, không phải may rủi.
tu_khoa_xuoi:
- công bằng
- nhân quả
- sòng phẳng
- gieo gì gặt nấy
- xét cho rõ
- không thiên vị
- quyết bằng lý
- ký giấy rõ ràng
tu_khoa_nguoc:
- bất công
- thiên vị
- cân lệch
- đổ lỗi cho người
- trốn hậu quả
- xử ép
- chưa ngã ngũ
- ăn gian
canh_bao: 'Cái cân lệch: xử ép, thiên vị, hoặc chính người hỏi đang đổ lỗi cho người để trốn phần mình phải trả. Lá này không được dùng để đoán thắng thua trong kiện tụng, tranh chấp, ly hôn ra toà; kể cả khi câu hỏi nhắc tới luật sư hay toà án, chỉ luận về công bằng và nhân quả. Gieo gì gặt nấy là mô tả, không phải lời trách phạt hay đe doạ người hỏi.'
nguyen_to: khi
chiem_tinh_gd: Thiên Bình
chiem_tinh_hd: null
sac_thai:
  trong_luong: nặng
  dong_tinh: tĩnh
  huong: cân hai bên
lang_kinh:
  tinh_cam: Hai người cần sòng phẳng với nhau, cho bao nhiêu nhận bấy nhiêu; chia tay thì chia rõ ràng; ai đã sai với ai giờ đến lúc trả.
  cong_viec: Được đánh giá đúng công sức, hợp đồng, thoả thuận, xét lương lên bàn cân; người hỏi được xét đúng nếu có lý, ngược thì là bị xử ép hoặc chính mình thiên vị.
  tien_bac: Nợ ai trả nấy, ai nợ mình cũng phải trả, ký giấy đọc kỹ từng dòng; tiền về ứng đúng công đã bỏ, không có lộc trời cho, ngược thì là bị chia thiếu phần.
  tam_ly: Tỉnh táo, cân hai bên, muốn quyết bằng lý chứ không bằng cảm tình; câu hỏi tự đặt ra là mình có công bằng với người và với chính mình không.
  hoc_hanh: Điểm số phản ánh đúng lượng học, thi công bằng, không may rủi; hợp học luật, kế toán, các môn cần lập luận chặt.
cach_noi_viet:
- gieo gió gặt bão
- ở hiền gặp lành
- có vay có trả
- ăn cho đều, kêu cho sòng
- phải trái phân minh
- nhất bên trọng, nhất bên khinh
