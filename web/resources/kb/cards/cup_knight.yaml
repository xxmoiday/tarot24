id: cup_knight
ten_vi: Hiệp Sĩ Cốc
ten_en: Knight of Cups
arcana: phu
so: null
chat: cup
hoang_gia: true
bieu_tuong:
- Kỵ sĩ mặc giáp cưỡi ngựa xám trắng đi bước chậm, tay phải giơ chiếc cốc ra phía trước ngang tầm mắt
- Mũ giáp gắn cánh, gót giày cũng gắn cánh
- Ngoài giáp khoác áo in hình cá đỏ
- Ngựa cúi đầu, bước từ tốn, không phi
- Trước mặt là con sông chảy ngang, bên kia sông là vách đá và mấy cây thưa
- Trời sáng, ít mây
cot_loi: Một lời mời, một đề nghị, một người mang tình cảm tới, đi chậm và có lễ. Đẹp ở cách tỏ ra nhiều hơn ở việc làm; cần xem sau lời mời có gì thật, hay chỉ có lời.
tu_khoa_xuoi:
- lời mời tới
- ngỏ lời
- hào hoa lịch sự
- tán tỉnh có lễ
- lời mời cần soi
- người mang tin tình
- tiến tới từ tốn
- mơ mộng đa tình
tu_khoa_nguoc:
- hứa suông
- dẻo mồm
- lừa tình
- lời mời rút lại
- đội lốt tử tế
- cả thèm chóng chán
- yêu như phim
- hờn dỗi thất thường
canh_bao: Lời mời đẹp, cử chỉ chuẩn, rồi hôm sau rút lại; hứa suông, đội lốt tử tế để lấy lòng hay lấy tiền, yêu như phim rồi hết phim là hết. Nghĩa xấu của lá là lừa bằng vẻ ngoài, nhưng người luận không kết luận người kia đang lừa hay ngoại tình chỉ vì lá này, kể cả khi ngược; nói là lời mời cần soi, không nói là kẻ lừa. Tránh đọc lá xuôi thành cầu hôn hay đám cưới chắc chắn; mới là bước ngỏ lời.
nguyen_to: thuy
chiem_tinh_gd: Khí của Thuỷ — Hoàng Tử (Prince); 20° Thiên Bình – 20° Bọ Cạp
chiem_tinh_hd: null
sac_thai:
  trong_luong: nhẹ
  dong_tinh: động vừa
  huong: tiến tới từ tốn
lang_kinh:
  tinh_cam: Ai đó sắp ngỏ lời, tỏ tình, rủ về ra mắt; lời lẽ đẹp, cử chỉ có lễ, phải xem người ấy có làm như nói không.
  cong_viec: Nhận được lời mời làm việc hoặc đề nghị hợp tác trình bày rất đẹp; đọc kỹ điều khoản trước khi gật, vì phần nói hay hơn phần thật.
  tien_bac: Có người đề nghị góp vốn, cho vay, chung tiền với lời lẽ ngọt; lời hứa thường nghe hay hơn phần chắc, tiền dễ đi theo lời.
  tam_ly: Đầu đầy hình ảnh đẹp về người kia, về chuyện sắp tới; yêu cái viễn cảnh hơn cái đang có, dễ hụt khi thực tế không như phim.
  hoc_hanh: Được mời tham gia một khoá, một nhóm học nghe rất hay; xem nội dung có thật như lời giới thiệu không trước khi đóng tiền.
cach_noi_viet:
- trồng cây si
- thả thính
- lời chào cao hơn mâm cỗ
- nói ngọt lọt đến xương
- hứa hươu hứa vượn
- miệng nam mô, bụng bồ dao găm
ba_cach_doc:
  la_nguoi: Hào hoa, lịch sự, nói năng có duyên, biết cách làm người khác thấy mình được trân trọng. Anh chàng tán tỉnh đúng bài, đối tác chào hàng rất đẹp, người bạn lúc nào cũng có lời hay để nói. Đẹp ở cách tỏ ra; phải xem phần làm có bằng phần nói không.
  la_nang_luong: Tiến tới từ tốn, có lễ, đi theo cái lòng mình thích nhưng không xông. Chủ động ngỏ lời, tỏ ý cho đẹp, với người cũng như với việc. Có điều lời ngỏ phải có việc thật đi kèm, không thì chỉ còn câu chữ hay và hình ảnh đẹp trong đầu.
  la_tinh_huong: Sắp có lời mời, lời ngỏ, đề nghị hợp tác, lời rủ về ra mắt, hay một người mang tin tình cảm tới. Chuyện đang tiến đến nhẹ nhàng, mới là bước mở lời, chưa phải chốt. Ngược thì lời mời rút lại, hứa suông, vẻ tử tế bên ngoài che một ý khác.
