id: sword_07
ten_vi: Bảy Kiếm
ten_en: Seven of Swords
arcana: phu
so: 7
chat: kiem
hoang_gia: false
bieu_tuong:
- Một người đàn ông rón rén nhón chân đi ngang qua khung hình, hai tay ôm năm thanh kiếm, lưỡi kiếm chĩa lên, cầm bằng cả lưỡi lẫn chuôi
- Anh ta đội mũ chóp đỏ, mặc áo dài ngắn tay sọc màu đỏ nâu, đi bốt đỏ, mặt quay ngoái lại phía sau với vẻ cười trộm
- Hai thanh kiếm còn lại cắm thẳng đứng trên nền đất phía sau lưng anh ta
- Nền là một khu trại với những lều vải nhiều màu dựng liền nhau, không có lính canh
- Xa hơn ở góc trái là một nhóm người nhỏ đứng quây quanh nhau, có vẻ đang ở gần trại
- Nền trời và mặt đất đều màu vàng sáng, cảnh ban ngày, không có bóng đổ dài
- 'Tông màu chủ đạo: vàng nhạt của trời và đất, đỏ của mũ, áo và bốt'
cot_loi: Mưu mẹo và đi lối tắt. Lấy được thứ mình muốn bằng cách lách chứ không đối mặt; khôn lúc cần, nhưng lúc nào cũng có thể lộ, và lấy kiểu này thì không bao giờ lấy được trọn.
tu_khoa_xuoi:
- lấy lén
- lách luật
- khôn lỏi
- giấu bài
- tránh đối đầu
- toan tính riêng
- lấy chưa trọn
- dễ bị lộ
tu_khoa_nguoc:
- bị bắt quả tang
- đem trả lại
- thôi mưu mẹo
- làm cho đàng hoàng
- lương tâm cắn rứt
- tự lừa mình
- hoá ra bị lừa
- nghe lời khuyên
canh_bao: Mưu mẹo dùng quen thì tự lừa mình trước, tưởng khôn hoá ra bị người khác lừa lại, và kẻ ôm kiếm ngoái nhìn ấy lúc nào cũng sống trong nỗi lo bị bắt quả tang. Chỗ đọc lố hay gặp nhất là chỉ thẳng người yêu hay đối tác đang lừa dối; kẻ lén lút có thể chính là người hỏi, hoặc chỉ là một cách né đối đầu. Tránh gán thành trộm cắp, lừa đảo rồi lấn sang chuyện pháp luật.
nguyen_to: khi
