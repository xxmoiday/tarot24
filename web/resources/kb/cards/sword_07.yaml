lang_kinh:
  tinh_cam: Có chuyện giấu nhau, nhắn tin lén, người thứ ba đứng phía sau; hoặc chính người hỏi đang toan tính riêng mà không nói thật với đối phương.
  cong_viec: Ai đó ở chỗ làm đang làm việc sau lưng, lấy ý tưởng hay giấu thông tin; nếu chính người hỏi đi cửa sau thì kế đó khó giữ kín lâu.
  tien_bac: Tiền hụt vì có người xà xẻo, hợp đồng có kẽ hở hay khoản chi mập mờ; hoặc người hỏi đang lập quỹ đen, giấu được nhưng dễ lộ.
  tam_ly: Đang giấu một phần mình, khéo léo đối phó với mọi người thay vì nói thật; khôn lỏi kiểu này mệt, vì lúc nào cũng phải ngoái lại canh chừng.
  hoc_hanh: Quay cóp, mượn bài người khác nộp, hay học mẹo để qua kỳ thi thay vì hiểu bài; qua được thì cũng hổng, và dễ bị bắt.
