id: sword_10
ten_vi: Mười Kiếm
ten_en: Ten of Swords
arcana: phu
so: 10
chat: kiem
hoang_gia: false
bieu_tuong:
- Một người đàn ông nằm sấp úp mặt xuống đất, mười thanh kiếm cắm dọc lưng từ đầu đến chân, chuôi kiếm dựng lên thành hàng
- Ông ta mặc áo choàng đỏ phủ nửa thân dưới, tay phải duỗi ra phía trước trên nền đất, không cử động
- Nền trời phía trên đen kịt, mây dày phủ hết phần trên lá bài
- Sát đường chân trời là một dải trời vàng sáng, ánh sáng đầu ngày hoặc cuối ngày ló ra dưới lớp mây đen
- Phía sau người nằm là mặt nước phẳng lặng và dãy núi thấp ở bờ xa
- Không có ai khác trong cảnh, không cây cối, đất trơ
- 'Tông màu chủ đạo: đen của trời, vàng của dải sáng chân trời, đỏ của áo choàng'
cot_loi: Tận cùng của một chuyện, không còn gì để mất thêm. Kết thúc dứt khoát, đau nhưng rõ ràng, và chính vì đã chạm đáy nên chỉ còn đường đi lên; đây là điểm dừng hẳn, không phải nỗi đau kéo dài.
tu_khoa_xuoi:
- chạm đáy
- hết đường lùi
- kết thúc hẳn
- đau mà dứt
- chuyện đã xong
- hết cái để mất
- đau tận cùng
- sáng ló chân trời
tu_khoa_nguoc:
- gượng dậy
- qua cơn tệ nhất
- qua bão
- thoát cú chót
- kéo lê nỗi đau
- than quá mức
- sợ đau lần nữa
- đỡ mà chưa hết
canh_bao: Chạm đáy rồi mà không chịu đứng dậy, kéo lê nỗi đau, than nhiều hơn mất, sợ đau lần nữa đến mức không dám bắt đầu lại. Chính Waite ghi rõ đây không phải lá của cái chết dữ dội; mười thanh kiếm cắm trên lưng không được đọc thành tai nạn, bị hại hay tin dữ về sinh mạng ai. Cũng không nên suy ra bị đâm sau lưng, phản bội; hướng đúng là kết thúc hẳn một chuyện, kèm dải sáng ở chân trời.
