lang_kinh:
  tinh_cam: Mối này đã chấm dứt hẳn, không còn gì để níu, kể cả khi người cũ muốn quay lại; đau đến tận cùng, nhưng từ đây mới bước tiếp được.
  cong_viec: Bị cho nghỉ, dự án sập, hoặc cái nghề đang theo đã hết đường; mất nhiều nhưng đã rõ, tính lại từ đầu thay vì cố vá cái đã hỏng hẳn.
  tien_bac: Mất trắng một khoản, vỡ nợ hay tiêu cạn đến đồng cuối, và vì điều tệ nhất đã xảy ra nên không còn gì để mất thêm, từ đây chỉ có làm lại.
  tam_ly: Đã đau đến tận cùng và lạ thay lại thấy nhẹ, vì không còn gì để sợ mất; tâm thế của người đứng dậy từ đáy, không phải người kêu than.
  hoc_hanh: Thi rớt hẳn, bị đình chỉ, hay nhận ra ngành này không thể theo nữa; mất mấy năm nhưng đã rõ, làm lại từ chỗ khác chứ không cố ráng thêm.
