ten_vi: Mười Gậy
ten_en: Ten of Wands
arcana: phu
so: 10
chat: gay
hoang_gia: false
bieu_tuong:
- Một người đàn ông ôm cả bó mười cây gậy trước ngực, gậy xoè ra như hình quạt che khuất mặt
- Lưng khom hẳn xuống dưới sức nặng, người quay lưng về phía người xem, bước đi về phía trước
- Người này mặc áo dài màu cam đỏ, bước trên nền đất nâu
- Phía xa trước mặt là một ngôi nhà nhỏ và cụm cây xanh, cạnh đó có luống đất đã cày
- Nền trời vàng nhạt, không mây
- Không có ai khác trên lá, không có con vật
cot_loi: Thành quả đã gặt về nhưng gom hết vào một mình thành gánh. Cái nặng ở đây do chính thắng lợi sinh ra; đích ở ngay trước mặt mà sức đã cạn, chỉ vì không chịu đặt bớt xuống hay chia cho ai.
tu_khoa_xuoi:
- gánh một mình
- ôm hết việc
- quá tải
- gần đích cạn sức
- không chịu chia việc
- thành công thành gánh
- lưng còng vì việc
- trách nhiệm đè nặng
tu_khoa_nguoc:
- đặt gánh xuống
- san việc cho người
- nhẹ vai
- gục dưới gánh
- đổ việc cho người
- trốn việc
- mưu mẹo sau lưng
- ôm việc người khác
canh_bao: 'Ôm hết rồi gục ngay trước cửa nhà, hoặc ngược lại đổ việc lên vai người khác và gọi đó là san sẻ; Waite còn nhắc giả dạng, mưu mẹo sau lưng, cái gánh có khi che thứ khác. Lá không phải chẩn đoán: quá tải, kiệt sức là nói việc, đừng suy ra trầm cảm hay bệnh gì. Waite có ghi hỏi kiện tụng thì chắc thua, bỏ hẳn câu đó, không phán kết quả kiện. Lưng khom không phải thất bại, đích còn ở ngay trước mặt.'
