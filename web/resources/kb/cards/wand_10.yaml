lang_kinh:
  tinh_cam: 'Một người gánh hết cả mối: lo tiền, lo nhà hai bên, lo dỗ dành, người kia chỉ đứng nhìn; thương thì vẫn thương mà vai đã oằn, cần nói ra và san bớt.'
  cong_viec: Ôm hết việc của cả phòng vì không tin ai làm được, sếp giao gì cũng nhận, về nhà vẫn mở máy; gần xong dự án mà kiệt sức, cần giao bớt trước khi gục.
  tien_bac: Một mình gánh tiền cả nhà, trả góp chồng trả góp, làm mấy việc để nuôi tất cả; thu về không ít mà lo cũng nhiều, gánh này do chính cái kiếm được sinh ra.
  tam_ly: Tự thấy mình là người duy nhất chịu trách nhiệm, không ai làm thay được, nên cắn răng ôm hết; kiệt sức mà vẫn không chịu nhận là mình đang quá tải.
  hoc_hanh: 'Ôm cùng lúc quá nhiều thứ: học chính, học thêm, chứng chỉ, việc làm thêm, phần bài nhóm của cả người khác; gần kỳ thi thì hết pin, cần bỏ bớt để giữ cái chính.'
