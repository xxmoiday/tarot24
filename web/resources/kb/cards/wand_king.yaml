id: wand_king
ten_vi: Vua Gậy
ten_en: King of Wands
arcana: phu
so: null
chat: gay
hoang_gia: true
bieu_tuong:
- Vua ngồi trên ngai nhưng xoay nghiêng người sang một bên, tay phải cầm cây gậy mọc lá chống xuống đất cạnh ngai
- Dưới vương miện đội một chiếc mũ đỏ lót trong, áo trong màu đỏ, áo choàng vàng cam in hình kỳ nhông cắn đuôi thành vòng tròn
- Một con kỳ nhông nhỏ bò trên nền đất ngay cạnh chân ngai
- Lưng ngai và bệ ngai chạm hình sư tử và kỳ nhông
- Ngai đặt trên nền đất khô, không cây cối
- Trời vàng
cot_loi: Cầm trịch một việc lớn và kéo người khác cùng làm bằng tầm nhìn và tính thẳng. Không tự xông ra mà đặt hướng rồi giao. Có uy vì nói là làm, nhưng nóng khi việc chậm.
tu_khoa_xuoi:
- đứng mũi chịu sào
- vạch hướng giao việc
- nói được làm được
- tầm nhìn xa
- ông chủ thật thà
- kéo người theo mình
- có uy tự nhiên
tu_khoa_nguoc:
- chỉ mình được nói
- nóng nảy quát tháo
- khắt khe với người
- hứa mà không giữ
- ôm hết không giao
- sếp mất uy
- vẽ to làm nhỏ
- nghiêm mà không hẹp
canh_bao: Ôm hết quyền, không ai được cãi, việc chậm một chút là quát, hứa lớn với người dưới rồi quên; vẽ tầm nhìn to nhưng giao xuống chẳng ai nhận nổi. Waite có nhắc tin thừa kế bất ngờ, nhưng không đọc thành tang sự hay tiên đoán ai sắp mất, cũng không hứa hẹn lộc lớn; nếu nhắc thì chỉ là tin từ phía gia đình. Không nên quy lá thành chồng, bố, sếp nam theo giới; đây là cách cầm trịch, ai cũng có thể mang.
nguyen_to: hoa
chiem_tinh_gd: Hoả của Hoả — Hiệp Sĩ (Knight); 20° Bọ Cạp – 20° Nhân Mã
chiem_tinh_hd: null
sac_thai:
  trong_luong: vừa
  dong_tinh: động vừa
  huong: vạch hướng phía trước
lang_kinh:
  tinh_cam: Người đàn ông từng trải, đã có gia đình hoặc làm chủ, ngỏ ý rõ ràng và giữ lời; trong hôn nhân là người quyết chuyện lớn, đôi khi áp đặt.
  cong_viec: Được giao đứng đầu một mảng, vạch hướng rồi phân việc cho đội; sếp kiểu này thẳng, nói là làm, nhưng nóng khi đội chậm tiến độ.
  tien_bac: Cầm tiền của cả một mảng việc, tiêu lớn nhưng thật thà, sổ sách rõ; tiền vào lớn nhưng đi cũng nhanh nếu việc chậm.
  tam_ly: Nhìn mình như người phải cầm trịch, chịu trách nhiệm thay cả đám; sốt ruột khi mọi thứ chậm hơn ý mình, khó ngồi hàng ghế sau.
  hoc_hanh: Chọn hướng học dài hạn rồi kéo người khác theo, làm trưởng nhóm đồ án; thầy hướng dẫn thẳng tính, đòi hỏi cao, ít kiên nhẫn.
cach_noi_viet:
- đứng mũi chịu sào
- quân tử nhất ngôn
- đầu tàu gương mẫu
- ăn to nói lớn
- nói như rồng leo, làm như mèo mửa
- cả giận mất khôn
ba_cach_doc:
  la_nguoi: 'Ông chủ, sếp mảng, trưởng họ, người bố quyết chuyện nhà: ai đang cầm trịch một việc lớn và kéo người khác theo bằng tầm nhìn chứ không bằng ép. Thẳng, nói là làm, giữ lời, nhưng nóng khi ai làm chậm. Phụ nữ làm chủ cũng mang dáng này, không cứ là đàn ông.'
  la_nang_luong: 'Đặt hướng rồi giao xuống, không ôm hết mà làm một mình. Là người chịu trách nhiệm cuối cùng: nhìn xa, quyết nhanh, nói rõ ai làm gì, hỏng thì đứng ra chịu. Phải nén được cơn nóng lúc việc không chạy như ý, kẻo uy thành quát.'
  la_tinh_huong: Chuyện này cần một người có uy đứng ra quyết và đội phía dưới làm theo; hoặc người hỏi vừa được giao đứng đầu một mảng. Cũng có thể là một việc lớn trong nhà, trong họ cần người đứng ra cầm trịch. Hoàn cảnh ổn nhưng đòi hỏi cao.
