id: sword_06
ten_vi: Sáu Kiếm
ten_en: Six of Swords
arcana: phu
so: 6
chat: kiem
hoang_gia: false
bieu_tuong:
- Một con thuyền nhỏ chở người lái đò đứng ở đuôi thuyền, tay chống một cây sào dài xuống nước, đang đẩy thuyền đi
- Trên thuyền có một người phụ nữ ngồi khom, trùm khăn kín đầu và vai, một đứa trẻ ngồi sát bên cạnh
- Sáu thanh kiếm cắm thẳng đứng ở mũi thuyền phía trước hai hành khách, dựng thành hàng như lan can
- Người lái đò mặc áo màu nâu vàng, quần ngắn, lưng hơi cong, nhìn về phía trước
- Mặt nước bên phải thuyền gợn sóng, mặt nước phía bên trái và trước mũi thuyền phẳng lặng
- Bờ bên kia ở xa có dải đất và những hàng cây thấp, cảnh mờ, không nhà
- Không ai trong thuyền nhìn về phía người xem, cả ba đều quay lưng hoặc quay nghiêng
- 'Tông màu chủ đạo: xám xanh của nước và trời, nâu vàng của thuyền và áo'
cot_loi: Rời chỗ khó sang chỗ yên hơn, đi chậm, mang theo cả nỗi buồn cũ. Mới là đoạn giữa đường, chưa phải nơi đến; cái khó còn đó nhưng đã bớt, và thường có người đưa qua nên không phải tự lo hết.
tu_khoa_xuoi:
- qua sông
- chuyến đi xa
- bỏ chỗ cũ
- chuyển chỗ ở
- có người đưa đi
- buồn mang theo
- sóng đã dịu
- đi chậm mà chắc
tu_khoa_nguoc:
- chuyến đi hoãn
- kẹt lại chỗ cũ
- sóng nổi giữa đường
- tự chèo một mình
- khó rời chỗ cũ
- quay đầu về
- chạy trốn mãi
- nói ra chuyện giấu
canh_bao: Khi thuyền không rời bến, người trong cuộc kẹt lại chỗ cũ, hoặc rời đi rồi mà cứ ngoái về, chạy trốn hết chỗ này đến chỗ khác mà nỗi buồn vẫn ngồi cùng. Đừng đọc thành chuyến đi nước ngoài, định cư hay chuyển nhà chắc chắn; nước ở đây là khoảng cách trong lòng nhiều hơn khoảng cách địa lý. Không hứa bờ bên kia là hạnh phúc, nó chỉ yên hơn chỗ vừa rời.
