  trong_luong: nặng
  dong_tinh: động vừa
  huong: sang bờ bên kia
lang_kinh:
  tinh_cam: Rời một mối đã hết cách cứu, dứt áo đi mà lòng còn nặng; hoặc hai người cùng chuyển đi nơi khác sau một dạo sóng gió, cùng nhau qua sông.
  cong_viec: Chuyển công ty, chuyển bộ phận hay đi công tác xa để thoát chỗ làm ngột ngạt; đi nhờ có người giới thiệu, lương chưa tăng nhưng dễ thở hơn.
  tien_bac: Chi một khoản để chuyển chỗ ở, đi xa, hay trả dần cho nhẹ nợ; tiền chưa rủng rỉnh nhưng đã qua đoạn ngặt nhất, hồi phục chậm mà đều.
  tam_ly: Đang bước ra khỏi một giai đoạn nặng, chưa vui nhưng bớt ngột, nỗi buồn còn ngồi bên như hành khách trên thuyền; cứ đi chậm, khỏi gượng vui.
  hoc_hanh: Chuyển trường, chuyển lớp, đi học xa nhà hay bỏ ngành cũ sang ngành hợp hơn, đoạn đầu chậm và nhớ chỗ cũ nhưng đúng hướng.
cach_noi_viet:
- qua sông phải luỵ đò
- dứt áo ra đi
- bỏ của chạy lấy người
- chân ướt chân ráo
- sông có khúc, người có lúc
- tránh vỏ dưa gặp vỏ dừa
