id: major_18
ten_vi: Mặt Trăng
ten_en: The Moon
arcana: chinh
so: 18
chat: null
hoang_gia: false
bieu_tuong:
- Vầng trăng lớn giữa trời, có khuôn mặt nghiêng nhìn xuống, những tia thẳng dài ngắn xen nhau toả quanh, những giọt nhỏ rơi từ trăng xuống
- Hai toà tháp đứng hai bên, một con đường mòn uốn lượn đi giữa hai tháp về phía núi xa
- Một con chó và một con sói đứng hai bên đường, đều ngẩng đầu tru lên trăng
- Phía trước là ao nước, một con tôm càng đang bò từ dưới ao lên bờ
- Cả lá phủ tông xanh lam và vàng nhạt
- Dãy núi xa mờ ở đường chân trời
cot_loi: Nhìn không rõ mà vẫn phải đi. Mơ hồ, ảo ảnh, lo sợ do tưởng tượng dựng lên; cái thấy chưa chắc là cái có, và điều nằm khuất quan trọng hơn cái lộ ra.
tu_khoa_xuoi:
- nhìn không rõ
- mơ hồ
- ảo ảnh
- lo bóng lo gió
- đi trong sương
- chưa lộ hết
- nửa thật nửa hư
- mộng mị
tu_khoa_nguoc:
- sương tan dần
- vỡ mộng
- hết sợ bóng
- sự thật hé ra
- tỉnh sau mê
- còn tự dối
- rối hơn
- nỗi lo dịu
canh_bao: 'Cái mờ dày lên: lo bóng lo gió thành tự dối, tỉnh mộng rồi mà vẫn không chịu nhìn cái đã hé. Chỗ dễ lố nhất là suy ngay thành đối phương lừa dối, có kẻ đâm sau lưng; sự thật là chưa rõ, và cái mờ có khi nằm trong đầu người hỏi nhiều hơn ngoài đời. Không khẳng định có người thứ ba khi chỉ có Mặt Trăng, và tránh đọc thành bệnh tâm thần, mất ngủ hay chuyện vong theo, bị ám.'
nguyen_to: thuy
chiem_tinh_gd: Song Ngư
chiem_tinh_hd: null
sac_thai:
  trong_luong: nặng
  dong_tinh: động vừa
  huong: đi vào sương
lang_kinh:
  tinh_cam: Không rõ đối phương nghĩ gì, nghi ngờ, ghen bóng, tưởng tượng nhiều hơn thật; có điều còn khuất, ngược thì là sương tan, sự thật hé ra.
  cong_viec: Chỗ làm mập mờ, tin đồn, chưa biết ai thật ai giả; dự án không rõ đích; lúc này quyết theo cảm giác sợ hãi là dễ sai, chờ rõ hơn.
  tien_bac: Số tiền chưa minh bạch, khoản thu chưa rõ nguồn, lo tiền không có căn cứ; đọc kỹ cái khuất trước khi tin cái thấy.
  tam_ly: Lo lắng mơ hồ, mộng mị, sợ thứ không tên; cái trong đầu người hỏi lớn hơn cái ngoài đời; cần phân biệt tưởng và thật.
  hoc_hanh: Học mà không biết mình hiểu chưa, ôn lan man, đề thi mơ hồ; hợp môn cần tưởng tượng, nhưng thi cử cần bám lại cái chắc.
cach_noi_viet:
- thần hồn nát thần tính
- ghen bóng ghen gió
- tranh tối tranh sáng
- thầy bói xem voi
- chưa biết đâu mà lần
- cái kim trong bọc lâu ngày cũng lòi ra
