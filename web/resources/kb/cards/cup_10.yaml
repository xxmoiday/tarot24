lang_kinh:
  tinh_cam: Đã cưới thì trong ấm ngoài êm, hai bên gia đình thuận; đang yêu thì mối này có tương lai thành nhà; ngược thì ngoài nhìn êm mà trong nhà lạnh.
  cong_viec: Chỗ làm như một gia đình, đồng nghiệp gắn bó lâu năm, việc ổn định ít sóng gió; hợp với nghề gắn với nhà cửa, cộng đồng, quê hương.
  tien_bac: Tiền đủ nuôi cả nhà, lo được cho người thân, của cải chung có nền; không giàu vọt nhưng ấm và bền qua năm tháng.
  tam_ly: Không còn gì phải chạy đi tìm, thấy mình là một mắt xích trong một nhà, một họ, một cộng đồng; cái yên này rộng hơn cái yên của một đôi.
  hoc_hanh: Học có gia đình đứng sau, tiền học và chỗ ở không phải lo; hợp đường học dài, gần nhà, hoặc học để sau này về lo cho nhà.
