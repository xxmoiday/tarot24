id: cup_10
ten_vi: Mười Cốc
ten_en: Ten of Cups
arcana: phu
so: 10
chat: cup
hoang_gia: false
bieu_tuong:
- Một cầu vồng lớn vắt ngang bầu trời, trên vệt cầu vồng xếp mười chiếc cốc vàng thành hàng cong
- Một người đàn ông và một người phụ nữ đứng cạnh nhau quay lưng về phía người xem, cùng giơ tay lên trời về phía cầu vồng, tay kia của người đàn ông ôm ngang lưng vợ
- Người đàn ông mặc áo đỏ, người phụ nữ mặc váy xanh nhạt và trắng
- Bên phải hai vợ chồng, hai đứa trẻ nắm tay nhau nhảy múa, không ngước nhìn cầu vồng
- Phía xa là một ngôi nhà mái đỏ nằm giữa lùm cây trên đồi, có dòng sông uốn quanh
- Đồi cỏ xanh trải rộng, bầu trời xanh trong
cot_loi: Tình cảm đã thành mái nhà, thành gia đình, đầy đủ và bền lâu. Vui ở đây là vui cả nhà, có gốc, giữ được qua năm tháng, không phải một lần vui rồi tan.
tu_khoa_xuoi:
- mái nhà
- gia đình êm ấm
- hạnh phúc bền
- thành đôi thành tổ
- vui chung cả nhà
- tình thân gốc rễ
- cả nhà thuận hoà
- trọn vẹn lâu dài
tu_khoa_nguoc:
- trong nhà lạnh nhạt
- bề ngoài êm ấm
- giận nhau trong nhà
- tổ ấm rạn nứt
- mỗi người một hướng
- sum họp hụt
- hạnh phúc dở dang
- ngại về nhà
canh_bao: 'Tổ ấm trên cầu vồng có thể là vỏ phải giữ: ngoài nhìn êm mà trong nhà lạnh, cãi nhau kín, mỗi người một hướng nhưng ra đường vẫn nắm tay. Chữ bạo động ở chiều ngược chỉ là bực dọc trong nhà, không suy ra bạo lực gia đình cụ thể. Không hứa sẽ cưới hay sẽ có nhà; hai đứa trẻ là nhà đông vui, tránh lái sang có con hay chuyện thai sản. Người độc thân hỏi thì đọc về gia đình gốc, không ép về hôn nhân.'
