lang_kinh:
  tinh_cam: Người có đôi thấy nhạt, không cãi nhau nhưng cũng chẳng buồn nói chuyện; người độc thân được ai đó để ý mà không thèm ngó.
  cong_viec: Ngồi lì ở chỗ làm cũ vì ngán chứ không vì hài lòng, có lời mời đổi việc mà gạt đi chưa xem; ngược thì mở mắt ra nhận cơ hội.
  tien_bac: Lương đều, không thiếu, nhưng tiền vào cũng chẳng thấy vui; một khoản lộc hay đề nghị tăng thu nhập trôi qua vì không để tâm.
  tam_ly: Chán, ngán, khoanh tay với đời; người hỏi tự thấy mình không cần gì thêm nhưng thật ra là hết hứng với mọi thứ.
  hoc_hanh: Ngồi vào bàn mà không vào bài, học vì phải học; thầy giao thêm hay khoá học mới đều thấy phiền, bỏ qua không tiếc.
cach_noi_viet:
