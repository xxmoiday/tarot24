id: cup_04
ten_vi: Bốn Cốc
ten_en: Four of Cups
arcana: phu
so: 4
chat: cup
hoang_gia: false
bieu_tuong:
- Một chàng trai ngồi khoanh chân dưới gốc cây trên sườn đồi, hai tay khoanh trước ngực, đầu cúi, mắt nhìn xuống
- Trước mặt anh trên bãi cỏ đặt ba chiếc cốc vàng dựng thẳng hàng
- Từ một đám mây nhỏ bên trái, một bàn tay chìa ra chiếc cốc thứ tư ngang tầm mắt anh, nhưng anh không ngước nhìn
- Chàng trai mặc áo đỏ, dáng ngồi rụt vào, lưng tựa gốc cây
- Cây phía sau tán lá xanh rậm, thân cây nghiêng che trên đầu
- Xa xa là đồi thấp và một dải nước, bầu trời xanh nhạt
cot_loi: Có sẵn trước mặt mà thấy nhạt, ngồi lì giữa cái đang có và không buồn ngó thứ mới đưa tới. Không mất gì, không thiếu gì, chỉ chán và khép lại nên bỏ lỡ.
tu_khoa_xuoi:
- chán cái đang có
- thờ ơ
- ngồi lì
- bỏ lỡ lời mời
- ngán
- không thấy hứng
- khoanh tay ngó lơ
- chưa nhận ra cơ hội
tu_khoa_nguoc:
- hết chán
- nhận lời mời
- tỉnh ra
- quen người mới
- học điều mới
- ra khỏi vỏ
- chán đến bỏ mặc
- thấy lại hứng
canh_bao: 'Chán lâu thành bỏ mặc: lời mời việc, người để ý, cơ hội tăng thu nhập lần lượt trôi qua vì người hỏi khoanh tay không thèm ngó, còn người bên cạnh nản dần. Lá này là ngán chứ không phải mất, không đọc thành đổ vỡ, cũng không đẩy lên thành trầm cảm hay bệnh tâm lý. Cốc thứ tư chỉ là một lời mời thường, chưa rõ hay dở, nên tránh nâng thành cơ hội lớn đang đến.'
