id: coin_04
ten_vi: Bốn Tiền
ten_en: Four of Pentacles
arcana: phu
so: 4
chat: tien
hoang_gia: false
bieu_tuong:
- Một người đàn ông đội vương miện ngồi trên chiếc ghế đá, hai cánh tay ôm chặt một đồng tiền lớn ép vào ngực
- Trên đỉnh vương miện đặt một đồng tiền nữa, cân bằng ngay giữa đầu
- Hai bàn chân người này mỗi bên đè lên một đồng tiền nằm dưới đất
- Mặc áo đỏ, khoác áo choàng sẫm màu phủ ra sau vai, lưng thẳng, mặt hướng thẳng ra trước
- Người ngồi ở ngoài thành, phía sau là một thành phố với nhiều mái nhà và tháp
- Nền trời xám nhạt, mặt đất xám, gần như không có màu xanh cây cỏ
cot_loi: Giữ chặt cái đang có. Của cải an toàn, chắc chắn, nhưng tay đã bận ôm nên không còn nhận thêm được gì. Ổn định đổi bằng cứng nhắc, sợ mất nhiều hơn muốn được.
tu_khoa_xuoi:
- giữ của
- ôm chặt túi
- để dành
- chắc tay
- không dám tiêu
- khư khư
- giữ ghế
- kín cổng cao tường
tu_khoa_nguoc:
- bủn xỉn
- vung tay quá trán
- nới tay
- tiền treo lơ lửng
- cản đường
- mất ghế
- tiêu hoang
- ôm không nổi
canh_bao: Giữ chặt đến mức tay không còn rảnh để nhận, ghế ngồi lâu thành cùm, người bên cạnh bị ôm như ôm của. Đảo chiều là tiền treo chưa về, hoặc nắm không nổi nữa mà vung tay tiêu cho bõ những ngày nhịn. Tránh đọc ý thừa kế thành người thân sắp mất để lại của, và không lấy chuyện giữ của làm cớ khuyên ôm vàng, ôm đất hay rút tiền khỏi đâu. Người trong hình đang sợ chứ không keo kiệt bẩm sinh, luận từ nỗi sợ.
nguyen_to: tho
chiem_tinh_gd: Mặt Trời ở Ma Kết
