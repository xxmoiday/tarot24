sac_thai:
  trong_luong: vừa
  dong_tinh: tĩnh
  huong: ôm chặt vào
lang_kinh:
  tinh_cam: Ôm khư khư người kia vì sợ mất, ghen, kiểm soát; mối này chắc mà khô, không có chỗ cho cái mới, chuyện cũ cũng chẳng chịu buông.
  cong_viec: Giữ ghế, giữ việc quen, không dám đổi chỗ dù đã chán; an toàn thật nhưng cơ hội mới cũng bị chặn ngoài cửa.
  tien_bac: Để dành được, không tiêu bừa, tiền nằm yên trong tay; chặt quá thành bủn xỉn, ngược thì tiền đang treo, chưa về.
  tam_ly: Sợ mất nhiều hơn muốn được, đóng cửa với người ngoài, tự kiểm soát đến cứng người; ngồi yên thì an mà không vui.
  hoc_hanh: Học theo cách cũ đã thuộc, ôn kỹ những gì đã biết, ngại thử cách mới; thi chắc điểm nhưng khó bứt lên.
cach_noi_viet:
- ăn chắc mặc bền
- đồng tiền đi liền khúc ruột
- tích cốc phòng cơ
- khư khư như ông từ giữ oản
- của đau con xót
- vắt cổ chày ra nước
