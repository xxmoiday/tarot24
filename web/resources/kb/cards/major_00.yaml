ten_vi: Kẻ Khờ
ten_en: The Fool
arcana: chinh
so: 0
chat: null
hoang_gia: false
bieu_tuong:
- Một chàng trai trẻ bước tới mép vực, chân trước đã gần chạm khoảng không, mặt ngẩng lên trời chứ không nhìn xuống
- Tay trái cầm một bông hồng trắng, tay phải vác cây gậy có bọc tay nải nhỏ trên vai
- Áo dài sặc sỡ in hoa văn vòng tròn và lá, mũ có cắm lông chim đỏ, giày vàng
- Một con chó trắng nhỏ nhảy cẫng bên chân, hướng theo người
- Mặt trời trắng toả tia ở góc trên, nền trời vàng rực
- Phía sau và bên dưới là những đỉnh núi phủ tuyết trắng xanh
cot_loi: Bước vào cái chưa biết mà không có kế hoạch, không có kinh nghiệm để dựa, chỉ có lòng tin. Chuyện chưa thành hình, mọi cửa còn mở; cái đáng nói không phải đích đến mà là dám đi khi chưa biết gì.
tu_khoa_xuoi:
- nhảy vào chưa biết
- liều mà nhẹ
- tay trắng lên đường
- chưa có kế hoạch
- tin đời
- mới toanh
- bước đầu tiên
- không sợ ngã
tu_khoa_nguoc:
- liều dại
- nhắm mắt nhảy
- sợ không dám bước
- chần chừ ở mép vực
- cả tin quá đà
- hồ đồ
- trốn trách nhiệm
canh_bao: Nhảy mà không nhìn, bỏ việc bỏ người theo hứng; hoặc ngược lại, đứng mãi ở mép vực và gọi cái sợ là thận trọng. Người luận không nên coi lá này là điềm may hay lời cổ vũ cứ liều là được; nó chỉ nói người hỏi đang ở điểm xuất phát, chưa nói gì về đích. Chữ khờ khi lá xuôi không phải ngu ngốc hay vô trách nhiệm; đó là chưa từng trải, không phải kém cỏi.
