lang_kinh:
  tinh_cam: Mới gặp, chưa biết gì về nhau mà đã muốn thử; mối này còn ở bước đầu, chưa nên đòi cam kết, cứ đi rồi biết.
  cong_viec: Nhận việc mới hoặc bỏ chỗ quen để bắt đầu từ số không, chưa có kinh nghiệm nhưng được cái không sợ; lật lại thì thành bỏ việc bốc đồng.
  tien_bac: Tiền vào ra chưa có nếp, tiêu theo hứng và chưa tính xa; hầu bao nhẹ nhưng nợ chưa có, coi như tờ giấy trắng.
  tam_ly: Trong đầu nhẹ tênh, không mang chuyện cũ, nhìn phía trước bằng lòng tin hơn là bằng tính toán; cái ngây thơ này vừa là sức vừa là điểm hở.
  hoc_hanh: Mới bắt đầu học một thứ hoàn toàn lạ, chưa có nền, học bằng tò mò; chọn ngành hay đăng ký lớp chỉ vì hứng nhất thời thì dễ bỏ ngang.
cach_noi_viet:
- tới đâu hay tới đó
- nhắm mắt đưa chân
- điếc không sợ súng
- tay không bắt giặc
- ngựa non háu đá
