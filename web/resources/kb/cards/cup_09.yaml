id: cup_09
ten_vi: Chín Cốc
ten_en: Nine of Cups
arcana: phu
so: 9
chat: cup
hoang_gia: false
bieu_tuong:
- Một người đàn ông béo tốt ngồi trên ghế gỗ dài, hai tay khoanh trước ngực, miệng cười mãn nguyện, nhìn thẳng ra phía người xem
- Sau lưng ông là một chiếc bàn hình vòng cung phủ khăn xanh, trên bàn xếp chín chiếc cốc vàng thành hàng cong
- Ông đội mũ đỏ, mặc áo trắng dài tay, đi tất đỏ, chân dạng ra thoải mái
- Không có ai khác, không có cửa sổ hay cảnh ngoài trời
- Nền sau là bức tường vàng phẳng, không trang trí
cot_loi: Được như ý và tự thấy đủ, hài lòng với những gì mình có. Thoả mãn ở lá này là của riêng một người, ước gì được nấy, không cần chia với ai và chưa chắc đã bền.
tu_khoa_xuoi:
- ước gì được nấy
- tự thấy đủ
- sung sướng riêng mình
- hưởng thụ thoả thuê
- ăn ngon ngủ yên
- được như ý
- hài lòng
- thắng lợi cá nhân
tu_khoa_nguoc:
- ước không thành
- no mà không vui
- tham hưởng thụ
- tự mãn
- sướng riêng, quên người
- hụt hẫng sau khi có
- hết vui hết bạn
- đủ rồi vẫn muốn thêm
canh_bao: Được như ý rồi tự mãn, khoanh tay hưởng một mình, tiêu cho thoả mà quên để dành, hoặc có rồi mới hụt vì thứ mình ước hoá ra không phải thứ mình cần. Đừng đọc lá này thành lời hứa điều ước nào cũng thành, và với câu hỏi tiền không suy ra giàu lên hay có lời. Khoẻ khoắn thân xác mà Waite nhắc là ăn ngon ngủ yên, không phải hết bệnh. Hài lòng ở đây là của riêng người hỏi, tránh gán cho người kia.
