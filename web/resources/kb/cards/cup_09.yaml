lang_kinh:
  tinh_cam: Có được người mình mong, hay đang có đôi mà tự thấy hài lòng; cái sướng này đang là của riêng mình, người kia có thấy vậy không thì chưa rõ.
  cong_viec: Được như ý ở chỗ làm, tăng lương, lên chức, dự án xong đẹp, tự thưởng cho mình; thành quả này là của riêng người hỏi, chưa chắc kéo được cả đội lên.
  tien_bac: Tiền đủ để hưởng, ăn ngon, sắm sửa, đi chơi, không lo cuối tháng; coi chừng tiêu cho thoả mà quên để dành.
  tam_ly: Tự thấy đủ, ngồi ngắm cái mình có mà mãn nguyện; tâm trạng phơi phới nhưng hơi khép, ít để ý người quanh mình.
  hoc_hanh: Thi được đúng kết quả mong muốn, đỗ vào chỗ mình nhắm; chớ vừa lòng sớm, học tiếp mới giữ được cái vừa có.
cach_noi_viet:
- cầu được ước thấy
- ăn sung mặc sướng
- no cơm ấm cật
- sướng như tiên
- biết đủ
- được voi đòi tiên
