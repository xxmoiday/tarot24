lang_kinh:
  tinh_cam: Yêu ra mặt, không giấu ai, hai bên vui thật; đang tìm hiểu thì rõ ý, đã cưới thì nhà đầy tiếng cười, gia đình hai bên đón nhận.
  cong_viec: Thành công thấy được, được khen công khai, dự án ra kết quả rõ; xin việc lúc này sáng cửa, ngược thì là vui chưa trọn hoặc khoe quá đà.
  tien_bac: Tiền vào rõ ràng, thưởng, lộc công khai, không phải giấu ai; đủ để vui và chia sẻ; ngược thì là tiêu để khoe hơn là để sống.
  tam_ly: Sáng rõ, khoẻ, hồn nhiên, không còn gì phải giấu; tin mình và tin đời như trẻ con, ngược thì là cười gượng cho có.
  hoc_hanh: Kết quả đang rõ, được ghi nhận trước lớp; học với niềm vui thật, ngược thì là chủ quan vì thấy dễ.
