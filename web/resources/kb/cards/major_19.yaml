bieu_tuong:
- Đứa trẻ khoả thân ngồi trên lưng con ngựa trắng, hai tay dang rộng, không cầm cương
- Đầu đội vòng hoa, cắm một chiếc lông chim đỏ dựng lên
- Một lá cờ đỏ dài phất bay trong tay trẻ
- Mặt trời lớn có khuôn mặt chiếm nửa trên lá, tia thẳng xen tia lượn sóng
- Bức tường đá xám thấp chạy ngang, những bông hướng dương vàng nở nhô lên trên tường
- Nền trời vàng cam
cot_loi: Mọi thứ phơi ra rõ và tốt. Vui không phải giấu, thành công thấy được, sức sống và cái thật thà như trẻ con; không còn gì trong bóng tối để lo, cái tốt này đang có thật, không phải hứa hẹn.
tu_khoa_xuoi:
- sáng rõ
- vui ra mặt
- rõ như ban ngày
- khoẻ khoắn
- hồn nhiên
- không còn gì giấu
- có thật rồi
- ấm và đầy sức
tu_khoa_nguoc:
- mây che nắng
- vui chưa trọn
- kiêu ngạo
- cười gượng
- khoe quá đà
- nắng lên muộn
- trẻ con quá
- hết pin
canh_bao: 'Nắng gắt thì chói: kiêu, khoe, chủ quan vì thấy dễ. Ngược là mây che, cười gượng, vui chưa trọn. Vì lá tốt nên dễ trượt sang hứa hẹn: thi chắc đỗ, mối này chắc cưới, việc chắc được; giữ ở mức đang tốt và rõ, không cam đoan kết quả về sau. Tránh gắn với trẻ con, em bé hay sinh nở dù hình có đứa trẻ; đứa trẻ là sự hồn nhiên, không phải con cái.'
