lang_kinh:
  tinh_cam: Một bên nóng nảy hoặc khó chiều, bên kia dỗ bằng mềm mỏng và bền; mối này giữ được nhờ chịu đựng có tình chứ không nhờ ai thắng ai.
  cong_viec: 'Sếp khó, khách dữ, đồng nghiệp gắt: người hỏi xử bằng bình tĩnh và kiên trì, không đối đầu; việc khó dần được thuần, ngược thì là mất bình tĩnh vỡ chuyện.'
  tien_bac: Cầm được ham muốn tiêu, nhịn được cái muốn mua ngay; trả nợ bằng bền bỉ từng tháng; lật ngược là thả tay tiêu cho hả cơn.
  tam_ly: Đang đối diện với cơn giận, nỗi sợ hay thói quen trong mình mà không đè nén cũng không nổ; sức nằm ở chỗ ngồi yên được với nó.
  hoc_hanh: Học môn ghét hoặc khó, không bỏ cuộc, mỗi ngày một ít cho quen; thi cử vượt được nhờ tâm lý vững hơn nhờ ôn nhiều.
cach_noi_viet:
- lạt mềm buộc chặt
- lấy nhu thắng cương
- một điều nhịn, chín điều lành
- nước chảy đá mòn
- cả giận mất khôn
- già néo đứt dây
