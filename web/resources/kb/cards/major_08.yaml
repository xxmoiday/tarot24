id: major_08
ten_vi: Sức Mạnh
ten_en: Strength
arcana: chinh
so: 8
chat: null
hoang_gia: false
bieu_tuong:
- Người phụ nữ mặc áo trắng cúi xuống, hai tay đặt lên hàm con sư tử, khép miệng nó lại
- Trên đầu người phụ nữ lơ lửng ký hiệu vô cực nằm ngang
- Vòng hoa kết trên tóc và một chuỗi hoa dài quấn quanh thân áo
- Con sư tử màu vàng cam đứng thấp, đuôi cụp giữa hai chân, mắt nhìn lên
- Nền trời vàng, một đỉnh núi xanh lam xa phía sau
- Bãi cỏ xanh dưới chân hai bên
cot_loi: Thắng cái hung dữ bằng mềm và bền, không bằng sức. Đứng trước cái không kiểm soát nổi, người này không đè nó, không chạy, mà kiên nhẫn đến khi nó tự dịu; sức mạnh nằm ở lòng tin, không ở nắm đấm.
tu_khoa_xuoi:
- mềm mà bền
- thuần cái hung dữ
- bền gan
- không nắm đấm
- chịu được
- dỗ cho dịu
- tin mà đứng yên
- gan mà lặng
tu_khoa_nguoc:
- mất bình tĩnh
- sư tử nuốt người
- nóng nảy
- đè nén cho nổ
- yếu lòng
- tự ti
- dùng sức thay tình
canh_bao: Ngồi với con sư tử lâu quá mà không dỗ được thì nó nuốt người; hoặc mất bình tĩnh, tay đè cổ nó thay vì đặt lên hàm. Đừng hiểu sức mạnh thành sức khoẻ tốt hay thể lực; lá này không nói gì về thân thể, càng không dùng để trấn an chuyện bệnh tật. Trong tình cảm, tránh biến chịu đựng bền thành lời khuyên ở lại với một người tệ; kiên nhẫn ở đây có tình và có giới hạn.
