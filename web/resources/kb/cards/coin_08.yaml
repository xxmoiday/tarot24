id: coin_08
ten_vi: Tám Tiền
ten_en: Eight of Pentacles
arcana: phu
so: 8
chat: tien
hoang_gia: false
bieu_tuong:
- Một người thợ ngồi trên ghế dài, cúi xuống đục một đồng tiền đặt trước mặt, tay cầm búa và đục
- Bên cạnh là một thân cột gỗ, trên đó treo một hàng đồng tiền đã hoàn thành xếp thẳng đứng từ trên xuống
- Thêm đồng tiền khác dựng ở dưới chân ghế, sát mặt đất
- Người thợ mặc áo xanh dương, quần đỏ, đeo tạp dề sẫm màu, dáng ngồi khom, mặt nhìn xuống việc đang làm
- Phía sau là một con đường vàng dẫn về một thị trấn nhỏ ở xa với nhiều mái nhà
- Nền trời trắng trơn, không mây, không cây cối quanh chỗ ngồi
cot_loi: Rèn nghề bằng lặp lại, từng việc một, cần mẫn, không màng ai xem. Giỏi lên là nhờ làm đi làm lại cho quen tay, không nhờ ý tưởng, cũng không nhờ may.
tu_khoa_xuoi:
- luyện tay nghề
- lặp cho quen tay
- học việc
- cúi đầu làm
- từng cái một
- tỉ mỉ
- việc đều tay
- chăm hơn khéo
tu_khoa_nguoc:
- làm ẩu
- chán việc lặp
- bỏ luyện
- khéo tay dùng sai
- chạy theo mẽ
- làm cho có
- ăn xổi
- tham vặt
canh_bao: Lặp mãi mà không nhìn lên thì thành cái máy, làm cho có, tay khéo dần mà đầu thì chán; đến khi cái khéo ấy quay sang đường tắt, làm mẽ, tính toán vặt thì lá đã lật. Tiến bộ ở đây chậm và đều, không phóng lên thành bậc thầy hay sự nghiệp rực rỡ, cũng không đọc thành sắp có việc mới, lá nói về việc đang làm tay, chưa phải kết quả. Trong tình cảm, người cắm mặt vào việc là đang chăm, không phải lạnh nhạt.
nguyen_to: tho
chiem_tinh_gd: Mặt Trời ở Xử Nữ
chiem_tinh_hd: null
sac_thai:
  trong_luong: nhẹ
  dong_tinh: động vừa
  huong: gõ đều một chỗ
lang_kinh:
  tinh_cam: Mối này cần vun bằng việc nhỏ đều đặn, mỗi ngày một chút; không phải cảm xúc bùng lên mà là công chăm sóc lặp đi lặp lại.
  cong_viec: Đang học việc, làm quen tay ở chỗ mới, làm đi làm lại cho thạo; chưa nổi bật nhưng nghề đang vào tay.
  tien_bac: Tiền đến từng khoản nhỏ theo công làm, đều tay mà không có lộc bất ngờ; muốn ăn xổi là hỏng luôn cái đều.
  tam_ly: Cúi đầu vào việc, không màng ai nhìn, tìm được cái yên từ chính việc lặp lại; chán là vì đang muốn kết quả nhanh.
  hoc_hanh: Ôn thi bằng cách làm đề nhiều lần, học nghề qua tay, kiên trì từng bài; chăm hơn khéo là đúng cách cho lúc này.
cach_noi_viet:
- trăm hay không bằng tay quen
- có công mài sắt có ngày nên kim
- một nghề cho chín còn hơn chín nghề
- ruộng bề bề không bằng nghề trong tay
- kiến tha lâu cũng đầy tổ
- ăn xổi ở thì
