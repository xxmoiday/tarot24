  huong: nhìn về quá khứ
lang_kinh:
  tinh_cam: Người cũ nhắn lại, bạn thuở nhỏ chớm thành tình yêu, hoặc đôi đang có nhớ lại thuở mới quen mà thấy dịu; ngược thì níu người xưa mà quên người nay.
  cong_viec: Được người quen cũ giới thiệu việc, về làm chỗ từng làm, hay nhận việc nhờ tình nghĩa xưa; hợp nghề gắn với trẻ nhỏ, quê nhà, đồ cũ.
  tien_bac: Tiền từ người thân cho, của ông bà để lại hay khoản cũ ai đó trả lại; cho đi không tính và được nhận lại cũng không tính.
  tam_ly: Lòng quay về ngày cũ, thấy mình như hồi bé được che chở; mềm ra, dễ tha thứ, nhưng cũng dễ ngại lớn lên.
  hoc_hanh: Học lại cái nền cũ, ôn từ đầu, hay được thầy cô xưa chỉ dẫn; có duyên với việc dạy trẻ, kèm em nhỏ học.
