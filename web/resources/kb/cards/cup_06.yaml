id: cup_06
ten_vi: Sáu Cốc
ten_en: Six of Cups
arcana: phu
so: 6
chat: cup
hoang_gia: false
bieu_tuong:
- Sáu chiếc cốc vàng, mỗi cốc cắm đầy hoa trắng năm cánh hình sao, bày rải trong sân
- Một cậu bé đội mũ trùm đỏ cúi xuống trao một cốc hoa cho cô bé nhỏ hơn đứng đối diện, cô bé mặc áo trắng có mũ trùm và đeo găng, hai tay đón lấy cốc
- Một cốc hoa đặt trên bệ đá ở góc trái, bệ có khắc hình chữ thập chéo trên tấm khiên
- 'Bối cảnh là sân trong của một dinh thự cũ: tường đá, tháp canh, cầu thang dẫn lên'
- Ở nền phía sau bên trái, một người lính cầm giáo đang bước đi khuất dần
- Bầu trời vàng, cả sân vắng, chỉ có hai đứa trẻ và những cốc hoa
cot_loi: Quay về với ngày cũ, người cũ, cái ngọt của kỷ niệm và của lòng tốt không toan tính. Cái vui rót từ ngày xưa sang bây giờ, dịu, dễ chịu, nhưng cũng dễ níu người ta ở lại phía sau.
tu_khoa_xuoi:
- người cũ
- kỷ niệm
- về quê
- quà tuổi thơ
- lòng tốt vô tư
- gặp lại bạn xưa
- hoài niệm
- cho không tính toán
tu_khoa_nguoc:
- níu quá khứ
- sống bằng ký ức
- trẻ con mãi
- thoát bóng cũ
- hướng về phía trước
- chuyện sắp tới
- người xưa đã khác
- rời tổ
canh_bao: Kỷ niệm ngọt đến mức người hỏi ở lì trong đó, so người mới với người xưa, hoặc để ai đó lấy tình nghĩa cũ ra nhờ vả mà không nỡ từ chối. Người cũ nhắn lại là chuyện thường ở lá này, nhưng không suy ra sẽ nối lại, vì người xưa có thể đã khác. Hai đứa trẻ trên hình là tuổi thơ và lòng tốt vô tư, tránh gắn với con cái, mong con hay chuyện sinh nở. Quà ở đây nhỏ và có tình, không phải thừa kế.
