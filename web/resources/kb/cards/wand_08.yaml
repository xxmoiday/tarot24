sac_thai:
  trong_luong: nhẹ
  dong_tinh: động đột ngột
  huong: lao thẳng tới đích
lang_kinh:
  tinh_cam: Tin nhắn qua lại dồn dập, chuyện tiến rất nhanh, vừa quen đã hẹn, vừa hẹn đã tính đi chơi xa; nếu ngược thì nhắn nhiều mà hiểu lầm, ghen bóng ghen gió.
  cong_viec: Việc dồn tới tấp, deadline chồng nhau, email và cuộc gọi liên tục, có thể phải đi công tác gấp; chuyện chờ lâu bỗng chạy, chỉ còn cách theo kịp.
  tien_bac: Tiền ra vào nhanh, chuyển khoản liên tục, khoản chờ lâu bỗng về gấp rồi cũng đi gấp; thu chi loạn nhịp, cần ghi lại kẻo trôi mất mà không biết đi đâu.
  tam_ly: Đầu chạy nhanh hơn người, nghĩ chưa xong việc này đã sang việc khác, nôn nóng muốn mọi thứ xong ngay; nếu ngược thì loạn nhịp, vội quá mà nói lời không kịp nghĩ.
  hoc_hanh: Lịch thi dồn dập, bài tập chồng lên nhau, kết quả về nhanh hơn dự tính, có thể phải đi thi xa gấp; học nhồi mà vào, miễn đừng vội tới mức đọc sai đề.
cach_noi_viet:
- nhanh như tên bắn
- chân không chạm đất
- chạy như cờ lông công
- đâm lao phải theo lao
- dục tốc bất đạt
- bát đũa còn có khi xô
