sac_thai:
  trong_luong: nặng
  dong_tinh: tĩnh
  huong: đứng giữ
lang_kinh:
  tinh_cam: Từng đổ vỡ nên với người mới cũng thủ thế, hoặc mối hiện tại đã qua vài lần suýt tan, ở lại mà lúc nào cũng đề phòng; giữ được nhưng không dám thả lỏng.
  cong_viec: Đã qua mấy đợt cắt giảm, mấy lần dự án đổ, giờ vẫn trụ ở chỗ làm mà lúc nào cũng đề phòng đợt tiếp; sức làm còn, niềm tin vào chỗ này thì mòn.
  tien_bac: Đã hụt vài lần, giờ nắm chặt từng đồng, có khoản để dành cũng không dám đụng vì sợ đợt hụt tiếp; còn trụ được, chỉ chưa dám tin đã qua cơn.
  tam_ly: Mệt mà không dám nghỉ, thấy ai tới gần cũng nghi, tự nhủ ráng thêm chút nữa lần thứ mười; còn đứng được, cái hết trước là lòng tin rằng sắp được nghỉ.
  hoc_hanh: Đã thi lại hơn một lần, ôn tới cuối chặng, mệt mà vẫn ngồi vào bàn; kiến thức có đủ, cái run là nỗi lo lần này lại hụt.
cach_noi_viet:
- chim sợ cành cong
- trượt vỏ dưa thấy vỏ dừa cũng sợ
- cẩn tắc vô áy náy
- còn nước còn tát
- chớ thấy sóng cả mà ngã tay chèo
- chân cứng đá mềm
