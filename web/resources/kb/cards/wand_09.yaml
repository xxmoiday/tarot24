id: wand_09
ten_vi: Chín Gậy
ten_en: Nine of Wands
arcana: phu
so: 9
chat: gay
hoang_gia: false
bieu_tuong:
- Một người đàn ông đầu quấn băng trắng, hai tay ôm giữ một cây gậy dựng đứng trước người, tựa cả người vào gậy
- Mặt quay sang một bên, mắt nhìn chếch, dáng đứng đề phòng
- Tám cây gậy khác cắm thẳng hàng phía sau lưng người này, dựng như một hàng rào
- Áo chẽn dài màu nâu vàng, quần bó, giày thấp
- Chân đứng trên nền đất xám lát bậc thấp
- Phía sau hàng gậy là dãy núi xanh mờ và nền trời xanh xám nhạt
cot_loi: Qua nhiều trận rồi, đã sứt mẻ mà chưa được buông; đứng giữ tuyến cuối, đề phòng trận tiếp. Sức vẫn còn, chỉ không còn tin là đã hết; đây là cái lì của người đã mệt, không phải sức của người mới.
tu_khoa_xuoi:
- đã sứt mẻ
- giữ tuyến cuối
- đề phòng
- mệt mà chưa buông
- chờ trận tiếp
- còn sức trụ
- chưa tin đã hết
- hoãn thêm lần nữa
tu_khoa_nguoc:
- kiệt hẳn
- gục trước phút cuối
- bỏ tuyến
- thủ thế quá đà
- ai cũng là địch
- cứng đầu không nghỉ
- hạ rào
- sợ bóng sợ gió
canh_bao: 'Thủ thế lâu ngày dễ thành ai cũng là địch: không cho ai lại gần, ráng mãi rồi gục trước phút cuối, hoặc mệt quá mà bỏ tuyến khi chỉ còn một trận. Dải băng trên đầu là vết thương cũ nói bằng hình, tuyệt đối không suy ra bệnh tật, chấn thương hay sức khoẻ yếu. Trong tình cảm, đề phòng không có nghĩa người kia có lỗi hay đang giấu gì; nghi ngờ thuộc về người hỏi. Chữ hoãn không phải thất bại, hoãn chỉ là chưa xong.'
nguyen_to: hoa
chiem_tinh_gd: Mặt Trăng ở Nhân Mã
