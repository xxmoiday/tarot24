lang_kinh:
  tinh_cam: Người đàn ông lớn tuổi hơn, chắc chắn, thích sắp đặt; mối này ổn định nhưng nặng tính kiểm soát, bên nhà nào cũng có tiếng nói của người cha.
  cong_viec: Sếp lớn nắm quyền quyết; người hỏi đang hoặc sắp giữ vị trí đứng đầu, cần đặt luật rõ cho đội, làm riêng thì phải chịu hết trách nhiệm.
  tien_bac: Tiền bạc có kỷ luật, có bảng chi tiêu, có người giữ tay hòm chìa khoá; thu nhập ổn từ vị trí, lá ngược thành siết quá chặt hoặc mất quyền quản tiền.
  tam_ly: Muốn mọi thứ trong tầm tay, ghét bất ngờ, gánh trách nhiệm thay người khác; vai trụ cột đang đè lên vai kể cả khi mệt.
  hoc_hanh: Tự đặt kỷ luật học cho mình, giờ nào việc nấy, không cho ai làm loãng; học chắc từng phần theo thứ tự, ngược lại là ép mình đến khô hoặc bỏ lịch.
