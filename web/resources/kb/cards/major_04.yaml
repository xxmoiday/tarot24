id: major_04
ten_vi: Hoàng Đế
ten_en: The Emperor
arcana: chinh
so: 4
chat: null
hoang_gia: false
bieu_tuong:
- Người đàn ông râu dài bạc trắng, đội vương miện, ngồi thẳng lưng trên ngai đá xám vuông vức
- Bốn góc ngai đều tạc đầu cừu đực có sừng cong
- Tay phải cầm quyền trượng hình chữ thập có vòng tròn ở đầu, tay trái đỡ một quả cầu vàng
- Áo choàng đỏ trùm ngoài, dưới vạt áo lộ ra giáp sắt bó chân
- Phía sau là dãy núi đá trơ trụi màu cam đỏ, không cây
- Một dòng nước nhỏ chảy ngang chân núi
cot_loi: Đặt luật, giữ trật tự và chịu trách nhiệm cho cái mình cai quản. Ổn định do một người đứng đầu dựng lên bằng kỷ luật và quyền hành; thứ tự, ranh giới, kiểm soát, cha hơn là mẹ.
tu_khoa_xuoi:
- cầm quyền
- đặt luật
- người cha
- ranh giới rõ
- ra lệnh
- đứng đầu
- trật tự chắc tay
- gánh trách nhiệm
tu_khoa_nguoc:
- độc đoán
- cứng như đá
- mất quyền
- không ai nghe lệnh
- cha vắng mặt
- bỏ vị trí
- lạm quyền
- nhu nhược
canh_bao: Ghế còn đó mà không ai nghe lệnh, hoặc ngược lại, cầm quyền chặt tay đến mức người dưới chỉ còn cách im hoặc bỏ đi. Trong tình cảm, đừng vội quy lá này thành người đàn ông kiểm soát nên tránh; Hoàng Đế xuôi là chỗ dựa chắc, chỉ nặng tay khi có thêm lá xấu. Ở công việc, tránh hứa thăng chức hay lên làm sếp; lá chỉ nói về trách nhiệm và quyền, không phải chức danh sắp tới.
