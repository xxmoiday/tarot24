id: cup_07
ten_vi: Bảy Cốc
ten_en: Seven of Cups
arcana: phu
so: 7
chat: cup
hoang_gia: false
bieu_tuong:
- 'Bảy chiếc cốc bồng bềnh trên một tầng mây, mỗi cốc chứa một thứ khác nhau: một khuôn mặt người tóc xoăn, một bóng người trùm khăn phát sáng, một con rắn, một toà lâu đài trên núi đá, một đống châu báu, một vòng nguyệt quế, một con rồng'
- Trên cốc đựng vòng nguyệt quế có in hình đầu lâu nhỏ
- Bóng người đen kịt đứng quay lưng về phía người xem ở tiền cảnh, một tay giơ lên như đang chọn
- Bóng người trong cốc ở giữa được phủ khăn trắng kín đầu, quanh mình toả ánh sáng đỏ
- Toàn bộ nền là mây xám và bóng tối, không có mặt đất, không có chân trời
cot_loi: Nhiều ngả bày ra cùng lúc, cái nào cũng lấp lánh, nhưng toàn là mơ tưởng, chưa cái nào có thật. Mê mải nhìn mà không chọn nổi, vì cái muốn và cái làm được chưa tách khỏi nhau.
tu_khoa_xuoi:
- nhiều ngả lấp lánh
- mơ mộng
- hoa mắt vì lựa chọn
- chưa cái nào thật
- ảo tưởng
- thấy gì cũng muốn
- mộng hơn thực
- cám dỗ bày ra
tu_khoa_nguoc:
- chọn được một
- tỉnh mộng
- chân chạm đất
- thấy rõ thật giả
- bắt tay vào việc
- quyết một ngả
- lún sâu ảo ảnh
- mộng tan
canh_bao: 'Nhìn mãi mà không chọn, hoặc chọn nhầm cái lấp lánh nhất rồi mới biết là mây, người hỏi dễ bị lời hứa lãi to, việc nhẹ, tình đẹp dụ đi. Với câu hỏi tiền bạc lá này sát vùng cấm: không khuyên mua hay bán, giữ hay xuống tiền vào bất cứ thứ gì, chỉ nói cái đang nhắm chưa sờ được. Cũng không đọc thành nhiều cơ hội tốt đang đến, vì chưa cái nào thật; rắn và rồng trong cốc là cám dỗ, không phải kẻ thù.'
nguyen_to: thuy
chiem_tinh_gd: Sao Kim ở Bọ Cạp
chiem_tinh_hd: null
sac_thai:
  trong_luong: vừa
  dong_tinh: tĩnh
  huong: ngước lên mây
lang_kinh:
  tinh_cam: Đang tìm hiểu mà thích cùng lúc mấy người, hoặc yêu cái hình ảnh mình vẽ ra hơn là người thật; chuyện chưa đi đến đâu vì chưa chọn nổi ai.
  cong_viec: Nhiều hướng bày ra, đổi việc, làm riêng, đi học, cái nào nghe cũng hay; kế hoạch còn trên giấy, chưa cái nào có bước đầu tiên.
  tien_bac: Cách kiếm tiền đang nhắm toàn ở dạng nghe hấp dẫn, lời hứa lãi to, việc nhẹ; cẩn thận với thứ trông lấp lánh mà chưa sờ được.
  tam_ly: Đầu đầy mộng tưởng, chạy từ viễn cảnh này sang viễn cảnh khác; mê mải chọn mà không quyết nên chưa động tay vào cái nào.
  hoc_hanh: Muốn học cái này rồi lại ham cái kia, đăng ký khoá nào cũng bỏ dở; ngành chọn theo mộng hơn theo sức.
cach_noi_viet:
- mơ giữa ban ngày
- đếm cua trong lỗ
- no bụng đói con mắt
- nhìn gà hoá cuốc
- bánh vẽ
- mật ngọt chết ruồi
