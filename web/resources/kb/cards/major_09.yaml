lang_kinh:
  tinh_cam: Một bên đang cần ở một mình, rút khỏi hẹn hò để ngẫm; độc thân lúc này là chủ ý; đã cưới thì là khoảng lặng cần thiết, không phải nguội.
  cong_viec: Làm việc một mình, nghiên cứu, tư vấn, cố vấn; tạm đứng ngoài cuộc đua thăng tiến để nhìn lại mình muốn nghề gì; có thầy già chỉ đường.
  tien_bac: Tiêu ít, sống giản, không cần khoe; giai đoạn tính lại cách dùng tiền hơn là kiếm thêm; nhưng keo với cả chính mình chỉ vì sợ thì lại quá đà.
  tam_ly: Muốn tránh đám đông để nghe mình rõ hơn, ngẫm lại chặng vừa qua; cái sáng đến chậm, nhưng là của chính mình chứ không mượn ai.
  hoc_hanh: Tự học, nghiên cứu sâu, làm luận văn hay đề tài riêng; hợp học một mình trong yên tĩnh, tìm thầy giỏi để hỏi đúng chỗ khó.
cach_noi_viet:
- gừng càng già càng cay
- đi hỏi già, về nhà hỏi trẻ
- một mình một bóng
- nghĩ cho chín
- về ở ẩn
- thu mình vào vỏ ốc
