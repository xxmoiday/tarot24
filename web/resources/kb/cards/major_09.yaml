id: major_09
ten_vi: Ẩn Sĩ
ten_en: The Hermit
arcana: chinh
so: 9
chat: null
hoang_gia: false
bieu_tuong:
- Ông lão râu bạc dài, mặc áo choàng xám trùm đầu, đứng một mình trên đỉnh núi tuyết
- Tay phải giơ cao chiếc đèn lồng, bên trong sáng lên một ngôi sao sáu cánh
- Tay trái chống cây gậy dài màu vàng
- Đầu cúi xuống, mắt nhìn về phía dưới chứ không nhìn ra xa
- Nền trời xám xanh thẫm, không có mặt trời hay trăng
- Phía dưới là những đỉnh núi trắng chìm trong nền tối
cot_loi: Rút lui khỏi đám đông để tự tìm câu trả lời. Một mình, đi chậm, soi kỹ; cái sáng đến từ bên trong sau khi đã trải qua, và người đã tìm thấy thì âm thầm soi đường cho kẻ đi sau.
tu_khoa_xuoi:
- một mình
- rút về
- soi kỹ
- đi chậm
- ngẫm lại
- tự tìm lời giải
- cần yên tĩnh
- âm thầm soi đường
tu_khoa_nguoc:
- cô lập
- trốn đời
- khép mình
- cứng đầu không nghe ai
- sợ ở một mình
- chưa chịu ngẫm
- đèn tắt giữa đường
- ẩn để né việc
canh_bao: Rút lui quá hoá cô lập, khép mình, cứng đầu không nghe ai. Có khi ẩn chỉ để né việc mà gọi là tu. Khi hỏi tình cảm, không nên kết luận sẽ độc thân lâu hay người kia không muốn yêu; lá chỉ một khoảng cần yên, có chủ ý và có hạn. Tránh đọc thành trầm cảm hay bệnh tâm lý dù có lá xấu đi kèm; đó là chẩn đoán, không phải luận bài.
