id: major_07
ten_vi: Cỗ Xe
ten_en: The Chariot
arcana: chinh
so: 7
chat: null
hoang_gia: false
bieu_tuong:
- Người đàn ông mặc giáp đứng thẳng trong cỗ xe đá, đội vương miện có ngôi sao lớn trên đỉnh
- Hai con nhân sư nằm phía trước xe, một đen một trắng, không có dây cương
- Tay phải cầm cây quyền trượng, hai vai giáp có hai mặt trăng đắp nổi
- Mái che của xe là tấm vải xanh điểm sao trắng, chống bằng bốn cột
- Mặt trước xe có biểu tượng đĩa tròn có cánh và một tấm khiên nhỏ
- Sau lưng là thành phố có tường thành, một dòng sông và hàng cây
- Nền trời vàng nhạt
cot_loi: Nắm lấy tay lái và đi tới bằng ý chí. Hai lực kéo ngược chiều nhưng cùng bị ghìm về một hướng; thắng ở đây là thắng do tự chủ và quyết tâm, chuyển động và chinh phục, chứ chưa phải hoà giải.
tu_khoa_xuoi:
- cầm lái
- thắng nhờ ý chí
- tự chủ
- ghìm hai lực
- đi xa
- vượt ải
- quyết tới cùng
- chuyến đi có đích
tu_khoa_nguoc:
- mất lái
- hai ngựa rẽ hai bên
- húc bừa
- kẹt giữa đường
- chuyến đi hoãn
- chạy quá đà
- bỏ dở nửa chừng
- thắng bằng ép
canh_bao: Mất lái thì hai con thú kéo hai ngả, hoặc húc bừa, thắng bằng cách ép người khác theo mình. Người luận không nên hứa sẽ thắng hay sẽ được; thắng của Cỗ Xe là ý chí đang căng, chưa phải kết quả đã về tay. Chớ tự động gắn với mua xe, tai nạn giao thông hay một chuyến đi cụ thể nếu người hỏi không hỏi về đi lại, và trong tình cảm tránh cổ vũ theo đuổi bằng mọi giá.
