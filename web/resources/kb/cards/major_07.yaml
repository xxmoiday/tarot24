  huong: về phía trước
lang_kinh:
  tinh_cam: Một bên quyết theo đuổi bằng được, yêu xa hay có trở ngại vẫn đi tới; mối này tiến nhờ ý chí, nhưng ép quá thì thành kéo người ta đi.
  cong_viec: Dự án đang chạy, người hỏi cầm lái và ghìm được các bên kéo ngược; đi công tác, chuyển chỗ làm, thăng tiến nhờ quyết liệt.
  tien_bac: Kiếm tiền bằng cách lao tới, đặt mục tiêu con số rồi đuổi theo; tiền dính tới xe cộ, đi lại; ngược lại là chạy quá đà vượt khả năng.
  tam_ly: Đầu đầy quyết tâm, dồn hết vào một hướng, kìm được nỗi sợ lẫn cái nóng; tự chủ đấy nhưng dây đang căng.
  hoc_hanh: Cày thi bằng ý chí, đặt lịch và bám lịch, không để phân tâm; đỗ nhờ bền sức hơn nhờ thông minh, ngược thì là học lan man mất lái.
cach_noi_viet:
- có chí thì nên
- chân cứng đá mềm
- vững tay lái
- làm tới nơi tới chốn
- thừa thắng xông lên
- trống đánh xuôi, kèn thổi ngược
