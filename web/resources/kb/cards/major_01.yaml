lang_kinh:
  tinh_cam: Người này biết cách tỏ ý, chủ động bắt chuyện, hẹn hò; mối này tiến nhờ một bên ra tay khéo, còn khi ngược, lời ngọt chỉ để lấy lòng chứ chưa thật.
  cong_viec: Đủ tay nghề để nhận việc khó, trình bày dự án là người ta gật; xin việc lúc này mạnh ở vòng phỏng vấn, làm riêng thì có đủ vốn nghề.
  tien_bac: Tiền kiếm bằng tay nghề và sự khéo, mở thêm nguồn thu từ cái mình biết làm; ngược thì coi chừng khoản thu nghe hay mà rỗng.
  tam_ly: Tự tin, đầu óc tập trung, thấy rõ mình có gì và muốn gì; trạng thái làm được, chỉ còn thiếu cái bắt tay vào.
  hoc_hanh: Học đến đâu dùng được đến đó, thi cử mạnh ở phần thực hành và trình bày; học nghề hợp hơn học lý thuyết suông.
cach_noi_viet:
- có bột mới gột nên hồ
- khéo tay hay làm
- nói được làm được
- nhất nghệ tinh, nhất thân vinh
- mồm miệng đỡ chân tay
