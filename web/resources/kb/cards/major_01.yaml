ten_vi: Pháp Sư
ten_en: The Magician
arcana: chinh
so: 1
chat: null
hoang_gia: false
bieu_tuong:
- Người đàn ông trẻ đứng sau bàn, tay phải giơ cây đũa trắng hai đầu lên trời, tay trái chỉ ngón xuống đất
- Trên đầu lơ lửng ký hiệu vô cực nằm ngang như số 8
- Áo trong trắng, áo choàng ngoài đỏ, thắt lưng là con rắn tự cắn đuôi mình
- 'Trên bàn gỗ bày đủ bốn vật: cốc, kiếm, gậy và đồng tiền khắc ngôi sao năm cánh'
- Hoa hồng đỏ rủ từ trên cao và leo quanh bàn, huệ trắng mọc dưới chân bàn
- Nền sau lưng màu vàng đồng, không có phong cảnh
cot_loi: Có đủ đồ nghề trong tay và biết dùng chúng. Ý muốn thành việc thật nhờ chủ ý, khéo léo và tự tin; không chờ may, không chờ ai, người này tự làm ra cái mình định.
tu_khoa_xuoi:
- đủ đồ nghề
- tự tay làm
- khéo tay
- biết cách
- nói là làm
- chủ động ra tay
- nghĩ được là làm được
- tự tin trình bày
tu_khoa_nguoc:
- khéo miệng rỗng tay
- mánh khoé
- nói mà không làm
- tài để đó
- lừa gạt
- chưa dám ra tay
- dùng tài sai chỗ
canh_bao: Tài mà không ra tay thì rỗng; khéo miệng quá thì thành mánh, và người này có thể đang trình bày hay hơn làm. Khi luận, không nên suy ra người hỏi sẽ đạt được mọi thứ mình muốn hay có phép mầu; lá nói về đủ phương tiện, còn việc thì chưa làm. Ngược cũng không tự động là kẻ lừa đảo; xét ngữ cảnh và các lá bên cạnh trước khi gọi ai là gian.
