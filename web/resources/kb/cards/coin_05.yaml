id: coin_05
ten_vi: Năm Tiền
ten_en: Five of Pentacles
arcana: phu
so: 5
chat: tien
hoang_gia: false
bieu_tuong:
- Hai người ăn xin đi trong bão tuyết ngang qua một ô cửa sổ kính màu đang sáng đèn
- Ô cửa sổ hình vòm nhà thờ, trên kính màu có năm đồng tiền xếp theo hình một thân cây có nhánh
- Người đi trước là một phụ nữ trùm khăn rách, đi chân trần trên tuyết, dáng người còng xuống
- Người đi sau là một người đàn ông chống hai nạng, đầu quấn băng, cổ đeo một cái chuông nhỏ
- Hai người đều nhìn xuống đất, không ai ngoảnh lên ô cửa sáng ngay phía trên
- Tuyết đang rơi thành những đốm trắng trên nền trời đêm đen, mặt đất phủ tuyết trắng
cot_loi: Thiếu thốn, mất chỗ dựa, thấy mình bị bỏ ngoài. Cái khó không chỉ là túng, mà là đang đi ngang chỗ có thể giúp mình mà mải nhìn cái thiếu nên không thấy.
tu_khoa_xuoi:
- túng thiếu
- không còn chỗ dựa
- đứng ngoài cuộc
- hết tiền
- co ro ngoài cửa
- mất việc
- không thấy cửa mở
- cùng cảnh nương nhau
tu_khoa_nguoc:
- qua cơn túng
- thấy cửa sáng
- được cưu mang
- có việc trở lại
- gượng dậy
- chịu ngửa tay xin
- ấm lại
- tiêu bừa lúc túng
canh_bao: 'Túng đến đâu cũng chưa nguy bằng thói cúi mặt: tự đóng vai kẻ bị bỏ rơi, đi qua cửa mở mà không gõ, rồi trách đời không ai cứu. Lá ngược chưa chắc là ấm lại, có khi là lúc túng lại tiêu bừa. Người chống nạng quấn băng trên hình chỉ là hình ảnh của cảnh khốn khó, không đọc thành bệnh tật, tàn phế hay sức khoẻ sa sút, cũng không tiên đoán phá sản, mất trắng; cái khó này có cửa ra, luận phải chỉ được cửa.'
nguyen_to: tho
chiem_tinh_gd: Sao Thuỷ ở Kim Ngưu
chiem_tinh_hd: null
sac_thai:
  trong_luong: rất nặng
  dong_tinh: động vừa
  huong: lê ngang cửa
lang_kinh:
  tinh_cam: Hai người cùng cảnh khó dựa vào nhau lúc túng; hay người hỏi thấy mình bị bỏ rơi, chia tay xong không còn ai bên cạnh.
  cong_viec: Mất việc, hay đang làm mà bị gạt ra rìa, sếp không để ý; có chỗ sẵn lòng nhận mình nhưng chưa nhìn tới vì mải lo cái đã mất.
  tien_bac: Túng thật, hết tiền, hụt nguồn thu; chỗ có thể giúp ngay trước mặt, người thân hay chỗ làm cũ, mà chưa chịu gõ cửa.
  tam_ly: Đứng ngoài, thiếu chỗ dựa, mắt chỉ dán vào cái mình không có; càng cúi càng không thấy đèn đang sáng ngay trên đầu.
  hoc_hanh: Thiếu tiền học, thiếu người chỉ, rớt một kỳ; có chỗ hỗ trợ, có người cùng cảnh mà ngại hỏi nên đi qua không thấy.
cach_noi_viet:
- chạy ăn từng bữa
- màn trời chiếu đất
- cái khó bó cái khôn
- lá rách ít đùm lá rách nhiều
- đói ăn vụng, túng làm liều
- Bụt chùa nhà không thiêng
