id: wand_04
ten_vi: Bốn Gậy
ten_en: Four of Wands
arcana: phu
so: 4
chat: gay
hoang_gia: false
bieu_tuong:
- Bốn cây gậy cao cắm thẳng ở tiền cảnh, giữa các đầu gậy treo một vòng hoa lớn kết bằng hoa và quả
- Sau vòng hoa, hai người phụ nữ mặc váy dài giơ cao bó hoa lên đầu như đang chào đón
- Phía sau là một toà nhà lớn kiểu lâu đài cổ với tường cao, cầu bắc qua hào nước dẫn vào cổng
- Vài người nhỏ đứng gần chân lâu đài, cạnh đó có cây xanh
- Nền trời vàng rực chiếm phần lớn lá
- Mặt đất phía trước màu xám nhạt, thoáng, không có vật cản
cot_loi: Chặng đầu đã dựng xong nền, đủ để dừng lại mừng cùng nhà cửa, người thân. Niềm vui ở đây là có chỗ để về và cái đã xây đứng vững, chứ chưa phải đích cuối.
tu_khoa_xuoi:
- mừng tân gia
- tiệc mừng
- nền đã dựng xong
- có chỗ để về
- sum họp
- nghỉ tay ăn mừng
- yên ổn trong nhà
- đám vui gia đình
tu_khoa_nguoc:
- tiệc hoãn
- trong nhà lục đục
- mừng sớm
- chuyển chỗ ở
- vui ngoài mặt
- lạc lõng giữa nhà
- nền chưa vững
canh_bao: 'Vui ở đây có thể là mừng hụt: tiệc dựng lên khi nền chưa vững, cưới cho kịp ngày đẹp, khai trương khi hàng chưa về; hoặc ăn mừng cho có, giữa đám đông mà lạc lõng. Tránh đọc hai người phụ nữ và vòng hoa thành lời hứa đám cưới: tình cảm chưa tới đâu thì đây là mối được người thân chấp nhận, chưa phải kết hôn. Sum họp không kéo sang chuyện thêm người, thêm con; giữ ở mức nhà cửa yên ổn.'
nguyen_to: hoa
chiem_tinh_gd: Sao Kim ở Bạch Dương
chiem_tinh_hd: null
sac_thai:
  trong_luong: rất nhẹ
  dong_tinh: động vừa
  huong: về nhà tụ lại
lang_kinh:
  tinh_cam: Chuyện hai người đã tới lúc đưa về ra mắt hai bên, ăn hỏi, dọn về một nhà; gia đình chịu nhận và cùng mừng, nhưng đây mới là cửa vào, chưa phải đích.
  cong_viec: Dự án qua được mốc đầu, đội nhóm ăn mừng, công ty ổn định đủ để yên tâm gắn bó; là lúc nghỉ tay ghi nhận nhau, chưa phải lúc coi là xong việc.
  tien_bac: Đủ tiền lo bữa giỗ, đám cưới, sửa nhà, tiệc tân gia, tiền chi cho gia đình mà vui; nền tài chính đã đứng được, có thể yên tâm chi cho việc chung.
  tam_ly: Trong lòng thấy yên, thấy có chỗ để về, muốn gặp người thân, muốn ăn mừng cái vừa dựng xong; cái yên này có gốc, không phải vui thoáng qua.
  hoc_hanh: Qua được kỳ thi chuyển cấp, bảo vệ xong đề cương, cả nhà làm bữa mừng; một mốc đáng dừng lại thở, dù đường học phía trước còn dài.
