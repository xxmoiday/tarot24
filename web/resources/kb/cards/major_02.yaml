id: major_02
ten_vi: Nữ Tư Tế
ten_en: The High Priestess
arcana: chinh
so: 2
chat: null
hoang_gia: false
bieu_tuong:
- Người phụ nữ ngồi giữa hai cột, cột đen bên trái khắc chữ B, cột trắng bên phải khắc chữ J
- Đội mũ miện có hai sừng ôm lấy một quả cầu tròn ở giữa, một cây thánh giá bốn cánh đều nằm trên ngực
- Trên đùi đặt một cuộn giấy ghi chữ TORA, một phần bị vạt áo che khuất
- Áo choàng xanh lam chảy dài xuống dưới chân, nếp áo loang như nước
- Dưới chân là một vầng trăng lưỡi liềm
- Tấm màn sau lưng thêu cây cọ và quả lựu, qua kẽ màn lộ ra mặt nước xa
cot_loi: Biết mà chưa nói. Sự thật có đó nhưng còn giấu, chỉ nghe được khi im lặng và chờ; đây là trực giác, là bí mật đang giữ kín, không phải mơ hồ, càng không phải chuyện chưa có.
tu_khoa_xuoi:
- giữ kín
- biết trong bụng
- nghe linh tính
- chuyện sau tấm màn
- im mà biết
- chưa tới lúc nói
- bí mật còn giữ
tu_khoa_nguoc:
- bỏ ngoài tai linh tính
- kín quá hoá ngột
- lời đồn dẫn dắt
- chuyện ngầm lộ ra
- chỉ biết bề nổi
- giấu cả với mình
- cần nói mà cứ im
canh_bao: 'Kín quá thì ngột: cần nói mà cứ im, hoặc tin lời đồn hơn tin cái mình biết trong bụng. Chỗ hay bị đọc lố là suy ngay thành có kẻ thứ ba giấu mặt hoặc đối phương lừa dối; giấu chưa phải dối, và bí mật có thể là của chính người hỏi. Không nên hứa sự thật sắp lộ kèm mốc thời gian, và Nữ Tư Tế không phải một người phụ nữ lạnh lùng, khó gần ngoài đời.'
nguyen_to: thuy
chiem_tinh_gd: Mặt Trăng
chiem_tinh_hd: null
sac_thai:
  trong_luong: vừa
  dong_tinh: tĩnh
  huong: ngồi giữ cửa
lang_kinh:
  tinh_cam: Đối phương có điều chưa nói, hoặc chính người hỏi đang giữ một bí mật; mối này chưa ngã ngũ, nghe linh tính hơn nghe lời hứa.
  cong_viec: Chỗ làm đang có chuyện ngầm chưa công bố, sếp biết mà chưa nói; lúc này quan sát và giữ miệng, chưa phải lúc bày tỏ ý kiến.
  tien_bac: Có khoản tiền hoặc thông tin về tiền chưa được nói rõ, bên kia giấu số; chưa nắm chắc thì chưa ký gì cả.
  tam_ly: Bên trong biết rồi nhưng chưa dám gọi tên; người hỏi đang nghe hai tiếng nói cùng lúc, lời người ngoài và linh tính của mình.
  hoc_hanh: Học bằng đọc và ngẫm, hợp với môn cần hiểu sâu hơn học vẹt; luận văn hoặc bài thi cần thời gian lặng để ý tứ tự ngấm.
cach_noi_viet:
- im lặng là vàng
- kín như bưng
- nói ra thì mất thiêng
- linh tính mách bảo
- biết thì thưa thốt, không biết thì dựa cột mà nghe
