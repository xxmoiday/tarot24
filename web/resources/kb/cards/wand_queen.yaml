id: wand_queen
ten_vi: Hoàng Hậu Gậy
ten_en: Queen of Wands
arcana: phu
so: null
chat: gay
hoang_gia: true
bieu_tuong:
- Nữ hoàng đội vương miện ngồi thẳng trên ngai, nhìn thẳng ra ngoài, tay phải cầm gậy mọc lá dựng đứng, tay trái cầm một bông hướng dương lớn
- Con mèo đen ngồi dưới chân ngai, quay mặt ra phía người xem
- Áo dài màu vàng, khoác áo choàng màu nhạt, hai đầu gối mở rộng, ngồi vững
- Tay vịn ngai tạc hình sư tử, lưng ngai chạm hình sư tử và hoa hướng dương
- Phía sau ngai là đồng đất khô và mấy kim tự tháp nhỏ
- Trời vàng
cot_loi: 'Sức nóng giữ trong người rồi toả ra: tự tin, ấm, hút người về phía mình mà không cần ra lệnh. Lo được cả nhà lẫn việc, sống thẳng, có gì nói nấy, thích được để ý.'
tu_khoa_xuoi:
- tự tin toả ra
- ấm mà thẳng tính
- được người mến
- lo nhà lo việc
- buôn bán mát tay
- nói thẳng không gắt
- thích nổi bật
- quen biết rộng
tu_khoa_nguoc:
- ghen bóng ghen gió
- gắt gỏng, hơn thua
- tự ti giấu đi
- sân si chuyện người
- hai lòng
- chèn ép người dưới
- làm màu quá tay
- kín tiếng, chịu khó
canh_bao: Tự tin dư ra thành cần được để ý, ai không khen là gắt, chèn người dưới để mình nổi hơn; ghen từ chuyện không có. Ghen tuông, hai lòng chỉ được đọc khi các lá bên cạnh cùng hướng đó, nên không tự suy ra ngoại tình từ một mình lá này. Không lái sức sống, sinh động sang thai sản; và người phụ nữ trong lá có thể là chính người hỏi, không nhất thiết là ai đó khác.
nguyen_to: hoa
chiem_tinh_gd: Thuỷ của Hoả — Hoàng Hậu (Queen); 20° Song Ngư – 20° Bạch Dương
chiem_tinh_hd: null
sac_thai:
  trong_luong: nhẹ
  dong_tinh: tĩnh
  huong: toả ấm ra
lang_kinh:
  tinh_cam: Một người tự tin, ấm, nói thẳng đang hút người hỏi về phía mình; nếu đã cưới, đây là người giữ lửa cả nhà; ngược thì ghen bóng ghen gió.
  cong_viec: Cầm việc gọn, đồng nghiệp mến, sếp tin giao thêm; làm riêng thì buôn bán mát tay nhờ quen biết rộng; ngược thì hơn thua, chèn ép người dưới.
  tien_bac: Buôn bán mát tay, thích tiền và biết kiếm, chi rộng cho nhà cửa, bạn bè và cho vẻ ngoài của mình; kiếm được thì tiêu không tiếc.
  tam_ly: Thấy mình đáng được để ý, nói thẳng điều mình muốn, không ngại ánh nhìn; hôm nào tự tin lung lay thì quay ra so bì với người khác.
  hoc_hanh: Học tốt nhờ tự tin, dám phát biểu, kéo cả nhóm học cùng; hợp ngành cần giao tiếp, đứng trước đám đông, thuyết trình.
cach_noi_viet:
- ăn ngay nói thẳng
- có gì nói nấy
- giỏi việc nước, đảm việc nhà
- buôn may bán đắt
- ghen bóng ghen gió
- sư tử Hà Đông
ba_cach_doc:
  la_nguoi: Tự tin, ấm, nói thẳng mà không làm ai mất lòng; đi đâu cũng có người mến, quen biết rộng, buôn bán mát tay. Chị chủ tiệm, cô đồng nghiệp kéo cả phòng đi ăn, bà mẹ lo trong ngoài mà vẫn đẹp. Đàn ông có sức hút kiểu này cũng ra lá này.
  la_nang_luong: Cứ tin mình xứng đáng, nói rõ mình muốn gì, đừng tự thu mình lại cho vừa lòng ai. Lửa giữ trong người rồi toả ra, không cần ra lệnh mà người ta vẫn theo. Lo nhiều đầu việc cùng lúc mà vẫn còn sức cười, còn để ý được người quanh mình.
  la_tinh_huong: Đang là lúc người hỏi được để ý, được mến, được sếp tin giao thêm; chỗ buôn bán đông khách quen, trong việc có người vừa lo được nhà vừa kéo được người theo mình. Hoàn cảnh ấm và sôi nổi, đông người, không phải kiểu yên ắng. Ngược thì có ghen tuông, so bì len vào.
