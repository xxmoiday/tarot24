id: cup_queen
ten_vi: Hoàng Hậu Cốc
ten_en: Queen of Cups
arcana: phu
so: null
chat: cup
hoang_gia: true
bieu_tuong:
- Nữ hoàng ngồi trên ngai sát mép nước, hai tay nâng chiếc cốc có nắp đậy kín, mắt chăm chú nhìn vào cốc
- Chiếc cốc có hai quai tạc hình thiên thần, trên đỉnh nắp có một cây thánh giá nhỏ
- Ngai đá tạc vỏ sò lớn phía sau đầu và những đứa trẻ có đuôi cá ở hai bên
- Áo trắng xanh nhạt, đội vương miện vàng, áo choàng vằn sóng chảy dài xuống hoà vào mặt nước dưới chân
- Dưới chân là sỏi nhiều màu, nước lan tới sát ngai
- Phía xa là vách đá và mặt biển xanh, trời trong
cot_loi: Hiểu người khác bằng cảm nhận trước khi họ nói ra, và giữ cái cảm nhận đó kín, không phô. Thương mà không bỏ việc; cái nhìn nuôi cái làm, chứ không thay cái làm.
tu_khoa_xuoi:
- hiểu chưa cần nói
- giữ kín cảm nhận
- thương không bỏ việc
- vợ hiền mẹ tốt
- tận tuỵ giúp người
- linh cảm sâu
- nhìn thấu lòng người
- dịu mà chắc
tu_khoa_nguoc:
- chìm trong cảm xúc
- khóc thầm
- lo người quên mình
- dựa dẫm
- lấy nước mắt ép
- ngoài dịu trong khác
- chai lì
- mít ướt
canh_bao: Thương đến mức tan vào người khác, lo cho họ mà quên mình, hoặc lấy nước mắt làm cách ép; ngược nữa thì ngoài dịu trong tính toán. Waite gọi bà là người vợ hoàn hảo, người mẹ tốt, nhưng không từ đó nói người hỏi sắp có con hay hợp làm mẹ; giữ chữ mẹ ở nghĩa chăm người, hiểu người. Không mặc định lá là phụ nữ; đàn ông giàu cảm nhận, kín tiếng vẫn là lá này.
nguyen_to: thuy
chiem_tinh_gd: Thuỷ của Thuỷ — Hoàng Hậu (Queen); 20° Song Tử – 20° Cự Giải
chiem_tinh_hd: null
sac_thai:
  trong_luong: nhẹ
  dong_tinh: tĩnh
  huong: nhìn sâu vào cốc
lang_kinh:
  tinh_cam: Người trong mối này thương sâu và hiểu người hỏi trước khi cần nói; vợ hiền, mẹ tốt; ngược thì chìm trong cảm xúc, lấy nước mắt ép người kia.
  cong_viec: 'Chỗ làm cần người hiểu người: tư vấn, chăm sóc, nhân sự; đang bận lòng vẫn giữ được việc, đồng nghiệp hay tìm đến tâm sự.'
  tien_bac: Tiền dành cho người thân trước, ít giữ cho mình; biết ai đang khó mà giúp kín, không kể ra; hay mềm lòng nên dễ cho quá tay.
  tam_ly: Cảm được không khí trong phòng, biết người khác đang nghĩ gì trước khi họ nói, giữ hết trong lòng; dễ mang luôn nỗi buồn của người khác về mình.
  hoc_hanh: Học tốt các môn cần hiểu người, biết thương người; ngồi học mà lòng để nơi khác vẫn giữ được nhịp; giỏi kèm bạn hơn giỏi thi.
cach_noi_viet:
- đi guốc trong bụng
- lạt mềm buộc chặt
- của cho không bằng cách cho
- ngậm bồ hòn làm ngọt
- thương vay khóc mướn
- mít ướt
ba_cach_doc:
  la_nguoi: Hiểu người khác trước khi họ nói, giữ hết trong lòng, thương mà không phô ra. Bà mẹ ít lời nhưng biết con đang buồn, người vợ dịu mà chắc, cô bạn ai cũng tìm đến tâm sự, ông anh kín tiếng nhìn thấu lòng người. Ngược thì mít ướt, lấy nước mắt ép.
  la_nang_luong: Cảm cho hết rồi mới làm, và lòng có rối cũng không bỏ dở việc. Nghe cho sâu, đọc được cái người kia chưa nói ra, rồi giữ cho mình chứ không đem đi kể. Thương thì thương, nhưng phải có chừng, kẻo tan hết vào người ta.
  la_tinh_huong: 'Có người thương sâu và lo kín đang đứng sau chuyện này, hoặc chuyện đang ở một chỗ cần thấu hiểu: tư vấn, chăm sóc, chuyện nhà cần người chịu nghe. Êm nhờ tình, không nhờ lý. Ngược thì cảm xúc lan tràn, nỗi buồn của người khác thành nỗi buồn mình.'
