lang_kinh:
  tinh_cam: Hai người đang tìm hiểu nhận ra hợp nhau, chuyện thành đôi rất gần; đã cưới hay vừa giận nhau thì đây là lúc làm lành.
  cong_viec: Gặp được một đồng nghiệp hoặc đối tác ăn ý, việc chung hai bên chạy trơn; thoả thuận với một bên duy nhất thì thuận, đông người vào là loãng.
  tien_bac: Tiền bạc chung với một người, chung vốn làm ăn nhỏ hay chung chi tiêu đôi lứa; sòng phẳng có qua có lại thì bền.
  tam_ly: Người hỏi đang nhìn mình qua mắt một người khác, thấy có người hiểu, có người đỡ lời; lòng yên vì có ai đó đứng cùng phía.
  hoc_hanh: Học cặp hợp hơn học một mình, có bạn học hay thầy kèm ăn ý; luận văn có người hướng dẫn hiểu mình muốn gì.
