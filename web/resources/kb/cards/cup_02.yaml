id: cup_02
ten_vi: Hai Cốc
ten_en: Two of Cups
arcana: phu
so: 2
chat: cup
hoang_gia: false
bieu_tuong:
- Một chàng trai và một cô gái đứng đối diện nhau, mỗi người nâng một chiếc cốc vàng, chàng trai vươn tay chạm về phía cốc của cô gái
- Lơ lửng ngay trên hai chiếc cốc là cây gậy có cánh với hai con rắn quấn quanh, trên đỉnh gậy là một đầu sư tử màu đỏ mọc cánh
- Chàng trai mặc áo vàng in hoa, đi giày đỏ vàng, đầu đội vòng lá; cô gái mặc váy trắng khoác áo choàng xanh, đầu đội vòng nguyệt quế
- Hai người đứng trên nền đất bằng, ánh mắt nhìn thẳng vào nhau
- Phía sau là đồi cỏ xanh, trên đồi có một ngôi nhà nhỏ mái đỏ giữa hàng cây
- Bầu trời sáng nhạt, không mây
cot_loi: Hai người nhận ra nhau và tình cảm chảy đều hai chiều, người này đưa thì người kia đón. Chuyện của đúng hai bên hợp ý, vừa mới kết lại, chưa cần ai thứ ba chứng kiến.
tu_khoa_xuoi:
- hai bên hợp ý
- đôi lứa mới kết
- tâm đầu ý hợp
- làm lành
- bắt tay hợp tác
- có qua có lại
- gặp đúng người
- lời hứa đôi bên
tu_khoa_nguoc:
- lệch một bên
- một bên nguội
- hiểu lầm đôi bên
- cãi cọ lứa đôi
- dính nhau quá
- bắt tay đổ bể
- chưa hợp ý
- trở mặt
canh_bao: Hợp nhau đến mức thế giới chỉ còn hai người, bạn bè và việc làm bị gạt ra ngoài, hoặc một bên rót đều mà bên kia chỉ đưa cốc ra hứng, lệch dần rồi trở mặt. Đây là chuyện của đúng hai bên ngang vai, vừa kết lại, nên không đọc thành cầu hôn hay đám cưới, cũng không nới rộng ra hai họ. Trong câu hỏi công việc, hiểu là hợp tác tay đôi, tránh gắn thành tình cảm khi người hỏi không hỏi về tình cảm.
