id: sword_03
ten_vi: Ba Kiếm
ten_en: Three of Swords
arcana: phu
so: 3
chat: kiem
hoang_gia: false
bieu_tuong:
- Một trái tim đỏ lớn choán giữa lá bài, bị ba thanh kiếm đâm xuyên từ trên xuống, lưỡi kiếm ló ra phía dưới
- Ba thanh kiếm cắm chéo nhau, chuôi nằm phía trên trái tim, mũi chĩa xuống
- Không có người, không có mặt đất, chỉ có trái tim treo giữa không trung
- Nền là bầu trời xám đặc mây, mưa rơi thành những vệt chéo trắng xám khắp lá bài
- Trái tim to, đỏ tươi, là mảng màu duy nhất nổi trên nền xám của mây và mưa
- 'Tông màu chủ đạo: xám của mây mưa và đỏ của trái tim'
cot_loi: Đau vì một sự thật đã nói ra, không rút lại được. Chia lìa, đứt đoạn; khác những nỗi buồn khác ở chỗ lý do rành rành ra đó, muốn tự dối là chưa có gì cũng không dối nổi.
tu_khoa_xuoi:
- tim đau
- chia tay
- đứt gánh
- lời thật làm đau
- tin buồn
- xa cách
- phản bội lộ ra
- khóc cho hết
tu_khoa_nguoc:
- nguôi dần
- vết thương khép lại
- tha cho người
- nói ra cho nhẹ
- nuốt đau vào trong
- khơi lại chuyện cũ
- đau âm ỉ kéo dài
canh_bao: Nỗi đau ở đây có lý do rõ, nhưng để lâu thành đau âm ỉ, cứ khơi lại chuyện cũ, hoặc nuốt vào trong rồi làm người bên cạnh khổ theo. Trái tim bị kiếm đâm là tim theo nghĩa lòng, tránh lái sang tim mạch hay bất kỳ bệnh nào. Không mặc định là bị phản bội hay có người thứ ba; có thể là lời thật do chính người hỏi nói ra, hoặc chia xa vì hoàn cảnh, chưa chắc đã là ly hôn.
