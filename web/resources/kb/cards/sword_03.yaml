lang_kinh:
  tinh_cam: Vừa nghe câu chia tay, hay vừa bắt gặp người kia với người khác, vết cắt còn mới, đau vì không thể giả vờ chưa biết; ngược thì nỗi đau cũ đang nguôi dần.
  cong_viec: Nghe sếp nói thẳng năng lực chưa tới, bị gạt khỏi dự án đã dồn tâm huyết, hay người đồng nghiệp thân nhất chuyển đi; lời thật đau, nhưng đây chưa phải mất việc.
  tien_bac: Mất một khoản đau vì người thân quen vay không trả, hay phải chia của khi đường ai nấy đi; tiền đi có lý do rõ, tiếc cũng không đòi lại được.
  tam_ly: Đang ở giữa cơn đau và biết rõ nguyên do, khóc được thì khóc; không cần tự dối rằng chuyện chưa xảy ra, đau cho hết rồi mới nhẹ.
  hoc_hanh: Trượt kỳ thi đã dồn hết sức, bị loại khỏi lớp chọn, hay nhóm học tan rã; kết quả rành rành, tiếc nhưng phải nhìn thẳng mới học lại được.
