id: coin_03
ten_vi: Ba Tiền
ten_en: Three of Pentacles
arcana: phu
so: 3
chat: tien
hoang_gia: false
bieu_tuong:
- Một người thợ trẻ mặc tạp dề đứng trên chiếc ghế dài, tay cầm dụng cụ đục đá, đang làm việc dưới vòm cổng nhà thờ
- Trên vòm đá phía trên đầu người thợ có ba đồng tiền khắc chìm, xếp thành hình tam giác trong hoa văn đá
- 'Hai người đứng cạnh: một thầy tu cạo đỉnh đầu khoác áo choàng sẫm, và một người trùm áo choàng hoa văn loang lổ nhiều màu'
- Hai người này cùng cầm một tờ giấy lớn đang mở ra, ngẩng nhìn về phía người thợ
- Người thợ đứng cao hơn hai người kia, quay mặt về phía họ
- Toàn bộ khung cảnh là bên trong công trình đá màu xám, không thấy bầu trời hay cây cối
cot_loi: Tay nghề được người khác nhìn thấy và cần đến. Làm việc trong một công trình chung, mỗi người một phần, giá trị của mình nằm ở chỗ được giao việc và được ghi nhận.
tu_khoa_xuoi:
- tay nghề có người thấy
- được giao việc
- làm chung một công trình
- chia việc rõ ràng
- thợ giỏi
- có tiếng trong nghề
- ăn ý trong nhóm
- được ghi công
tu_khoa_nguoc:
- làm xoàng
- qua loa
- không ai công nhận
- nhóm rời rạc
- so bì vặt
- mạnh ai nấy làm
- thợ non tay
- tị nạnh
canh_bao: Tay nghề có người thấy dễ thành cần người thấy mới chịu làm, công trình chung dễ thành sân so bì ai góp nhiều hơn. Khi nhóm mạnh ai nấy làm, phần việc rõ trên giấy mà chẳng ai đứng đúng chỗ, lá đã ngược. Không đẩy lá này lên thành thăng chức hay nổi danh; nghĩa chung là thợ được giao việc, không phải ông chủ. Trong tình cảm, ba người trên hình không phải người thứ ba, hai người kia là khách đặt hàng, không phải tình địch.
nguyen_to: tho
chiem_tinh_gd: Sao Hoả ở Ma Kết
chiem_tinh_hd: null
sac_thai:
  trong_luong: nhẹ
  dong_tinh: động vừa
  huong: cùng xây lên
lang_kinh:
  tinh_cam: Hai người đang cùng xây một thứ chung, nhà cửa hay kế hoạch, mỗi người thấy phần mình được người kia ghi nhận; nhà hai họ cũng góp tay.
  cong_viec: Được giao việc đúng tay nghề, sếp và đồng nghiệp thấy giá trị của mình, dự án chạy vì mỗi người biết rõ phần việc.
  tien_bac: Tiền đến từ tay nghề được trả công xứng đáng, được thưởng hay tăng lương vì làm tốt phần việc trong nhóm.
  tam_ly: Thấy mình có ích, có chỗ đứng trong một tập thể, được cần đến; ngược thì tự thấy mình xoàng, chẳng ai để ý.
  hoc_hanh: Học theo nhóm, có thầy hướng dẫn sát, luận văn được góp ý kỹ; bài được công nhận vì tay nghề chứ không phải điểm số suông.
cach_noi_viet:
- một cây làm chẳng nên non
- nhất nghệ tinh, nhất thân vinh
- đúng người đúng việc
- đúng thầy đúng thợ
- có tiếng có miếng
- lắm thầy nhiều ma
