id: wand_01
ten_vi: Át Gậy
ten_en: Ace of Wands
arcana: phu
so: 1
chat: gay
hoang_gia: false
bieu_tuong:
- Một bàn tay vươn ra từ đám mây xám bên phải lá, nắm chặt một cây gậy gỗ to, còn nguyên mấu
- Trên gậy có lá non đang đâm chồi, vài chiếc lá nhỏ rụng lơ lửng quanh gậy trên nền trời
- Bàn tay toả những tia sáng ngắn quanh cổ tay
- Phía dưới là một vùng đất xanh, có dòng sông uốn quanh và hàng cây
- Xa xa một toà lâu đài nhỏ nằm trên đỉnh đồi
- Nền trời nhạt màu, không có người, không có con vật
cot_loi: 'Lửa ban đầu: một ý muốn làm bật lên, còn thô, chưa có kế hoạch, chưa có người đi cùng. Cái mới chỉ là mầm và sức bật, chưa phải việc; mọi chuyện về sau đều khởi từ cái hứng này.'
tu_khoa_xuoi:
- hứng bật lên
- mầm ý tưởng
- lửa mới nhen
- ngứa tay muốn làm
- chưa có kế hoạch
- cơ hội vừa ló
- đam mê vừa nhóm
- sức sống trỗi dậy
tu_khoa_nguoc:
- hứng tắt sớm
- lửa không bén
- ý hay bỏ xó
- chần chừ khởi sự
- bốc đồng
- hăng quá hoá ẩu
- chán ngang
canh_bao: 'Cái hứng này dễ cháy nhanh rồi tắt: hôm nay đăng ký khoá học, sắm đồ nghề, khoe cả nhà, tuần sau bỏ xó; hoặc ý hay nằm trong đầu mãi vì đợi lúc hoàn hảo. Khi luận, giữ nó ở mức mầm. Đừng suy ra thành công hay tiền về, cũng đừng vì chữ sinh sôi mà lái sang chuyện thai sản, dù Waite có nhắc sức sinh sản. Với người đã có đôi lâu năm, tránh đọc thành sắp có người mới.'
