lang_kinh:
  tinh_cam: Vừa gặp ai đó làm người hỏi rạo rực, mới là cảm nắng chưa biết đi tới đâu; có đôi rồi thì là một cái thích chung vừa nhen.
  cong_viec: Nảy ra một ý làm ăn hay nhận được lời mời vào việc mới, hứng lắm mà chưa có kế hoạch; giữ lửa và viết ra thành bước đi trước khi nó nguội.
  tien_bac: 'Vừa ló một nguồn thu mới: lời mời làm thêm, ý bán cái gì đó, khoản lộc bất ngờ; tiền chưa vào tay, mới là cơ hội, phải đi tiếp mới thành tiền.'
  tam_ly: Đang bừng lên một cái muốn trong đầu, ngứa tay ngứa chân, thấy mình có sức làm lại từ đầu; cái hứng này thật, chỉ chưa có hình dạng gì.
  hoc_hanh: Vừa thấy hứng với một môn, một ngành, một khoá học mới, muốn đăng ký ngay; đây là mồi lửa tốt, cần một lịch học cụ thể kẻo tắt sau vài buổi.
cach_noi_viet:
