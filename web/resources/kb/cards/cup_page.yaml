id: cup_page
ten_vi: Tiểu Đồng Cốc
ten_en: Page of Cups
arcana: phu
so: null
chat: cup
hoang_gia: true
bieu_tuong:
- Chàng trai trẻ đứng một mình, tay phải nâng chiếc cốc, từ trong cốc một con cá ló đầu ra nhìn về phía anh ta
- Tay trái chống hông, đầu hơi nghiêng nhìn con cá
- Áo chẽn xanh dương in hoa màu hồng đỏ, mũ xanh có dải khăn dài buông xuống vai
- Đứng trên bờ đất ngay sát mép nước
- Sau lưng là mặt biển gợn sóng lăn tăn
- Trời sáng, nhạt màu
cot_loi: Cảm xúc mới nhú, đến bất ngờ và hơi lạ, còn chưa gọi tên được. Người này tập lắng nghe lòng mình và sẵn lòng giúp người khác; tin tới thường là tin về tình cảm, không phải tin công việc.
tu_khoa_xuoi:
- tin về tình cảm
- xao xuyến đầu
- bất ngờ dễ thương
- chưa rõ là gì
- nghe theo linh cảm
- sẵn lòng giúp
- mơ mộng tuổi mới lớn
- linh tính bật lên
tu_khoa_nguoc:
- giấu lòng
- dụ dỗ ngọt nhạt
- mê nhầm người
- dỗi trẻ con
- mộng át việc thật
- tin tình không vui
- bám dính
- nói dối cho êm
canh_bao: 'Mộng át việc: trốn vào cảm giác dễ chịu về một người, dỗi như trẻ con khi không được đáp lại, hoặc bị dụ bằng lời ngọt mà tưởng là duyên. Đây là lá của tình cảm mới nhú, nên không đọc tin vui thành tin có thai hay chuyện con cái, dù hình cá trong cốc dễ gợi vậy; giữ ở mức một chút xao xuyến, một tin nhắn bất ngờ. Cũng đừng nâng cảm tình mới nhú này thành người định mệnh hay hứa mối này sẽ thành.'
nguyen_to: thuy
chiem_tinh_gd: Thổ của Thuỷ — Công Chúa (Princess); góc phần tư Thiên Bình – Bọ Cạp – Nhân Mã
chiem_tinh_hd: null
sac_thai:
  trong_luong: rất nhẹ
  dong_tinh: động vừa
  huong: lắng nhìn cốc
lang_kinh:
  tinh_cam: Có người mới nhắn hỏi thăm, lòng hơi xao xuyến mà chưa dám gọi tên; nếu đang yêu, sắp có tin về tình cảm đến bất ngờ và dễ thương.
  cong_viec: Có đồng nghiệp trẻ nhiệt tình xin phụ, hoặc một ý mới nhú trong lúc làm; việc thiên về sáng tạo, chăm sóc khách, chưa ra kết quả đo được.
  tien_bac: Tiền chưa phải chuyện lớn lúc này; có quà nhỏ, có người giúp một khoản vì thương chứ không vì tính; mua sắm hay theo cảm xúc hơn theo nhu cầu.
  tam_ly: Lòng đang mềm, dễ rung, mơ nhiều hơn tính; một cảm giác lạ nhú lên chưa gọi được tên, hơi ngại nói ra với ai.
  hoc_hanh: Học theo cảm hứng, hợp nghệ thuật, văn, tâm lý; hay mơ màng trong giờ, có ý lạ nhưng chưa nắn được thành bài.
cach_noi_viet:
- tình trong như đã, mặt ngoài còn e
- linh tính mách bảo
- thương người như thể thương thân
- ăn chưa no, lo chưa tới
- mơ giữa ban ngày
- mật ngọt chết ruồi
ba_cach_doc:
  la_nguoi: Trẻ tuổi hoặc trẻ lòng, dịu, hơi mơ, sẵn lòng giúp mà không tính toán. Cậu em hay nhắn hỏi thăm, cô bạn hay tặng quà nhỏ, đứa con hay kể chuyện cảm xúc, người mới quen chưa dám ngỏ. Cảm nhiều hơn nói, dễ dỗi, dễ rung, thật lòng nhưng chưa chắc tay.
  la_nang_luong: Gặp chuyện này cứ để lòng mềm ra, nghe linh cảm trước rồi mới nghe lý lẽ. Lòng có gì lạ thì để ý, chưa vội gọi tên, chưa vội đòi kết quả. Cái hay là thật với cảm giác của mình; cái yếu là mộng át mất việc thật.
  la_tinh_huong: 'Tin về tình cảm đến bất ngờ: một tin nhắn, lời hỏi thăm, tấm ảnh cũ, lời tỏ ý kín đáo. Chuyện này mới ở mức để ý nhau, có cảm tình, nhú lên mà chưa rõ là gì, chưa đủ để gọi là mối. Ngược thì tin tình không vui, hoặc có lời ngọt đang dụ cần soi lại.'
