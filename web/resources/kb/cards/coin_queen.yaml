id: coin_queen
ten_vi: Hoàng Hậu Tiền
ten_en: Queen of Pentacles
arcana: phu
so: null
chat: tien
hoang_gia: true
bieu_tuong:
- Nữ hoàng ngồi trên ngai, đầu cúi xuống, hai tay ôm đồng tiền đặt trên đùi
- Tay vịn ngai tạc đầu dê, thân ngai chạm những chùm quả, trên đầu là vòm hoa hồng đỏ leo
- Áo đỏ, áo choàng xanh lá, khăn trắng trùm dưới vương miện vàng
- Một con thỏ nâu ở góc dưới bên phải, gần chân ngai
- Đất dưới chân đầy hoa cỏ, phía xa có núi và đồng xanh
- Trời vàng
cot_loi: Giữ cho mọi người quanh mình đủ ăn, đủ ấm, có chỗ nương. Giàu ở chỗ biết lo và rộng tay, không ở chỗ khoe. Cho người khác cái an toàn vật chất là cách người này thương.
tu_khoa_xuoi:
- lo cho no ấm
- tay hòm chìa khoá
- khéo vun vén
- hào phóng
- chỗ dựa vật chất
- thương bằng cái thực
- nhà cửa ấm
- giàu mà kín
tu_khoa_nguoc:
- ngờ vực người nhà
- lo tiền mất ngủ
- đo người bằng của
- bao bọc quá tay
- lo xa thành sợ
- nhà cửa bừa bộn
- thấp thỏm chuyện tiền
- bủn xỉn với nhà
canh_bao: Đêm nằm tính tiền không ngủ, đo người bằng của, ngờ vực chính người nhà; bao bọc quá tay khiến người được lo không lớn nổi. Người luận không lái sinh sôi, vun vén sang mang thai hay con cái; thỏ và hoa trong hình là sung túc, không phải tin bầu bí. Không hứa sắp giàu, không gợi ý nên mua đất hay bỏ tiền vào đâu; và đừng vội gán lá cho mẹ hay vợ của người hỏi.
nguyen_to: tho
chiem_tinh_gd: Thuỷ của Thổ — Hoàng Hậu (Queen); 20° Nhân Mã – 20° Ma Kết
chiem_tinh_hd: null
sac_thai:
  trong_luong: nhẹ
  dong_tinh: tĩnh
  huong: vun vào lòng
lang_kinh:
  tinh_cam: Người bạn đời lo cho người hỏi từ bữa ăn đến chỗ ở, thương bằng cái thực; hai nhà êm vì có người khéo vun vén.
  cong_viec: Quản được cả ngân sách lẫn người, lo cho nhân viên có đủ; làm riêng thì cửa hàng ổn định; công việc là thứ nuôi cả nhà.
  tien_bac: Giữ tay hòm chìa khoá cho cả nhà, chi cho ăn ở đủ đầy, luôn có khoản phòng thân; rộng tay với người nhà nhưng không phô ra ngoài.
  tam_ly: Lo cho người khác đủ ăn đủ ấm trước rồi mới nghĩ tới mình, thấy an khi nhà cửa yên; hễ nhà có gì chưa ổn là thấp thỏm cả đêm.
  hoc_hanh: 'Vừa lo việc nhà vừa học thêm, tính toán để học phí không hụt; hợp ngành thực dụng: quản trị, kế toán, chăm sóc.'
cach_noi_viet:
- khéo ăn thì no, khéo co thì ấm
- tay hòm chìa khoá
- cơm no áo ấm
- lá lành đùm lá rách
- tích cốc phòng cơ
- lo bò trắng răng
ba_cach_doc:
  la_nguoi: 'Tay hòm chìa khoá của cả nhà: lo từ bữa ăn đến tiền học, rộng tay với người thân mà kín với người ngoài. Bà chủ tiệm nuôi cả nhà, người vợ khéo vun vén, ông chú đứng sau lo tiền cho cháu ăn học. Thương bằng cái thực, ít khi nói lời ngọt.'
  la_nang_luong: 'Lo cho người quanh mình đủ ăn đủ ấm trước đã, rồi mới tính chuyện khác. Vun vén cho thực: tính từng khoản ra vào, làm chỗ dựa, cho người ta yên tâm bằng cái thật chứ không bằng lời hứa. Đừng bao bọc quá tay, cũng đừng lo xa đến thành sợ.'
  la_tinh_huong: Hoàn cảnh no ấm, nhà cửa yên, có khoản phòng thân, có người đứng sau lo chuyện vật chất. Chuyện này đang được nuôi chắc, có nền để xây tiếp, không cần vội. Ngược thì thấp thỏm chuyện tiền, ngờ vực người nhà, đo người bằng của.
