id: coin_06
ten_vi: Sáu Tiền
ten_en: Six of Pentacles
arcana: phu
so: 6
chat: tien
hoang_gia: false
bieu_tuong:
- Một thương nhân đứng giữa, một tay giơ cao chiếc cân hai đĩa đang thăng bằng, tay kia thả những đồng xu xuống
- Hai người ăn xin quỳ ở hai bên chân người này, ngửa tay lên hứng
- Thương nhân đội mũ đỏ, khoác áo choàng đỏ dài, đứng thẳng, mắt nhìn xuống một trong hai người quỳ
- Người quỳ bên này khoác áo xanh dương, người bên kia khoác áo vàng đã sờn, cả hai đều bó gọn trong áo choàng
- Sáu đồng tiền treo lơ lửng trên khoảng trời phía sau, xếp thành hai cụm quanh đầu thương nhân
- Phía xa có nhà cửa và bức tường thành, nền trời xám nhạt
cot_loi: Của cải chảy từ người có sang người thiếu, nhưng theo ý người cho. Đang có kẻ cho người nhận; việc của người hỏi là biết mình đứng phía nào, và món này kèm điều kiện gì.
tu_khoa_xuoi:
- kẻ cho người nhận
- được giúp đúng lúc
- ban phát
- chia phần
- cân đo từng đồng
- ơn có qua có lại
- ai trên ai dưới
- thưởng công
tu_khoa_nguoc:
- nợ đè
- cho rồi kể công
- ghen ăn tức ở
- ơn thành gánh nặng
- cân lệch
- tham phần
- của cho có dây
- bị bòn rút
canh_bao: Cho mà kèm dây, nhận mà mang nợ, cân nằm trên tay người cho nên lệch lúc nào tuỳ ý người đó. Lâu ngày kẻ nhận quen ngửa tay, kẻ cho quen kể công. Đọc lá này phải xác định người hỏi đứng ở phía nào trước khi nói gì thêm, đừng mặc định là được cho. Không gợi ý vay ai, vay bao nhiêu, cho ai mượn, và không đọc bàn tay rải xu thành lộc trời; đây là của cho có điều kiện.
nguyen_to: tho
chiem_tinh_gd: Mặt Trăng ở Kim Ngưu
