  huong: rót từ trên xuống
lang_kinh:
  tinh_cam: Một người cho, một người nhận, tiền hay tình cảm, mà phần cho đang nghiêng hẳn về một phía; hỏi kỹ mối này là được chăm hay đang mang ơn.
  cong_viec: Được sếp thưởng, nâng đỡ, giao thêm quyền; hay chính mình đang chia việc, chia phần cho người dưới, ơn có qua có lại.
  tien_bac: Được giúp tiền đúng lúc, vay được, được cho; ngược thì món nợ thành gánh nặng, cho vay rồi kể công.
  tam_ly: Đang tự hỏi mình ở trên hay dưới trong một mối quan hệ, biết ơn hay áy náy; sợ mình nhận nhiều hơn xứng đáng.
  hoc_hanh: Được học bổng, được thầy kèm riêng, có người lo tiền học; nhớ rõ ai đã cho để sau này trả ơn cho đúng.
cach_noi_viet:
- của biếu là của lo, của cho là của nợ
- một miếng khi đói bằng một gói khi no
- ăn quả nhớ kẻ trồng cây
- kẻ ăn không hết, người lần chẳng ra
- há miệng mắc quai
- ăn cây nào rào cây nấy
