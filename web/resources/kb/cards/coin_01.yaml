id: coin_01
ten_vi: Át Tiền
ten_en: Ace of Pentacles
arcana: phu
so: 1
chat: tien
hoang_gia: false
bieu_tuong:
- Một bàn tay từ trong đám mây ở mép phải lá bài vươn ra, nâng một đồng tiền vàng lớn có ngôi sao năm cánh khắc trong vòng tròn
- Đồng tiền là vật duy nhất ở giữa khoảng trời trắng, không có người
- Bên dưới bàn tay là một khu vườn xanh với luống hoa trắng nở dọc lối đi
- Một hàng rào hoa cắt tỉa khép quanh vườn, có vòm cổng mở ở giữa
- Nhìn qua vòm cổng thấy dãy núi xa mờ
- Nền trời trắng, mây trắng, gam màu chủ đạo là vàng của đồng tiền và xanh lá của vườn
cot_loi: Một cơ hội vật chất có thật, cầm được, đo đếm được, vừa đến tay. Mới là hạt giống chứ chưa là mùa, nhưng nền đã chắc, có chỗ để bắt đầu gây dựng bằng việc làm cụ thể.
tu_khoa_xuoi:
- hạt giống tiền
- cơ hội cầm được
- việc mới đến tay
- vốn ban đầu
- mở hàng
- đất tốt để gieo
- nền chắc
- lộc đầu tay
tu_khoa_nguoc:
- cơ hội tuột tay
- vốn chưa về
- hạt chưa nảy mầm
- tiền vào rồi ra
- ham của mờ mắt
- xây trên cát
- chưa chắc ăn
canh_bao: Cầm được cơ hội trong tay mà tưởng đã có cả mùa, nên tiêu trước, khoe trước, hạt chưa nảy mầm đã tính bán quả. Lật lại, cái tưởng chắc rơi mất, tiền về chưa ấm túi đã đi. Lá này chỉ nói có chỗ thật để bắt đầu, không nói kết cục; không biến nó thành lời khuyên xuống tiền mua đất, mua vàng hay coin, cũng đừng đọc thành trúng số, lộc trời cho, vì lộc ở đây phải tự làm mới thành.
