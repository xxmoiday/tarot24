sac_thai:
  trong_luong: nhẹ
  dong_tinh: động vừa
  huong: đặt xuống đất
lang_kinh:
  tinh_cam: Một mối vừa chớm nhưng có nền thật, người kia làm ăn đàng hoàng, tính chuyện lâu dài được; mới là bước đầu, đừng vội đòi cả mùa.
  cong_viec: Lời mời làm việc, hợp đồng hay dự án mới vừa đến tay, điều kiện rõ ràng; nhận rồi phải bắt tay làm ngay thì hạt mới nảy mầm.
  tien_bac: Có khoản tiền mới về hoặc một nguồn thu vừa mở, không lớn nhưng chắc; ngược thì tiền vào chưa kịp ấm túi đã ra.
  tam_ly: Đầu óc thực tế, hăm hở với cái vừa cầm được trong tay, thấy mình có chỗ để bắt đầu lại từ một nền vững.
  hoc_hanh: Vừa đỗ, vừa được nhận vào khoá học hay chỗ học nghề mong muốn; nền có rồi, kết quả về sau tuỳ công học từ giờ.
cach_noi_viet:
- có bột mới gột nên hồ
- đầu xuôi đuôi lọt
- một vốn bốn lời
- tiền tươi thóc thật
- có làm thì mới có ăn
- chưa đỗ ông nghè đã đe hàng tổng
