id: wand_05
ten_vi: Năm Gậy
ten_en: Five of Wands
arcana: phu
so: 5
chat: gay
hoang_gia: false
bieu_tuong:
- Năm chàng trai trẻ đứng chen chúc trên một bãi đất, mỗi người giơ một cây gậy dài
- Các cây gậy chồng chéo lên nhau trên không, không cây nào chạm vào người nào
- Mỗi người mặc áo chẽn màu khác nhau, tay áo và quần bó kiểu thời trung cổ
- 'Tư thế mỗi người một khác: người giơ gậy qua đầu, người cầm ngang, người chống xuống đất'
- Không ai bị thương, không có máu, không ai ngã
- Nền trời xanh trong, mặt đất xanh cỏ, không có nhà cửa hay cây cối
cot_loi: Nhiều người, nhiều ý cùng chen vào một chỗ, ai cũng muốn phần mình mà chưa ai cầm trịch. Va chạm để thử sức, ồn ào mà không thù, không ai thua hẳn; cái lộn xộn này là cạnh tranh, chưa phải chiến tranh.
tu_khoa_xuoi:
- va chạm thử sức
- tranh phần
- cãi nhau ồn ào
- chưa ai cầm trịch
- đua tài
- lộn xộn mà không thù
- nhiều ý chen nhau
- thi thố
tu_khoa_nguoc:
- né va chạm
- cãi ngầm
- tự đấu trong đầu
- chơi xấu
- từ đùa thành thật
- dàn hoà
- bỏ cuộc đua
- mạnh ai nấy về
canh_bao: Trò đấu này biến chất khi có người chơi xấu, cãi đùa thành thù thật, hoặc cả nhóm cãi ngầm, mạnh ai nấy làm rồi việc chung đổ; với một người thì là tự cãi trong đầu tới mức bó tay. Nghĩa ngược của Waite có chữ kiện tụng, không đọc thành sẽ kiện hay thắng thua tại toà. Đừng dựng nên kẻ thù cụ thể hay bên thứ ba phá hoại, trên lá không ai bị thương; đây là ồn ào, chưa phải chiến tranh.
