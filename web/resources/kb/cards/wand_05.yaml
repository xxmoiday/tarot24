  huong: chen vào nhau
lang_kinh:
  tinh_cam: Cãi nhau vặt liên tục, ai cũng muốn phần đúng về mình, hoặc đang có mấy người cùng để ý một đối tượng; ồn ào mà chưa ai ghét ai.
  cong_viec: Phòng ban nhiều ý kiến chen nhau, họp hành cãi ồn mà chưa ai chốt, hoặc đang đua với nhiều ứng viên cho một vị trí; chỉ là thi thố, chưa ai chơi xấu.
  tien_bac: Nhiều khoản chi cùng đòi một lúc, trong nhà mỗi người một ý về tiền chung, hay đang đua giá với nhiều người bán khác; tiền chưa mất, chỉ rối vì ai cũng giành phần.
  tam_ly: Trong đầu nhiều tiếng nói cãi nhau, muốn cái này lại muốn cái kia, không ý nào thắng hẳn; ồn ào vậy thôi, thiếu một tiếng nói cầm trịch.
  hoc_hanh: Học nhóm mà mỗi người một ý, cãi nhau về cách làm bài chung chưa ai nhường; hoặc thi đua trong lớp, đua nhau từng điểm, đua vậy mà lại học vào.
cach_noi_viet:
- chín người mười ý
- lắm thầy nhiều ma
- trống đánh xuôi kèn thổi ngược
- con gà tức nhau tiếng gáy
- cãi nhau như mổ bò
- ông nói gà bà nói vịt
