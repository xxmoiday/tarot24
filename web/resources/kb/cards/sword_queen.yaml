id: sword_queen
ten_vi: Hoàng Hậu Kiếm
ten_en: Queen of Swords
arcana: phu
so: null
chat: kiem
hoang_gia: true
bieu_tuong:
- Nữ hoàng ngồi nghiêng trên ngai đá, tay phải giơ kiếm dựng thẳng đứng, chuôi kiếm tì lên tay vịn ngai
- Tay trái đưa ra phía trước, lòng bàn tay ngửa như đang ra hiệu
- Vương miện chạm hình bướm, ngai tạc hình bướm, mặt thiên thần nhỏ và trăng lưỡi liềm
- Áo choàng màu xám in hình mây, một dải tua đỏ buông từ cổ tay
- Mây trắng thấp phủ quanh chân ngai như thể ngai đặt trên tầng mây
- Một con chim đơn độc bay trên cao
- Phía xa cây cối thưa, trời xanh nhạt
cot_loi: Đã qua mất mát nên nhìn mọi chuyện rất rõ và nói thẳng, không nương tay. Đứng một mình được, không cần ai bênh. Không ác, chỉ không có chỗ cho ảo tưởng.
tu_khoa_xuoi:
- từng đau nên tỉnh
- nói thẳng, lạnh
- sống một mình được
- không ảo tưởng
- soi rõ từng kẽ
- cắt gọn
- chẳng nể ai
- tự chủ, xa cách
tu_khoa_nguoc:
- cay nghiệt
- trả đũa
- ôm hận cũ
- cố chấp, hẹp hòi
- kiểu cách, giả nghiêm
- mềm lòng sai chỗ
- đẩy hết người đi
- lạnh quá hoá độc
canh_bao: Cắt hết người khỏi đời mình, ôm hận cũ để trả đũa, phán xét cay nghiệt, hoặc giả nghiêm cho có kiểu cách; lạnh lâu quá hoá độc. Waite ghi goá bụa, hiếm muộn, tang tóc, nhưng đó là hình ảnh cũ, không đọc thành người thân sắp mất, không có con, hay bất kỳ chuyện thai sản nào; chỉ giữ ý từng qua mất mát nên tỉnh. Không lấy sự sắc sảo của lá làm cớ khuyên người hỏi cắt đứt một mối.
nguyen_to: khi
chiem_tinh_gd: Thuỷ của Khí — Hoàng Hậu (Queen); 20° Xử Nữ – 20° Thiên Bình
chiem_tinh_hd: null
sac_thai:
  trong_luong: nặng
  dong_tinh: tĩnh
  huong: nhìn thẳng cắt gọn
lang_kinh:
  tinh_cam: Người từng đổ vỡ, giờ sống một mình rất ổn, đặt điều kiện rõ với người mới; nếu đang yêu, cần khoảng cách hơn lời ngọt.
  cong_viec: Làm với người đòi hỏi cao, chấm không nể, phản hồi thẳng vào chỗ yếu; người hỏi từng cay ở chỗ cũ nên giờ chọn việc rất kỹ.
  tien_bac: Tự lo tiền sau khi chia tay hay mất chỗ dựa, chi tiêu tỉnh, không cho vay vì cả nể; tính rõ từng khoản, kể cả với người thân.
  tam_ly: Đã tỉnh sau tổn thương, không cho mình mơ nữa, nhìn mọi thứ rất rõ nhưng hơi lạnh với chính mình; chuyện cũ nhắc lại vẫn còn gợn.
  hoc_hanh: Học một mình hiệu quả hơn học nhóm, tự chấm mình nghiêm, không nhận lời khen suông; người hướng dẫn chấm thẳng, không nương tay.
cach_noi_viet:
- chim sợ cành cong
- sự thật mất lòng
- mất lòng trước, được lòng sau
- một thân một mình
- lạnh như tiền
- cạn tàu ráo máng
ba_cach_doc:
  la_nguoi: Từng đau nên giờ nhìn rất rõ, nói thẳng, lạnh, không nương tay và không cần ai bênh. Bà mẹ chồng đặt điều kiện rõ, cô sếp chấm không nể, người bạn sau đổ vỡ sống một mình rất ổn. Không ác, chỉ không có chỗ cho ảo tưởng; đàn ông đã trải cũng vậy.
  la_nang_luong: 'Với chuyện này, giữ khoảng cách và nói điều kiện ngay từ đầu: cái gì được, cái gì không, nói cho xong. Cắt gọn, gọi đúng tên sự việc, không cho mình mơ. Chuyện cũ đã trải là vốn chứ không phải vết; chỉ đừng lạnh lâu quá mà hoá độc với cả chính mình.'
  la_tinh_huong: 'Hoàn cảnh sau một chia cắt hoặc mất mát: ở một mình, tự lo, xa người thân, một giai đoạn đã khép. Chuyện này cần lời thẳng hơn lời ngọt, cần nhìn rõ hơn hy vọng. Ngược thì có người cay nghiệt, trả đũa, ôm hận cũ chen vào.'
