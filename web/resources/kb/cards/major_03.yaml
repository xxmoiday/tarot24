lang_kinh:
  tinh_cam: Được yêu chiều, được chăm, mối này ấm và đầy; đã cưới thì nhà cửa êm, gia đình hai bên dễ chịu, người hỏi là chỗ dựa mềm cho bên kia.
  cong_viec: Việc đang lớn dần theo nhịp tự nhiên, không cần ép; hợp việc chăm sóc, sáng tạo, làm đẹp, nuôi đội nhóm hơn là việc tranh giành thứ hạng.
  tien_bac: Tiền vào đều và đủ tiêu, có của ăn của để, nhà không thiếu gì; cái dồi dào này dễ thành tiêu quá tay cho người khác mà quên phần mình.
  tam_ly: Thấy mình đủ, dễ chịu với thân thể và cuộc sống, muốn chăm người; nhưng cái đầy này dễ thành bao bọc quá, khó để người khác tự đi.
  hoc_hanh: Học trong môi trường được nâng đỡ, có người kèm, học theo hứng; tiến bộ tự nhiên nhưng thiếu kỷ luật khi tới kỳ thi cần cày.
cach_noi_viet:
- cơm no áo ấm
- của ăn của để
- mưa thuận gió hoà
- nâng như nâng trứng, hứng như hứng hoa
- cây nhà lá vườn
- thương cho roi cho vọt, ghét cho ngọt cho bùi
