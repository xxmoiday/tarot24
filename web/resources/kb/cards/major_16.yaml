ten_vi: Toà Tháp
ten_en: The Tower
arcana: chinh
so: 16
chat: null
hoang_gia: false
bieu_tuong:
- Toà tháp đá xám dựng trên mỏm đá, bị tia sét từ trên trời đánh trúng đỉnh
- Chiếc vương miện trên nóc tháp bật tung lên không
- Lửa bốc ra từ các cửa sổ và đỉnh tháp
- Hai người rơi từ trên tháp xuống, đầu chúc xuống trước; một người mặc áo xanh đội vương miện, người kia mặc áo đỏ
- Những giọt lửa nhỏ hình giọt nước rơi lả tả trong không trung quanh tháp
- Nền trời đen kịt, mây xám cuộn ở một bên
cot_loi: Cái xây trên nền sai sụp trong một cú, không báo trước. Đổ vỡ đột ngột, mất chỗ đứng, sự thật phơi ra khi cái vỏ bị phá; đau, nhưng thứ đổ là thứ đằng nào cũng không đứng được.
tu_khoa_xuoi:
- sét đánh
- sụp trong một cú
- mất chỗ đứng
- vỡ lở
- lộ sự thật
- đổ vì nền sai
- sốc bất ngờ
- đằng nào cũng đổ
tu_khoa_nguoc:
- tránh được cú sụp
- nứt mà cố chống
- đổ từ từ
- sợ sụp mà không dám nhìn
- sụp trong âm thầm
- dựng lại sau đổ
- tự phá trước khi bị phá
- kéo dài cái phải đổ
canh_bao: Sụp mà cố chống, nứt rồi vẫn trát vỏ, hoặc sợ đến mức tự phá trước khi bị phá. Không đọc lá này thành tai nạn, cháy nhà, bệnh đột ngột hay ai đó gặp nạn; sét đánh là hình ảnh của một sự thật bung ra, không phải tai hoạ thể xác. Tránh hù người hỏi bằng ngày giờ hay câu sắp có chuyện lớn chung chung; nói rõ cái đổ là cái đã mỏng sẵn, và mỏng ở đâu.
