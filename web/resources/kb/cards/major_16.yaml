  trong_luong: rất nặng
  dong_tinh: động đột ngột
  huong: rơi xuống
lang_kinh:
  tinh_cam: 'Chuyện vỡ đột ngột: lộ chuyện giấu, cãi lớn, chia tay trong một tối; cái đổ là cái xây trên nền không thật, ngược thì là rạn mà cố giữ vỏ.'
  cong_viec: Mất việc bất ngờ, dự án sụp, công ty biến động lớn, một sự thật ở chỗ làm bung ra; cái vỡ này lộ chỗ hổng đã có từ lâu.
  tien_bac: Mất tiền đột ngột, kế hoạch tài chính đổ, một khoản dựa dẫm biến mất; đau nhưng cho thấy chỗ đã mỏng từ trước.
  tam_ly: Niềm tin cũ về mình hay về người sụp một lúc, chao đảo, sốc; nhưng cái vỡ là cái vỏ, sự thật trần trụi hiện ra sau đó.
  hoc_hanh: Trượt bất ngờ, mất suất, đổi quy chế thi, phát hiện học sai hướng từ lâu; sốc này buộc dựng lại cách học từ nền.
cach_noi_viet:
- sét đánh ngang tai
- đùng một cái
- trở tay không kịp
- giấy không gói được lửa
- tan tành mây khói
- mất bò mới lo làm chuồng
