id: wand_06
ten_vi: Sáu Gậy
ten_en: Six of Wands
arcana: phu
so: 6
chat: gay
hoang_gia: false
bieu_tuong:
- Một người cưỡi ngựa trắng, trên đầu đội vòng nguyệt quế, tay cầm một cây gậy có treo thêm vòng nguyệt quế thứ hai
- Người cưỡi mặc áo choàng đỏ, ngồi thẳng lưng, nhìn về phía trước
- Con ngựa phủ tấm vải màu xanh lá phủ kín thân, chỉ lộ đầu và chân
- Những người đi bộ vây quanh ngựa, mỗi người cầm một cây gậy dựng đứng, tổng cộng sáu gậy trên lá
- Đoàn người đi thành hàng, tư thế như đang diễu hành
- Nền trời xanh nhạt, mặt đất xanh cỏ, không có nhà cửa
cot_loi: Thắng và được người khác thấy mình thắng. Công sức đã thành tin tốt đưa về, được đám đông công nhận; cái chính không phải làm xong, mà là được người ta nhìn nhận ngay trước mặt đông người.
tu_khoa_xuoi:
- thắng được công nhận
- tin thắng lợi
- tin vui đưa về
- được khen trước mặt
- đám đông tung hô
- kết quả công khai
- tiếng tăm lên
- ngẩng cao đầu
tu_khoa_nguoc:
- ngã ngựa
- mất mặt
- thắng không ai hay
- chưa được ghi công
- hám tiếng
- kiêu sau thắng
- bị quay lưng
- hoãn vô thời hạn
canh_bao: 'Thắng công khai dễ thành thắng cho người xem: chạy theo lời khen, kiêu sau thắng, hay ngược lại làm được mà không ai hay, chờ ghi công mãi rồi bị nhận mất. Không biến lá này thành lời hứa thắng thầu, thắng kiện hay trúng tuyển chắc chắn; nó nói tin tốt được công nhận, không xác nhận kết quả pháp lý. Nghĩa ngược có chữ phản bội, đừng vội chỉ mặt một người cụ thể là kẻ phản; đọc thành nỗi lo bị quay lưng là đủ.'
nguyen_to: hoa
chiem_tinh_gd: Sao Mộc ở Sư Tử
chiem_tinh_hd: null
sac_thai:
  trong_luong: nhẹ
  dong_tinh: động vừa
  huong: tiến vào đám đông
lang_kinh:
  tinh_cam: 'Mối này được công khai: đăng ảnh, dẫn đi gặp bạn bè, ai cũng khen xứng đôi; nếu ngược thì trong lòng lo cái vẻ đẹp đôi ấy chỉ để người ngoài xem.'
  cong_viec: Được thăng chức, được khen trước cả phòng, trúng tuyển giữa nhiều người, dự án thắng thầu; phần thưởng thật là được nhìn nhận, coi chừng kiêu sau thắng.
  tien_bac: Được thưởng, được tăng lương công khai, khoản chờ lâu về đúng lúc để khoe được với nhà; tiền này đi kèm tiếng, dễ tiêu quá tay để giữ tiếng.
  tam_ly: Đang thấy mình được nhìn nhận, ngẩng đầu đi giữa người ta, tự tin lên rõ; nếu ngược thì thấy mình chỉ ổn khi có người vỗ tay, vắng khen là hụt.
  hoc_hanh: Điểm cao được đọc tên trước lớp, đậu vào trường mong muốn, được thầy cô lấy làm gương; lời khen là thật, cái khó là giữ phong độ sau khen.
cach_noi_viet:
- áo gấm về làng
- vinh quy bái tổ
- nở mày nở mặt
- tiếng lành đồn xa
- thắng không kiêu, bại không nản
- hữu danh vô thực
