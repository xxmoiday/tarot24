id: wand_03
ten_vi: Ba Gậy
ten_en: Three of Wands
arcana: phu
so: 3
chat: gay
hoang_gia: false
bieu_tuong:
- Một người đàn ông đứng quay lưng hẳn về phía người xem, trên mỏm đá cao, nhìn ra biển
- Ba cây gậy cắm thẳng xuống đất, người này tựa tay phải lên một cây gậy
- Áo choàng dài màu đỏ, một dải vải kẻ ô vắt chéo qua vai, đầu quấn dải băng
- Mặt biển và bầu trời cùng một màu vàng cam, không phân biệt đường chân trời rõ
- Trên mặt biển có vài con thuyền buồm nhỏ đang đi
- Bên trái xa xa là dãy núi thấp màu tối
- Mỏm đất người này đứng màu nâu xám, không cây cỏ
cot_loi: Đã bước ra và gửi việc đi rồi, giờ chỉ còn nhìn theo, chờ kết quả về từ xa. Việc đã vượt khỏi tầm tay, cần nhìn dài và có người ở phía bên kia hợp sức; thành hay không giờ nằm ở đường về.
tu_khoa_xuoi:
- chờ tin từ xa
- thuyền đã ra khơi
- việc đã gửi đi
- mở đường làm ăn
- bạn hàng ở xa
- nhìn dài
- hàng đang về
- ngoài tầm tay
tu_khoa_nguoc:
- hàng về trễ
- đợi mãi không thấy
- tin về xấu
- với quá tầm
- đối tác lặn
- đổ giữa chừng
- chưa tính đường lui
canh_bao: 'Ở mặt xấu, đây là chờ mòn: thuyền đi mãi không về, đối tác im bặt, người hỏi bỏ hết việc trước mắt để ngóng một thứ ngoài tầm với. Chớ đọc mấy con thuyền thành tiền về chắc chắn, cũng chớ gợi ý góp vốn hay bỏ thêm tiền vì thấy chữ làm ăn. Trong tình cảm, quay lưng không phải bị bỏ rơi; nó chỉ nói người hỏi đã làm xong phần mình. Lá này nói đường về chưa rõ, không cho biết kết quả tốt hay xấu.'
nguyen_to: hoa
chiem_tinh_gd: Mặt Trời ở Bạch Dương
chiem_tinh_hd: null
sac_thai:
  trong_luong: nhẹ
  dong_tinh: tĩnh
  huong: dõi theo phía xa
lang_kinh:
  tinh_cam: Đã tỏ tình, đã nhắn, đã bay sang thăm rồi, giờ chỉ còn chờ người kia trả lời; yêu xa hay quen qua mạng, phần còn lại nằm ở phía họ.
  cong_viec: Hồ sơ đã nộp, hàng đã gửi, đề xuất đã trình đi, giờ chờ hồi âm từ sếp hay đối tác ở xa; thành hay không nằm ở đầu bên kia, ngoài tầm với.
  tien_bac: Tiền đã bỏ ra rồi, hàng đã đi, vốn đã góp với người ở xa, giờ chờ tiền về; khoản này chưa về là chưa tính được gì, đường về mới quyết lời hay lỗ.
  tam_ly: Đầu óc hướng cả ra xa, đã làm phần mình nên chỉ còn chờ; nửa tự tin nửa sốt ruột, cảm giác trống vì việc đã ra khỏi tay.
  hoc_hanh: Bài đã nộp, hồ sơ học bổng đã gửi, đã thi xong và chỉ còn chờ điểm; phần mình đã làm, kết quả nằm ở ban chấm bên kia, sốt ruột cũng không đổi được.
cach_noi_viet:
- mưu sự tại nhân, thành sự tại thiên
- buôn có bạn bán có phường
- trông đứng trông ngồi
- mong như mong mẹ về chợ
- bặt vô âm tín
- đếm cua trong lỗ
